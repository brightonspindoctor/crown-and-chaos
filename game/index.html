<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crown & Fable: Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Crown & Fable playable prototype. Colours and type come from the Crown & Fable design system (Gallery theme).
   Battle on a phone: enemy pyramid on top, yours below. On desktop: yours on the left, the enemy's on the right. */
:root {
  --surface: #17110c; --raised: #221912; --ink: #efe4cc; --muted: #b9a68c; --line: #3a2c20;
  --gold-text: #d9b763; --gold-leaf: #c9a24a; --gold-shade: #8a6424;
  --ultramarine: #1f3a6e; --umber: #4a3222; --oxblood: #6e2a22; --vermilion: #b5381f; --verdigris: #2f5f51;
  --paper: #efe4cc; --card-ink: #2a1d14; --card-muted: #5e4a39;
  --display: Cinzel, "Trajan Pro", Georgia, serif;
  --serif: "EB Garamond", Garamond, Georgia, serif;
  --head: 40px; --dock: 160px;
  --ch: clamp(62px, calc((100dvh - var(--head) - var(--dock) - 62px) / 6), 132px);
  --cw: min(calc((100vw - 28px) / 3.25), calc(var(--ch) * 1.12));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--surface); color: var(--ink); font: 16px/1.3 var(--serif); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold-text); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
.dt { display: none; }
[hidden] { display: none !important; }
#app { height: 100dvh; position: relative; }
#battle { height: 100%; display: flex; flex-direction: column; }

/* ---------- battle header ---------- */
#head { height: var(--head); flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
#head .round { text-align: left; font: 600 12px/1.15 var(--display); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; white-space: nowrap; display: flex; flex-direction: column; }
#head .round i { font: italic 400 11.5px/1.1 var(--serif); letter-spacing: 0; text-transform: none; color: var(--muted); }
#head .round i.now { color: #a9bfe6; }
#head .place { text-align: center; min-width: 0; }
#head .place b { display: block; font: 600 13px/1.15 var(--display); letter-spacing: .1em; color: var(--gold-text); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#head .place i { display: block; font-size: 11px; line-height: 1.1; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#head .round.focus { animation: glow 1.1s ease-in-out infinite alternate; border-radius: 4px; padding: 2px 4px; }
#head .menu { font: 600 11px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 10px 0 10px 10px; white-space: nowrap; }
#head .menu:hover { color: var(--ink); }

/* ---------- animation layer (play/fx.css), with this page's names for the colours it uses ---------- */
:root { --gold: var(--gold-leaf); --body: var(--serif); --felt: var(--surface); --panel: var(--raised); --red: var(--vermilion); }
/* Animation layer, shared by the playtest table and the prototype (see play/fx.js). */
.fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
.fx-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.fx { position: fixed; pointer-events: none; will-change: transform, opacity; }
.card { position: relative; transition: box-shadow .15s; }
.card.fx-front { z-index: 25; }
.card.fx-acting { box-shadow: 0 0 0 3px var(--gold), 0 0 18px color-mix(in srgb, var(--gold) 70%, transparent); translate: 0 -3px; z-index: 22; }
.card.fx-hurt { background: color-mix(in srgb, #e04a2f 30%, var(--panel)); }
.card.fx-healed { box-shadow: 0 0 0 3px #6fcf73, 0 0 20px #8ee08a; }
.card.fx-strike { box-shadow: 0 0 0 3px #e04a2f; }
.card.fx-fallen { opacity: .28; filter: grayscale(1); }
.card.fx-fallen .nm { text-decoration: line-through; }
.card.fx-stopped::after, .card.fx-frozen::after { content: ""; position: absolute; inset: 0; border-radius: 6px; pointer-events: none; }
.card.fx-stopped::after { background: repeating-linear-gradient(135deg, transparent 0 7px, rgba(120,120,120,.35) 7px 10px); }
.card.fx-frozen::after { background: linear-gradient(160deg, rgba(190,230,255,.65), rgba(140,200,255,.25)); box-shadow: inset 0 0 12px #bfe6ff; }
.hp-pop { display: inline-block; animation: hp-pop .45s ease-out; }
@keyframes hp-pop { 0% { transform: scale(1.6); color: var(--gold); } 100% { transform: scale(1); } }
.board.fx-night { background: radial-gradient(ellipse at 50% 50%, rgba(30,30,70,.18), rgba(10,10,40,.38)); border-radius: 8px; }
.mid.fx-phase { animation: phase .5s ease-out; color: var(--ink); }
@keyframes phase { 0% { background: color-mix(in srgb, var(--gold) 35%, transparent); } 100% { background: transparent; } }
.fx-text { font: 700 22px/1 var(--body); white-space: nowrap; text-shadow: 0 2px 0 rgba(0,0,0,.55), 0 0 6px rgba(0,0,0,.4); z-index: 30; }
.fx-text.fx-small { font-size: 14px; }
.fx-text.fx-big { font-size: 30px; }
.fx-dmg { color: #ff5a3c; } .fx-heal { color: #6fe07a; } .fx-guard { color: #9cc4f0; } .fx-gold { color: #ffd45c; }
.fx-miss { color: #e8ecdf; font-style: italic; } .fx-stop { color: #d0d0d0; } .fx-frost { color: #bfe6ff; } .fx-poison { color: #8fd14f; }
.fx-sleep { color: #e8dcc0; font-size: 16px; letter-spacing: .2em; }
.fx-tag { font: 700 13px/1 var(--body); background: var(--ink); color: var(--felt); padding: 5px 9px; border-radius: 99px; white-space: nowrap; z-index: 31; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.fx-tag.fx-tag-auto { font-weight: 400; font-size: 12px; opacity: .9; }
.fx-p { width: 7px; height: 7px; border-radius: 50%; }
.fx-p.fx-drop { border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
.fx-p.fx-crumb { border-radius: 2px; width: 6px; height: 5px; }
.fx-p.fx-thread { width: 14px; height: 2px; border-radius: 1px; }
.fx-p.fx-bubble { width: 9px; height: 9px; background: rgba(120,200,80,.55) !important; border: 1px solid #8fd14f; }
.fx-slash { width: 3px; height: 54px; background: linear-gradient(transparent, #fff, #ff6a4a, transparent); border-radius: 2px; }
.fx-arrow { width: 44px; height: 10px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
.fx-arrow svg { display: block; overflow: visible; }
.fx-beam { height: 8px; transform-origin: 0 50%; border-radius: 4px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--c) 40%, transparent), var(--c) 30%, #fff 50%, var(--c) 70%, color-mix(in srgb, var(--c) 60%, transparent));
  box-shadow: 0 0 14px var(--c), 0 0 4px #fff; }
.fx-beam.fx-wave { height: 14px; border-radius: 50%; background: repeating-linear-gradient(90deg, var(--c) 0 12px, #e6ffff 12px 16px); opacity: .9; }
.fx-orb { width: 22px; height: 22px; border-radius: 50%; transform: translate(-50%,-50%); background: radial-gradient(#fff, var(--c) 55%, transparent 70%); box-shadow: 0 0 18px var(--c); }
.fx-shield svg { display: block; filter: drop-shadow(0 0 6px #9cc4f0); }
.fx-sword svg { display: block; filter: drop-shadow(0 0 6px #fff); }
.fx-pillar { width: 70px; height: 150px; transform-origin: 50% 100%; background: linear-gradient(transparent, rgba(255,240,180,.85), transparent); filter: blur(2px); }
.fx-pillar.fx-smoke { background: radial-gradient(ellipse at 50% 70%, rgba(200,195,185,.8), transparent 70%); }
.fx-item { width: 116px; transform-style: preserve-3d; background: #2a1712; border: 2px solid #c9a24a; border-radius: 8px; padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.55); z-index: 28; }
.fx-item.fx-item-red { border-color: var(--red); }
.fx-item-art { height: 68px; border-radius: 4px; background: #5a3c22 center/cover; }
.fx-item-name { font: 700 12px/1.2 var(--body); color: #f1e6cc; text-align: center; padding: 4px 0 1px; }
.fx-item.fx-glint .fx-item-art { position: relative; overflow: hidden; }
.fx-item.fx-glint .fx-item-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.75) 50%, transparent 65%); animation: glint .5s ease-out; }
@keyframes glint { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
@media (prefers-reduced-motion: reduce) { .card.fx-acting { translate: none; } .hp-pop { animation: none; } }

.mid.fx-phase { justify-content: center; height: 10px; font: italic 13px/1 var(--serif); color: var(--ink); white-space: nowrap; text-shadow: 0 1px 3px #000; }
.mid.fx-phase::before { display: none; }
#table.fx-night::before { background: linear-gradient(rgba(8,12,30,.84), rgba(6,8,20,.92)); }
.card.slot.fx-revived { border: 1px solid var(--gold-leaf); background: #1c130c; color: var(--ink); align-items: center; justify-content: center; font: 600 .8em/1.2 var(--display); text-align: center; }

/* ---------- the table ---------- */
#table { flex: 1; min-height: 0; position: relative; background: #0c0805 center / cover no-repeat; }
#table::before { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(23,17,12,.72), rgba(23,17,12,.82)); transition: background 1.2s; }
#table.night::before { background: linear-gradient(rgba(8,12,30,.84), rgba(6,8,20,.92)); }
#board { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.side { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.side.me { flex-direction: column-reverse; }
.rank { display: flex; gap: 6px; justify-content: center; }
.mid { height: 10px; width: 100%; display: flex; align-items: center; }
.mid::before { content: ""; flex: 1; border-top: 1px dashed rgba(201,162,74,.45); margin: 0 10px; }
/* The Fate token sits on the side of whoever holds it, and crosses the board when it changes hands. */
#fate { position: absolute; z-index: 6; left: 8px; top: 8px; width: 70px; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: top .9s cubic-bezier(.5,0,.3,1), left .9s cubic-bezier(.5,0,.3,1); pointer-events: none; }
#fate.mine { top: calc(100% - 68px); }
#fate b { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 700 9px/1 var(--display); letter-spacing: .04em; color: #2a1d14;
  background: radial-gradient(circle at 35% 30%, #f1dc9a, var(--gold-leaf) 55%, var(--gold-shade)); box-shadow: 0 1px 5px rgba(0,0,0,.7); }
#fate i { font-size: 12px; line-height: 1; color: var(--ink); text-shadow: 0 1px 3px #000; white-space: nowrap; }
#fate.focus b { animation: glow 1.1s ease-in-out infinite alternate; }

/* ---------- small cards (board, line-up, collection) ---------- */
.card { position: relative; width: var(--cw); height: var(--ch); flex: none; display: flex; flex-direction: column; gap: calc(var(--cw) * .03);
  padding: calc(var(--cw) * .045); border-radius: calc(var(--cw) * .08); font-size: calc(var(--cw) * .118); text-align: left;
  background: #2a1c12; border: max(2px, calc(var(--cw) * .028)) solid #5d4330; box-shadow: 0 2px 8px rgba(20,13,8,.55); transition: transform .18s, opacity .25s, filter .25s; }
.card.hero { background: #1c130c; border-color: var(--gold-leaf); box-shadow: inset 0 0 0 1px var(--gold-shade), 0 2px 8px rgba(20,13,8,.55); }
.card.item { background: #24120e; border-color: #8a3a2e; }
.card.slot { background: none; border: 1px dashed rgba(185,166,140,.2); box-shadow: none; cursor: default; }
.card.slot.pick { cursor: pointer; border-color: rgba(217,183,99,.55); background: rgba(23,17,12,.5); align-items: center; justify-content: center; gap: 2px; color: var(--muted); font: 600 .8em/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; text-align: center; }
.card.slot.pick b { font-size: 1.9em; line-height: 1; color: var(--gold-text); font-weight: 500; }
.card.slot.off { opacity: .5; cursor: default; }
.nm { font: 600 .82em/1.25 var(--display); letter-spacing: .03em; text-align: center; white-space: nowrap; overflow: hidden; border-radius: 2px; background: var(--umber); padding: 0 .15em; flex: none; text-transform: uppercase; }
.hero .nm { background: var(--ultramarine); } .item .nm { background: var(--oxblood); }
.art { flex: 1; min-height: 0; overflow: hidden; border-radius: 2px; position: relative; background: #0c0805; }
.art img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
.stats { flex: none; display: flex; align-items: center; gap: .35em; font: 700 1.05em/1 var(--display); height: 1.35em; }
.stats svg { width: .95em; height: .95em; flex: none; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.stats em { font: italic 400 .8em/1 var(--serif); color: var(--muted); white-space: nowrap; }
.atk { display: flex; align-items: center; gap: .2em; }
.grd { width: 1.15em; height: 1.15em; transform: rotate(45deg); background: #35507f; border: 1px solid #9fb3d6; display: grid; place-items: center; margin-left: .25em; }
.grd b { transform: rotate(-45deg); font-size: .78em; }
.hp { margin-left: auto; min-width: 1.75em; text-align: center; padding: .16em .2em .5em; margin-bottom: -.32em; background: #8f2a16; clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%); }
.hp.hurt { color: #ffd9c9; }
.seal, .crownmark, .count { position: absolute; top: -.5em; width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center; z-index: 2; box-shadow: 0 1px 3px rgba(0,0,0,.6); }
.seal { left: -.5em; background: var(--vermilion); border: 1px solid #e9b9a6; font: 700 .9em/1 var(--display); }
.seal.auto { background: var(--umber); border-color: #b9a47e; }
.seal.auto svg { width: 1em; height: 1em; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.crownmark { right: -.5em; background: #1c130c; border: 1px solid var(--gold-leaf); }
.crownmark svg { width: 1.05em; height: 1.05em; fill: var(--gold-leaf); }
.count { right: -.5em; width: auto; min-width: 1.6em; padding: 0 .3em; border-radius: 1em; background: var(--surface); border: 1px solid var(--muted); font: 700 .85em/1 var(--display); }
.coin { position: absolute; right: .25em; bottom: .25em; min-width: 1.7em; height: 1.7em; padding: 0 .2em; border-radius: 50%; display: grid; place-items: center; font: 700 .85em/1 var(--display); color: #2a1d14;
  background: radial-gradient(circle at 35% 30%, #f1dc9a, var(--gold-leaf) 60%, var(--gold-shade)); box-shadow: 0 1px 3px rgba(0,0,0,.6); }
.order, .badge { position: absolute; left: 0; right: 0; bottom: 0; font: 600 .78em/1.5 var(--display); letter-spacing: .03em; text-align: center; white-space: nowrap; overflow: hidden; background: rgba(47,95,81,.94); }
.badge { background: rgba(110,42,34,.94); }
.card.focus, .card.can { animation: glow 1.1s ease-in-out infinite alternate; z-index: 3; }
.card.dim { opacity: .5; }
.card.acting { transform: scale(1.07); z-index: 4; box-shadow: 0 0 0 2px #f1dc9a, 0 10px 24px rgba(20,13,8,.7); }
.card.hit { animation: shake .4s; }
.card.fallen { opacity: .28; filter: grayscale(1); }
.card.stopped { filter: saturate(.4) brightness(.8); }
.float { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); font: 700 1.9em/1 var(--display); z-index: 5; pointer-events: none; text-shadow: 0 0 6px #000, 0 2px 2px #000; animation: rise 1.2s ease-out forwards; white-space: nowrap; }
.float.dmg { color: #ff8f73; } .float.heal { color: #8fe0c2; } .float.blk { color: #c9d6f0; font-size: 1.05em; }
@keyframes glow { from { box-shadow: 0 0 0 2px var(--gold-text), 0 0 6px 2px rgba(217,183,99,.35); } to { box-shadow: 0 0 0 3px #f6e3a6, 0 0 18px 7px rgba(217,183,99,.7); } }
@keyframes shake { 20% { transform: translateX(-5px); } 45% { transform: translateX(5px); } 70% { transform: translateX(-3px); } }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.7); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -110%); } }

/* ---------- battle dock ---------- */
#dock { height: var(--dock); flex: none; display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 10px; background: var(--raised); border-top: 1px solid var(--gold-shade); }
.coach { flex: 1; min-height: 0; overflow-y: auto; font-size: 15.5px; line-height: 1.26; }
.coach p { text-wrap: pretty; }
.who { font: 600 10px/1.4 var(--display); letter-spacing: .14em; color: var(--gold-text); text-transform: uppercase; display: block; }
.coach.nudge { animation: shake .4s; }
.chips { display: flex; gap: 6px; margin-top: 5px; overflow-x: auto; scrollbar-width: none; }
.chip { flex: none; white-space: nowrap; font-size: 13px; line-height: 1.2; border: 1px solid var(--line); border-radius: 99px; padding: 2px 4px 2px 9px; display: inline-flex; align-items: center; gap: 4px; background: var(--surface); min-height: 26px; }
.chip button { width: 22px; height: 22px; border-radius: 50%; color: var(--muted); font-size: 15px; line-height: 1; }
button.chip { padding: 2px 10px; border-color: var(--gold-shade); color: var(--gold-text); }
.ctl { flex: none; display: flex; align-items: center; gap: 10px; height: 40px; }
.ap { display: flex; align-items: center; gap: 4px; }
.ap span { font: 600 10px/1 var(--display); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-right: 3px; }
.pip { width: 15px; height: 15px; border-radius: 50%; border: 1px dashed var(--gold-shade); display: inline-block; flex: none; }
.pip.on { border: 1px solid var(--gold-shade); background: radial-gradient(circle at 35% 30%, #f1dc9a, var(--gold-leaf) 60%, var(--gold-shade)); }
.belt { display: flex; gap: 6px; min-width: 0; }
.belt .item { height: 38px; display: flex; align-items: center; gap: 6px; padding: 2px; border: 1px solid #8a3a2e; border-radius: 6px; background: #1c130c; font-size: 14px; white-space: nowrap; }
.belt .item img { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; display: block; }
.belt .item.solo { padding-right: 9px; }
.belt .item.focus { animation: glow 1.1s ease-in-out infinite alternate; }
.belt .item:disabled { opacity: .45; cursor: default; }
.grow { flex: 1; }
.btn { height: 40px; padding: 0 16px; border-radius: 6px; font: 700 12.5px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; color: #2a1d14;
  background: linear-gradient(#e9cf85, var(--gold-leaf)); border: 1px solid var(--gold-shade); box-shadow: 0 2px 6px rgba(0,0,0,.45); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.quiet { background: none; color: var(--gold-text); border-color: var(--gold-shade); box-shadow: none; }
.btn.focus { animation: glow 1.1s ease-in-out infinite alternate; }
.btn.big { height: 50px; font-size: 14px; }

/* ---------- sheets and panels ---------- */
#sheet:empty, #over:empty { display: none; }
#sheet { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(12,8,5,.6); }
.sheet { width: min(560px, 100%); max-height: 88dvh; overflow-y: auto; background: var(--raised); border: 1px solid var(--gold-shade); border-bottom: 0; border-radius: 14px 14px 0 0; padding: 14px 14px 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -10px 30px rgba(0,0,0,.6); }
.sheet .hint { font-style: italic; color: var(--gold-text); }
.sheet .top { display: flex; gap: 12px; align-items: flex-start; }
.sheet .pic { width: 118px; aspect-ratio: 5 / 4; object-fit: cover; object-position: 50% 30%; border-radius: 6px; border: 2px solid var(--gold-leaf); flex: none; }
.sheet h2 { font: 600 20px/1.2 var(--display); letter-spacing: .04em; }
.sheet .kind { font-style: italic; color: var(--muted); margin: 0 0 4px; }
.sheet .nums { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 15px; }
.sheet .nums b { font-family: var(--display); }
.credit { font-size: 12.5px; font-style: italic; color: var(--muted); margin-top: 4px; }
.x { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); color: var(--muted); font-size: 20px; line-height: 1; flex: none; }
.rule { font-size: 15.5px; line-height: 1.3; }
.rule b { font: 600 11px/1.2 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--gold-text); display: block; margin-bottom: 2px; }
.rule.off { color: var(--muted); }
.acts { display: flex; flex-direction: column; gap: 7px; }
.act { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; text-align: left; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--gold-shade); background: var(--surface); }
.act strong { font: 600 15px/1.2 var(--display); letter-spacing: .04em; }
.act .cost { display: flex; gap: 3px; align-items: center; }
.act .cost .pip { width: 12px; height: 12px; }
.act small { grid-column: 1 / -1; font-size: 14.5px; color: var(--muted); line-height: 1.25; }
.act:disabled { opacity: .42; cursor: default; }
.act.focus { animation: glow 1.1s ease-in-out infinite alternate; }
#over { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; padding: 20px; background: rgba(12,8,5,.8); overflow-y: auto; }
.panel { width: min(440px, 100%); background: var(--raised); border: 2px solid var(--gold-leaf); box-shadow: inset 0 0 0 1px var(--gold-shade), 0 20px 50px rgba(0,0,0,.7); border-radius: 14px; padding: 26px 22px 22px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.panel > svg { width: 44px; height: 44px; fill: var(--gold-leaf); }
.eyebrow { font: 600 11px/1.2 var(--display); letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
.panel h1 { font: 600 34px/1.1 var(--display); letter-spacing: .03em; color: var(--gold-text); text-wrap: balance; }
.panel p { font-size: 17px; line-height: 1.35; text-wrap: pretty; }
.btns { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 6px; }
.btns .btn { width: 100%; height: 46px; }
.panel ul { margin: 0; padding: 0; list-style: none; text-align: left; font-size: 15.5px; line-height: 1.3; display: flex; flex-direction: column; gap: 4px; }
.panel li::before { content: "◆ "; color: var(--gold-leaf); font-size: 10px; vertical-align: 2px; }
.ledger { width: 100%; border-top: 1px solid var(--line); font-size: 16px; }
.ledger div { display: flex; justify-content: space-between; gap: 12px; padding: 5px 2px; border-bottom: 1px solid var(--line); text-align: left; }
.ledger b { font-family: var(--display); color: var(--gold-text); white-space: nowrap; }
.ledger .tot { font-family: var(--display); letter-spacing: .06em; text-transform: uppercase; font-size: 14px; }

/* ---------- pages outside the battle ---------- */
#page { height: 100%; display: flex; flex-direction: column; }
#view { flex: 1; min-height: 0; overflow-y: auto; }
.wrap { max-width: 880px; margin: 0 auto; padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 16px; }
#nav { flex: none; display: flex; border-top: 1px solid var(--gold-shade); background: var(--raised); }
#nav button { flex: 1; height: 54px; font: 600 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
#nav button.on { color: var(--gold-text); box-shadow: inset 0 2px 0 var(--gold-leaf); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar h1 { font: 600 24px/1.15 var(--display); letter-spacing: .05em; }
.gold { display: inline-flex; align-items: center; gap: 7px; font: 700 18px/1 var(--display); white-space: nowrap; }
.gold::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f1dc9a, var(--gold-leaf) 60%, var(--gold-shade)); box-shadow: inset 0 0 0 1px var(--gold-shade); }
.lede { font-size: 17px; line-height: 1.35; color: var(--muted); text-wrap: pretty; }
.hero-screen { min-height: 100%; display: grid; place-items: center; padding: 24px 18px; background: linear-gradient(rgba(23,17,12,.72), rgba(23,17,12,.93)), url(img/board-st-george.jpg) center / cover no-repeat; }
.title { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; max-width: 440px; width: 100%; }
.title > svg { width: 60px; height: 60px; fill: var(--gold-leaf); }
.title h1 { font: 600 40px/1.05 var(--display); letter-spacing: .06em; color: var(--gold-text); text-transform: uppercase; }
.title h1 span { font-size: .62em; display: block; letter-spacing: .3em; color: var(--ink); margin: 4px 0; }
.title .lede { color: var(--ink); }
.title .meta { display: flex; gap: 18px; align-items: center; justify-content: center; margin-top: 4px; color: var(--muted); font-style: italic; }
.link { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; padding: 8px; }
.tabs { display: flex; gap: 6px; }
.tabs button { padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); font: 600 11px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tabs button.on { border-color: var(--gold-leaf); color: var(--gold-text); }
.grid { --cw: 108px; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 16px 12px; padding-top: 6px; }
.grid .card { width: 100%; height: auto; aspect-ratio: 1 / 1.08; cursor: pointer; }
.empty { color: var(--muted); font-style: italic; padding: 20px 0; }
.box { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.box h2 { font: 600 13px/1.2 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--gold-text); }
.box.focus { animation: glow 1.1s ease-in-out infinite alternate; }

/* line-up */
.meter { min-width: 150px; text-align: right; font: 600 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-radius: 6px; padding: 4px; }
.meter b { font-size: 20px; color: var(--ink); }
.meter.over b { color: #ff8f73; }
.meter .track { height: 6px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
.meter .track i { display: block; height: 100%; background: var(--gold-leaf); }
.meter.over .track i { background: var(--vermilion); }
.meter.focus { animation: glow 1.1s ease-in-out infinite alternate; }
.tip { background: var(--ultramarine); border: 1px solid var(--gold-shade); border-radius: 10px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
.tip p { flex: 1; font-size: 16px; line-height: 1.3; }
.pyr { --cw: min(29vw, 128px); --ch: calc(var(--cw) * 1.08); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.pyr .card { cursor: pointer; }
.rowlabel { font: 600 10px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); text-align: center; }
.beltrow { --cw: min(22vw, 92px); --ch: calc(var(--cw) * 1.08); display: flex; gap: 8px; justify-content: center; }
.beltrow .card { cursor: pointer; }
.issues { color: #ff8f73; font-size: 15.5px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row .btn { flex: 1; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 13px; border: 1px solid var(--gold-shade); border-radius: 99px; padding: 1px 9px; color: var(--gold-text); white-space: nowrap; }
.options { display: flex; flex-direction: column; gap: 6px; }
.opt { display: grid; grid-template-columns: 54px 1fr auto; gap: 2px 10px; align-items: center; text-align: left; padding: 6px 10px 6px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.opt img { grid-row: 1 / 3; width: 54px; height: 44px; object-fit: cover; object-position: 50% 30%; border-radius: 4px; }
.opt strong { font: 600 14.5px/1.2 var(--display); letter-spacing: .03em; }
.opt small { grid-column: 2; font-size: 14px; color: var(--muted); line-height: 1.2; }
.opt .cost { grid-row: 1 / 3; grid-column: 3; font: 700 14px/1 var(--display); color: var(--gold-text); white-space: nowrap; text-align: right; }
.opt:disabled { opacity: .4; cursor: default; }

/* shop */
.shop-pack { display: flex; gap: 16px; align-items: center; }
.packart { width: 96px; aspect-ratio: 5 / 7; flex: none; border-radius: 8px; border: 2px solid var(--gold-leaf); background: linear-gradient(160deg, #2b4a86, var(--ultramarine) 55%, #13254a); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: inset 0 0 0 1px var(--gold-shade), 0 8px 20px rgba(0,0,0,.5); }
.packart svg { width: 42%; fill: var(--gold-leaf); }
.packart b { font: 700 13px/1 var(--display); letter-spacing: .2em; color: var(--gold-text); }
.packart i { font-size: 11px; color: var(--ink); }

/* pack opening */
.opening { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px 16px; background: radial-gradient(circle at 50% 40%, #2b2015, var(--surface) 70%); text-align: center; }
.opening .packart { width: min(56vw, 230px); border-width: 3px; border-radius: 14px; gap: 12px; animation: bob 2.4s ease-in-out infinite; cursor: pointer; }
.opening .packart b { font-size: 24px; } .opening .packart i { font-size: 15px; }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-1.5deg); } }
.reveal { position: relative; display: grid; place-items: center; }
.reveal.star::before { content: ""; position: absolute; width: 150%; aspect-ratio: 1; border-radius: 50%; background: repeating-conic-gradient(rgba(217,183,99,.28) 0 9deg, transparent 9deg 18deg); -webkit-mask: radial-gradient(closest-side, #000 30%, transparent); mask: radial-gradient(closest-side, #000 30%, transparent); animation: spin 14s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.reveal .fc { animation: flip .5s cubic-bezier(.3,.9,.4,1); position: relative; }
@keyframes flip { from { transform: perspective(900px) rotateY(88deg) scale(.86); opacity: .2; } }
.stack { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; max-width: 320px; }
.stack i { width: 10px; height: 14px; border-radius: 2px; background: var(--ultramarine); border: 1px solid var(--gold-shade); }
.stack i.done { background: var(--gold-leaf); }

/* the full card */
.fc { width: min(310px, 84vw); border-radius: 14px; padding: 8px; background: #3a2819; border: 3px solid #6b4d36; box-shadow: 0 10px 24px rgba(20,13,8,.6); color: var(--card-ink); text-align: left; display: flex; flex-direction: column; gap: 6px; }
.fc.hero { background: linear-gradient(145deg, #dcc07a, var(--gold-leaf) 40%, #a47d32); border-color: var(--gold-shade); }
.fc.item { background: #4a211b; border-color: #8a3a2e; }
.fc-top { display: flex; align-items: center; gap: 8px; background: var(--umber); color: var(--ink); border-radius: 6px; padding: 5px 8px; }
.fc.hero .fc-top { background: var(--ultramarine); } .fc.item .fc-top { background: var(--oxblood); }
.fc-top b { flex: 1; font: 600 16px/1.2 var(--display); letter-spacing: .04em; }
.fc-top .s { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 14px/1 var(--display); background: var(--vermilion); border: 1px solid #e9b9a6; flex: none; }
.fc-top .r { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--display); color: #2a1d14; background: radial-gradient(circle at 35% 30%, #f1dc9a, var(--gold-leaf) 60%, var(--gold-shade)); flex: none; }
.fc-art { aspect-ratio: 16 / 10; border-radius: 4px; overflow: hidden; background: #0c0805; }
.fc-art img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
.fc-plaque { text-align: center; font: 600 10px/1.5 var(--display); letter-spacing: .08em; text-transform: uppercase; background: linear-gradient(#e9cf85, var(--gold-leaf)); border: 1px solid var(--gold-shade); border-radius: 4px; padding: 1px 6px; }
.fc-body { background: var(--paper); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; line-height: 1.22; }
.fc-body .ty { font-style: italic; color: var(--card-muted); }
.fc-body .cr { background: #dde2ea; border: 1px solid var(--ultramarine); border-radius: 4px; padding: 4px 6px; }
.fc-body b { font: 600 10px/1.3 var(--display); letter-spacing: .08em; text-transform: uppercase; }
.fc-body .a b { font-size: 11.5px; letter-spacing: .03em; text-transform: none; }
.fc-body .pip { width: 9px; height: 9px; vertical-align: -1px; margin-left: 1px; }
.fc-foot { display: flex; align-items: center; gap: 10px; font: 700 14px/1 var(--display); color: var(--ink); padding: 0 4px; }
.fc.hero .fc-foot { color: var(--card-ink); }
.fc-foot i { margin-left: auto; font: italic 400 11px/1.15 var(--serif); text-align: right; opacity: .9; }

/* ---------- desktop ---------- */
@media (min-width: 900px) and (min-aspect-ratio: 5/4) {
  :root { --head: 60px; --dock: 96px;
    --ch: clamp(96px, calc((100dvh - var(--head) - var(--dock) - 70px) / 3), 210px);
    --cw: min(calc(var(--ch) * .74), calc((100vw - 260px) / 6.6)); }
  .dt { display: inline; } .ph { display: none; }
  #head { padding: 0 24px; }
  #head .round { font-size: 13px; } #head .round i { font-size: 13px; } #head .place b { font-size: 19px; } #head .place i { font-size: 14px; } #head .menu { font-size: 12px; }
  #board { flex-direction: row-reverse; gap: 16px; }
  .side, .side.me { flex-direction: row; gap: 16px; }
  .side.foe { flex-direction: row-reverse; }
  .rank { flex-direction: column; gap: 12px; }
  .mid { flex-direction: column; width: 10px; height: 100%; padding: 24px 0; }
  .mid::before { border-top: 0; border-left: 1px dashed rgba(201,162,74,.45); margin: 0; }
  #fate { width: 110px; top: 20px; left: calc(100% - 134px); }
  #fate.mine { top: 20px; left: 24px; }
  #fate b { width: 56px; height: 56px; font-size: 12px; } #fate i { font-size: 15px; }
  #dock { flex-direction: row; align-items: center; gap: 24px; padding: 10px 24px; }
  .ctl { display: contents; } .ctl .grow { display: none; }
  .ap { order: 1; } .belt { order: 2; } .coach { order: 3; font-size: 18px; flex: 1; max-height: 100%; } #dock .btn { order: 4; }
  .pip { width: 20px; height: 20px; } .ap span { font-size: 12px; margin-right: 8px; }
  .belt .item { height: 50px; font-size: 16px; padding-right: 10px; } .belt .item img { width: 44px; height: 44px; }
  .btn { height: 50px; padding: 0 26px; font-size: 14px; }
  #sheet { align-items: center; } .sheet { border-bottom: 1px solid var(--gold-shade); border-radius: 14px; }
  #nav { order: -1; border-top: 0; border-bottom: 1px solid var(--gold-shade); justify-content: center; }
  #nav button { flex: 0 0 150px; font-size: 12px; } #nav button.on { box-shadow: inset 0 -2px 0 var(--gold-leaf); }
  .title h1 { font-size: 56px; }
  .form { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  .pyr { --cw: 132px; } .beltrow { --cw: 96px; }
  .grid { --cw: 128px; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
}
@media (max-width: 899px) { .belt .item:not(.solo) span { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .card, .card.focus, .card.can, .card.hit, .btn.focus, .item.focus, .act.focus, .coach.nudge, #fate, #fate.focus b, .opening .packart, .reveal .fc, .reveal.star::before, .box.focus, .meter.focus { animation: none !important; transition: none; }
  .card.focus, .card.can, .btn.focus, .belt .item.focus, .act.focus, #fate.focus b, .box.focus, .meter.focus { box-shadow: 0 0 0 3px #f6e3a6; }
  .float { animation: none; top: 20%; }
}

const E = (() => { // Crown & Fable rules engine.
// Shared by the simulator (Node) and the playable page (browser). No dependencies.
//
// Board: each side has slots 1–6. Slot 1 is the Crown, slots 2–3 are heroes,
// slots 4–6 are the front rank. A round is: upkeep, plan, resolve (Speed order).
//
// Where the design doc leaves a detail open, the engine makes a choice and lists it
// in ASSUMPTIONS so it can be checked against playtesting.

const NIGHTFALL_ROUND = 8;
const ASSUMPTIONS = [
  "Front-rank cards act at Speed 2.",
  "Items resolve before any card acts that round.",
  "Opposite slots face each other: 4 faces 4, 5 faces 5, 6 faces 6.",
  "Slot 1 counts as next to slots 2 and 3; front-rank slots are next to their row neighbours.",
  "Baba Yaga's Mortar ride is simplified: she kills the closest enemy card that isn't the Crown and stays in slot 1.",
  "Koschei's Whirlwind swaps the target with the other hero in slots 2–3 (never the Crown).",
  "A Thrall made by Dracula's Turn has 3 Health and the victim's Attack, and attacks the card opposite.",
  "Merlin's Enchanted sleep stops the hero for this round only, because no hero can be stopped two rounds running.",
  "Fights that pass round 20 are draws.",
  "The slot-1 rules (shielded only by two heroes; can't melee past its own heroes) apply to whoever is in slot 1, including under Robin's No Crown.",
  "Only the standard Attack can be turned on your own heroes, and only from slot 1.",
  "Front-rank cards in front of the Crown don't stop it attacking; only heroes in slots 2–3 do.",
];

const NIGHTFALL = 8;
const MAX_ROUNDS = 20;
const FRONT_SPEED = 2;

// ---------- random numbers (seedable, so fights can be replayed) ----------
function makeRng(seed = Date.now()) {
  let s = (Math.imul(seed >>> 0, 2654435761) ^ 0x9e3779b9) >>> 0 || 1;
  const next = () => {
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
  for (let k = 0; k < 8; k++) next(); // warm up, so small seeds don't give lopsided first rolls
  return {
    next,
    int: (n) => Math.floor(next() * n),
    pick: (arr) => arr[Math.floor(next() * arr.length)],
    shuffle: (arr) => {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(next() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
  };
}

// ---------- setting up a fight ----------
let UID = 0;

function makeHero(def, side, slot) {
  const s = def.stats;
  return {
    uid: ++UID, id: def.id, kind: "hero", side, slot, name: def.name,
    realm: def.realm, tale: def.tale, aspect: def.aspect, ranged: !!s.ranged,
    baseHealth: s.health, maxHealth: s.health, health: s.health,
    baseAtk: s.attack, baseGuard: s.guard, baseSpeed: s.speed,
    atkPerm: 0, speedPerm: 0, guardIntoAtk: 0, atkMult: 1, speedFixed: null,
    actions: def.actions.map((a) => ({ ...a })), uses: {},
    guardLeft: 0, roundGuard: 0, poison: 0, dead: false, removed: false,
    noGuard: false, noHeal: false, stoppedRound: -9, stopNow: false,
    flags: {},
  };
}

function makeFront(def, side, slot) {
  return {
    uid: ++UID, id: def.id, kind: "front", side, slot, name: def.name,
    realm: def.realm || null, tale: def.tale || null, aspect: null, ranged: false,
    baseHealth: def.health, maxHealth: def.health, health: def.health,
    baseAtk: def.attack, baseGuard: def.guard, baseSpeed: FRONT_SPEED,
    atkPerm: 0, speedPerm: 0, guardIntoAtk: 0, atkMult: 1, speedFixed: null,
    auto: def.auto, actions: [], uses: {},
    guardLeft: 0, roundGuard: 0, poison: 0, dead: false, removed: false,
    noGuard: false, noHeal: false, stoppedRound: -9, stopNow: false,
    flags: {},
  };
}

// lineup: { crown, heroes: [id, id], front: [id, id, id], items: [id...] }
function createGame(data, lineups, opts = {}) {
  const rng = opts.rng || makeRng(opts.seed);
  const st = {
    data, rng, round: 0, fate: rng.int(2), log: [], over: false, winner: null,
    sides: [0, 1].map((i) => ({ index: i, slots: {}, items: [], usedItems: [], grave: [], swallowed: [],
      noCrown: false, crownUid: null, ap: 3, flags: {} })),
    marks: {},
  };
  lineups.forEach((lu, i) => setupSide(st, i, lu));
  // Start-of-fight effects
  for (const side of st.sides) {
    const crown = crownCard(st, side.index);
    if (crown?.id === "robin-hood") side.noCrown = true;
  }
  applyStartingHealth(st);
  for (const side of st.sides) {
    const crown = crownCard(st, side.index);
    if (crown && crownActive(st, side.index) && crown.id === "sheriff-of-nottingham") {
      const foe = st.sides[1 - side.index];
      if (foe.items.length) {

      for (const v of s.swallowed.filter((x) => x.by === t.uid)) {
        if (noCheating(st)) continue;
        const slot = v.card.slot;
        if (!at(st, v.card.side, slot)) {
          v.card.removed = false; v.card.health = 1; st.sides[v.card.side].slots[slot] = v.card;
          log(st, `${v.card.name} comes back out of the Wolf on 1 Health.`);
        }
      }
      s.swallowed = s.swallowed.filter((x) => x.by !== t.uid);
    }
  }
  // Bonds that react to deaths, on both sides
  for (const side of [0, 1]) {
    const f = bondFactor(st, side);
    if (!f) continue;
    for (const h of heroes(st, side)) {
      const mine = side === i;
      if (h.id === "beowulf" && t.aspect === "Beast") h.atkPerm += f;
      if (!mine) continue;
      if (h.id === "maid-marian" && isRealm(st, t, "Albion") && !h.flags.marianDone) {
        h.flags.marianDone = true; h.atkPerm += 2 * f; h.speedPerm += f;
      }
      if (h.id === "st-george") {
        if (t.aspect === "Beast" && !h.flags.georgeBeast) { h.flags.georgeBeast = true; h.guardIntoAtk += f * guardOf(st, h); if (f > 0) { h.noGuard = true; h.guardLeft = 0; log(st, `St George gives up his Guard: his Attack is now ${attackOf(st, h)}.`); } }
        if (t.aspect === "Healer" && !h.flags.georgeHealer) { h.flags.georgeHealer = true; h.atkMult = f > 0 ? 2 : 1; }
      }
      if (h.id === "grendels-mother" && t.id === "grendel") { h.atkPerm += 3 * f; h.speedFixed = 3; }
      if (h.id === "the-creature" && isRealm(st, t, "Gothic")) {
        h.flags.gothicDeaths = (h.flags.gothicDeaths || 0) + 1;
        if (h.flags.gothicDeaths === 1) h.atkPerm += 2 * f;
        if (h.flags.gothicDeaths === 2) { h.atkPerm += 2 * f; h.speedPerm += f; }
      }
      if (h.id === "dracula" && isRealm(st, t, "Gothic")) heal(st, h, h, 4 * f > 0 ? 4 : 0, { flat: true });
    }
    if (side === i && t.id === "the-little-mermaid") {
      for (const h of heroes(st, side)) if (isRealm(st, h, "Eventyr")) heal(st, t, h, 3);
    }
  }
}

// ---------- stopping a card from acting ----------
function stop(st, target, why) {
  if (!target || target.dead) return false;
  if (crownIs(st, target.side, "the-tin-soldier") && target.kind === "hero") { log(st, `${target.name} can't be stopped (Tin Soldier).`); return false; }
  if (target.stoppedRound === st.round - 1) { log(st, `${target.name} was stopped last round, so it can't be stopped again.`); return false; }
  target.stopNow = true; target.stoppedRound = st.round;
  log(st, `${target.name} is stopped (${why}).`);
  ev(st, { t: "stop", tgt: target.uid, why });
  return true;
}

// Fire Breath: two different enemy cards, chosen at random when it resolves (one if only one is left).
function fireTargets(st, a) {
  const pool = cards(st, 1 - a.side).slice(), out = [];
  while (out.length < 2 && pool.length) out.push(pool.splice(st.rng.int(pool.length), 1)[0]);
  return out;
}

// A card stopped last round can't be stopped again this round, so it isn't offered as a target.
function canBeStopped(st, c) { return c.stoppedRound !== st.round - 1; }

// ---------- upkeep ----------
function upkeep(st) {
  ev(st, { t: "phase", name: "upkeep" });
  const upkeepBefore = snapStats(st);
  st.round += 1;
  st.marks = {};
  // Fate token
  const ren0 = crownIs(st, 0, "renfield"), ren1 = crownIs(st, 1, "renfield");
  if (ren0 && !ren1) st.fate = 0; else if (ren1 && !ren0) st.fate = 1; else if (st.round > 1) st.fate = 1 - st.fate;
  for (const i of [0, 1]) {
    st.sides[i].ap = crownIs(st, i, "victor-frankenstein") ? 4 : 3;
    st.sides[i].flags.itemApExtra = 0;
  }
  // Blodeuwedd's change at nightfall comes first
  if (st.round === NIGHTFALL) {
    for (const c of allCards(st)) if (c.id === "blodeuwedd" && !c.flags.night) {
      c.flags.night = true; c.maxHealth = c.baseHealth * 2; c.health = c.maxHealth; c.baseAtk *= 2;
      log(st, `Blodeuwedd becomes the owl: 14 Health, Attack 4, Guard 2.`);
    }
  }
  // Guard refreshes
  for (const c of allCards(st)) { c.guardLeft = guardOf(st, c); c.stopNow = false; }
  // Nightfall damage and Poison (ignore Guard)
  if (isNight(st)) {
    const n = st.round - NIGHTFALL + 1;
    for (const c of allCards(st)) applyHealthLoss(st, null, c, n, { nightfall: true });
  }
  // Poison halves after each tick (rounded down), so it ends after it deals 1.
  for (const c of allCards(st)) if (c.poison > 0) { const p = c.poison; c.poison = Math.floor(p / 2); applyHealthLoss(st, { name: "Poison", side: -1 }, c, p, {}); }
  // Crown passives at upkeep
  for (const i of [0, 1]) {
    const crown = crownCard(st, i);
    if (!crown || !crownActive(st, i)) continue;
    const foe = 1 - i;
    switch (crown.id) {
      case "blodeuwedd": {
        for (const h of heroes(st, i)) if (h.uid !== crown.uid && h.realm === "Cymru") { crown.guardLeft += h.guardLeft; h.guardLeft = 0; }
        break;
      }
      case "the-princess": { const c = st.rng.pick(cards(st, i)); heal(st, crown, c, 1); break; }
      case "red-riding-hood": {
        const c = cards(st, i).filter(injured).sort((a, b) => (b.maxHealth - b.health) - (a.maxHealth - a.health))[0];
        if (c) heal(st, crown, c, 2);
        break;
      }
      case "grendel": {
        const fr = cards(st, foe).filter((c) => c.kind === "front").sort((a, b) => a.health - b.health)[0];
        if (fr) damage(st, crown, fr, 2, {});
        break;
      }
      case "the-snow-queen": {
        const fr = cards(st, foe).filter((c) => c.kind === "front" && c.flags.frozenRound !== st.round - 1).sort((a, b) => attackOf(st, b) - attackOf(st, a))[0];
        if (fr && !crownIs(st, foe, "the-tin-soldier")) { fr.flags.frozenRound = st.round; log(st, `${fr.name} is frozen.`); ev(st, { t: "freeze", tgt: fr.uid }); }
        break;
      }
      case "friar-tuck": {
        const side = st.sides[i];
        side.flags.tuckReturns = side.flags.tuckReturns || 0;
        if (side.flags.tuckReturns < 3 && !isNight(st) && !noCheating(st)) {
          const dead = side.grave.find((c) => c.kind === "front" && !at(st, i, c.slot));
          if (dead) { revive(st, dead, 1); side.flags.tuckReturns++; log(st, `Friar Tuck brings ${dead.name} back on 1 Health.`); revived(st, dead); }
        }
        break;
      }
    }
  }
  // Bonds at upkeep
  for (const i of [0, 1]) {
    const f = bondFactor(st, i);
    if (!f) continue;
    for (const h of heroes(st, i)) {
      if (h.id === "victor-frankenstein") {
        for (const c of heroes(st, i)) if (c.uid === h.uid || isRealm(st, c, "Gothic")) heal(st, h, c, 2 * f > 0 ? 2 : 0, { flat: f < 0 });
      }
      if (h.id === "grendel" && heroes(st, i).some((x) => x.id === "grendels-mother")) heal(st, h, h, f > 0 ? 1 : 0);
    }
  }
  diffStats(st, upkeepBefore, null);
  checkWin(st);
}

function revive(st, c, health) {
  const side = st.sides[c.side];
  c.dead = false; c.removed = false; c.health = health;
  side.grave = side.grave.filter((x) => x.uid !== c.uid);
  side.slots[c.slot] = c;
  if (crownIs(st, c.side, "gwydion")) { c.maxHealth += 2; c.health += 2; c.atkPerm += 1; }
}
// The revive event goes after the log line that explains it.
const revived = (st, c) => ev(st, { t: "revive", uid: c.uid, side: c.side, slot: c.slot, name: c.name, hp: c.health });

// ---------- win check ----------
function checkWin(st) {
  if (st.over) return true;
  const lost = [0, 1].map((i) => {
    const side = st.sides[i];
    if (side.noCrown) return heroes(st, i).length === 0;
    const crown = Object.values(side.slots).find((c) => c && c.uid === side.crownUid);
    return !crown || crown.dead;
  });
  if (lost[0] && lost[1]) { st.over = true; st.winner = -1; log(st, "Both crowns fall: a draw."); ev(st, { t: "over", winner: st.winner }); }
  else if (lost[0]) { st.over = true; st.winner = 1; log(st, "Red wins."); ev(st, { t: "over", winner: st.winner }); }
  else if (lost[1]) { st.over = true; st.winner = 0; log(st, "Blue wins."); ev(st, { t: "over", winner: st.winner }); }
  else if (st.round >= MAX_ROUNDS) { st.over = true; st.winner = -1; log(st, "Round limit reached: a draw."); ev(st, { t: "over", winner: st.winner }); }
  return st.over;
}

// ---------- actions ----------
// Each action has a target type the planner/UI uses and a resolver.
// Target types: none, self, enemyMelee, enemyAny, enemyHero, enemyHeroMelee, enemyHeroNotCrown, enemyFront,

  "merlin": { "Hex": { t: "enemyAny", go: (st, a, x) => damage(st, a, x, 3, { spell: true, attack: true, ranged: true, ignoreGuard: true }) },

    "Break their spirit": { t: "enemyHeroMelee", go: (st, a, x) => { hit(st, a, x, attackOf(st, a)); x.noGuard = true; x.guardLeft = 0; } } },

  "the-creature": { "Rampage": { t: "enemyMelee", go: (st, a, x) => { const ns = neighbours(st, x); hit(st, a, x, 3); ns.forEach((n) => hit(st, a, n, 3)); } },
    "The Pyre": { t: "none", go: (st, a) => { cards(st, 1 - a.side).forEach((c) => damage(st, a, c, 6, { attack: true })); damage(st, null, a, 8, { trueDamage: true }); } } },
  "the-dragon": { "Fire Breath": { t: "none", go: (st, a) => { for (const x of fireTargets(st, a)) hit(st, a, x, 3, { ranged: true }); } },
    "Tail Sweep": { t: "enemyMelee", go: (st, a, x) => { const n = neighbours(st, x)[0]; hit(st, a, x, 2); if (n) hit(st, a, n, 2); } } },

    log(st, `The Wolf swallows ${x.name} whole.`);
  } } },

// A standard or named attack. Returns damage dealt.
function hit(st, a, x, amount, opts = {}) {
  let target = x;
  if (a.flags.shardRound === st.round) {
    const own = neighbours(st, a)[0];
    if (own) { log(st, `${a.name}'s attack turns on ${own.name} (Shard of the mirror).`); target = own; }
  }
  const d = damage(st, a, target, amount, { attack: true, ...opts });
  if (a.id === "lancelot" && crownIs(st, a.side, "lancelot") && a.flags.chipRound !== st.round) {
    const ec = crownCard(st, 1 - a.side);
    if (ec) { a.flags.chipRound = st.round; applyHealthLoss(st, a, ec, 1, {}); }
  }
  return d;
}

function standardAttack(st, a, x) {
  if (a.id === "zmey-gorynych" && crownIs(st, a.side, "zmey-gorynych")) {
    const per = 1 + Math.max(0, bondFactor(st, a.side)) * countRealm(st, a, "Rus'");
    for (let k = 0; k < 3; k++) {
      const pool = meleeTargets(st, a);
      if (!pool.length) break;
      hit(st, a, st.rng.pick(pool), per);
    }
    return;
  }
  hit(st, a, x, attackOf(st, a), { ranged: a.ranged });
}

// Targets for an action, for the planner and the UI.
function targetsFor(st, a, act) {
  const foe = 1 - a.side;
  const spec = ACTIONS[a.id]?.[act.name];
  const type = spec?.t ?? (a.ranged || act.text.includes("Ranged") ? "enemyAny" : "enemyMelee");
  // A standard melee attack from slot 1 may also be turned on your own heroes in slots 2–3.
  if (!spec?.t && type === "enemyMelee" && a.slot === 1) {
    return meleeTargets(st, a).concat([2, 3].map((x) => at(st, a.side, x)).filter((c) => c && c.kind === "hero"));
  }
  const eh = heroes(st, foe);
  switch (type) {
    case "none": return [null];
    case "emptyFront": return [4, 5, 6].some((x) => !at(st, a.side, x)) ? [null] : [];
    case "enemyMelee": return meleeTargets(st, a);
    case "enemyAny": case "enemyAny2": return rangedTargets(st, a);
    case "enemyHero": return act.name === "Enchanted sleep" ? eh.filter((c) => canBeStopped(st, c)) : eh;
    case "enemyHeroMelee": { const m = meleeTargets(st, a).filter((c) => c.kind === "hero"); return m.length ? m : []; }
    case "enemyHeroNotCrown": return eh.filter((c) => c.uid !== st.sides[foe].crownUid);
    case "enemyHero23": return eh.filter((c) => c.slot === 2 || c.slot === 3);
    case "enemyFront": return cards(st, foe).filter((c) => c.kind === "front");
    case "enemyFrontWeak2": return cards(st, foe).filter((c) => c.kind === "front" && c.health <= 2);
    case "enemyWeakNotCrown": return cards(st, foe).filter((c) => (c.kind === "front" || c.uid !== st.sides[foe].crownUid) && c.health <= 3 && !(c.kind === "hero" && c.uid === st.sides[foe].crownUid));
    case "enemyWolf": { const fr = closestRow(st, a.side).filter((c) => c.kind === "front"); return [...fr, ...eh.filter((c) => c.health <= 3 && c.uid !== st.sides[foe].crownUid)]; }
    case "enemyNotCrown": return closestRow(st, a.side).filter((c) => c.uid !== st.sides[foe].crownUid);
    // Girdle Leash: each enemy Beast can be leashed by the same Princess only once a fight.
    case "enemyBeast": return eh.filter((c) => c.aspect === "Beast" && canBeStopped(st, c) && !(a.flags.leashed || []).includes(c.uid));
    case "ally": return cards(st, a.side);
    case "allyHero": return heroes(st, a.side);
    case "adjacentAllyHero": return neighbours(st, a).filter((c) => c.kind === "hero");
    case "deadFront": return st.sides[a.side].grave.filter((c) => c.kind === "front" && !at(st, a.side, c.slot));
    case "deadTalemate": return st.sides[a.side].grave.filter((c) => c.kind === "hero" && c.uid !== a.uid && isTale(st, c, a.tale));
    default: return [];
  }
}

// Usable actions for a hero this round: [{ index, action, targets }]
function options(st, a) {
  const side = st.sides[a.side];
  const out = [];
  a.actions.forEach((act, index) => {
    if (act.usesPerFight && (a.uses[act.name] || 0) >= act.usesPerFight) return;
    if (act.ap > 4) return;
    const targets = targetsFor(st, a, act);
    if (!targets.length) return;
    out.push({ index, action: act, targets });
  });
  return out;
}

function itemCost(st, i) { return crownIs(st, 1 - i, "koschei") ? 2 : 1; }

const ITEM_TARGETS = {
  "dragons-blood": "allyHero", "draught-of-the-cauldron": "deadHero", "gingerbread": "allyHero", "golden-apple": "allyHero",
  "mead-of-heorot": "none", "mead-of-poetry": "none", "poisoned-apple": "enemyHero", "skull-lantern": "enemyHero",
  "spindle": "enemyHero", "the-giants-sword": "allyHero", "water-of-life": "allyHero",
};
function itemTargets(st, i, id) {
  switch (ITEM_TARGETS[id]) {
    case "none": return [null];
    case "allyHero": return heroes(st, i);
    case "enemyHero": return id === "spindle" ? heroes(st, 1 - i).filter((c) => canBeStopped(st, c)) : heroes(st, 1 - i);
    case "deadHero": return [2, 3].some((s) => !at(st, i, s)) ? st.sides[i].grave.filter((c) => c.kind === "hero") : [];
    default: return [];
  }
}

function useItem(st, i, id, x) {
  const side = st.sides[i];
  const k = side.items.indexOf(id); if (k < 0) return;
  side.items.splice(k, 1); side.usedItems.push(id);
  const src = { name: itemName(st, id), side: i, id: "item", item: id, flags: {} };
  log(st, `${sideName(i)} uses ${itemName(st, id)}${x ? ` on ${x.name}` : ""}.`);
  ev(st, { t: "item", side: i, item: id, name: itemName(st, id), tgt: uidOf(x) });
  const before = snapStats(st), hp0 = x ? x.health : 0;
  switch (id) {
    case "dragons-blood": x.guardLeft += 3; break;
    case "draught-of-the-cauldron": { if (noCheating(st)) break; const slot = [2, 3].find((s) => !at(st, i, s)); if (slot) { x.slot = slot; revive(st, x, 1); revived(st, x); } break; }
    case "gingerbread": heal(st, src, x, 2); break;
    case "golden-apple": heal(st, src, x, 3); x.poison = 0; break;
    case "mead-of-heorot": heroes(st, i).forEach((h) => heal(st, src, h, 2)); break;
    case "poisoned-apple": x.poison += 2; break;
    case "skull-lantern": damage(st, src, x, x.aspect === "Witch" ? 4 : 2, { spell: true }); break;
    case "spindle": stop(st, x, "Spindle"); break;
    case "the-giants-sword": x.flags.giantSword = st.round; break;
    case "water-of-life": x.health = Math.max(x.health, Math.min(20, x.maxHealth));
      if (x.health > hp0) ev(st, { t: "heal", item: id, tgt: x.uid, amt: x.health - hp0, hp: x.health }); break;
  }
  if (id === "the-giants-sword") ev(st, { t: "attackUp", item: id, tgt: x.uid, amt: 3 });
  diffStats(st, before, src);
}

// ---------- front-rank automatic actions ----------
function frontAct(st, c) {
  if (c.flags.frozenRound === st.round) { log(st, `${c.name} is frozen and skips its action.`); ev(st, { t: "skip", uid: c.uid, why: "frozen" }); return; }
  const foe = 1 - c.side;
  const opposite = () => at(st, foe, c.slot) || st.rng.pick(closestRow(st, c.side));
  const a = attackOf(st, c);
  switch (c.id) {
    case "berserker": { const x = opposite(); if (!x) return; const n = neighbours(st, x)[0]; damage(st, c, x, a, { attack: true }); if (n) damage(st, c, n, a, { attack: true }); return; }
    case "crossbowman": {
      const hs = heroes(st, foe).filter((h) => h.slot === 2 || h.slot === 3).sort((p, q) => p.health - q.health);
      const x = hs[0] || opposite(); if (x) damage(st, c, x, a, { attack: true, ranged: true }); return;
    }
    case "longbowman": {
      const x = crownCard(st, foe) || at(st, foe, 1) || st.rng.pick(closestRow(st, c.side));
      if (x) damage(st, c, x, a, { attack: true, ranged: true }); return;
    }
    case "grandmother": {
      const behind = { 4: [2], 5: [2, 3], 6: [3] }[c.slot] || [];
      const h = behind.map((s) => at(st, c.side, s)).filter(Boolean).sort((p, q) => p.health - q.health)[0];
      if (h) heal(st, c, h, 1); return;
    }
    case "monk": { const x = cards(st, c.side).filter(injured); if (x.length) heal(st, c, st.rng.pick(x), 2); return; }
    case "leshy": case "the-needle": return;
    case "mere-beast": { const x = opposite(); if (!x) return; const d = damage(st, c, x, a, { attack: true }); if (d >= 0 && !x.dead) x.poison = Math.max(x.poison, 1); return; }
    default: { const x = opposite(); if (x && a > 0) damage(st, c, x, a, { attack: true }); }
  }
}

// ---------- a full round ----------
// plans: [planBlue, planRed]; a plan is { orders: [{ uid, index, target, target2 }], items: [{ id, target }],
//   rumpel: uid | null, hunt: uid | null }
function playRound(st, plans) {
  if (st.over) return st;
  st.acting = null; // uid of the card acting right now, for pages that replay the round
  const ords = [];
  for (const i of [0, 1]) {
    const plan = plans[i] || { orders: [], items: [] };
    let ap = st.sides[i].ap;
    for (const it of plan.items || []) {
      if (it.id === "mead-of-poetry") ap += 2;
    }
    // Items first
    for (const it of plan.items || []) {
      const cost = itemCost(st, i);
      if (ap < cost || !st.sides[i].items.includes(it.id)) continue;
      ap -= cost;
      ords.push({ side: i, item: it.id, target: it.target, prio: 100 });
    }
    const used = new Set();
    for (const o of plan.orders || []) {
      const a = cards(st, i).find((c) => c.uid === o.uid);
      if (!a || used.has(a.uid)) continue;
      const act = a.actions[o.index]; if (!act) continue;
      if (act.ap > ap) continue;
      ap -= act.ap; used.add(a.uid);
      ords.push({ side: i, actor: a, index: o.index, target: o.target, target2: o.target2 });
    }
    if (crownIs(st, i, "the-huntsman") && plan.hunt) st.marks[`hunt${i}`] = plan.hunt;
    // Front rank acts automatically
    for (const c of cards(st, i).filter((c) => c.kind === "front")) ords.push({ side: i, actor: c, auto: true });
  }
  // Rumpelstiltskin's guess
  for (const i of [0, 1]) {
    const pick = plans[i]?.rumpel;
    const rum = crownCard(st, i);
    if (!pick || !rum || rum.id !== "rumpelstiltskin" || !crownActive(st, i)) continue;
    st.sides[i].flags.rumpelPicked = st.sides[i].flags.rumpelPicked || [];
    if (st.sides[i].flags.rumpelPicked.includes(pick)) continue;
    st.sides[i].flags.rumpelPicked.push(pick);
    const o = ords.find((x) => x.actor && x.actor.uid === pick && !x.auto);
    const tgt = heroes(st, 1 - i).find((h) => h.uid === pick);
    const guessed = () => ev(st, { t: "act", uid: rum.uid, side: i, name: "Guess the name", tgt: uidOf(tgt) });
    if (o) { o.cancelled = true; log(st, `Rumpelstiltskin guesses ${tgt?.name}'s name: its action is cancelled.`); guessed(); applyHealthLoss(st, rum, tgt, 2, {}); }
    else { log(st, `Rumpelstiltskin guesses wrong.`); guessed(); applyHealthLoss(st, { name: "A wrong guess", side: -1 }, rum, 4, {}); }
  }
  for (const c of allCards(st)) c.flags.acted = false;
  ev(st, { t: "phase", name: "resolve" });
  // Resolve items, then cards in Speed order (recomputed each step)
  for (const o of ords.filter((o) => o.item)) {
    const tgt = o.item === "draught-of-the-cauldron"
      ? st.sides[o.side].grave.find((c) => c.uid === o.target)
      : (o.target ? findCard(st, o.target) : null);
    if (ITEM_TARGETS[o.item] !== "none" && !tgt) continue; // no valid target: the item isn't spent
    useItem(st, o.side, o.item, tgt);
  }
  let pending = ords.filter((o) => !o.item);
  while (pending.length && !st.over) {
    pending = pending.filter((o) => o.actor && !o.actor.dead && !o.actor.removed);
    if (!pending.length) break;
    pending.sort((p, q) => speedOf(st, q.actor) - speedOf(st, p.actor) ||
      (p.side === st.fate ? -1 : 0) - (q.side === st.fate ? -1 : 0) || p.actor.slot - q.actor.slot);
    const o = pending.shift();
    const a = o.actor;
    st.acting = a.uid;
    if (o.cancelled || a.stopNow) { a.flags.acted = true; ev(st, { t: "skip", uid: a.uid, why: o.cancelled ? "cancelled" : "stopped" }); continue; }
    a.flags.acted = true;
    if (o.auto) {
      ev(st, { t: "act", uid: a.uid, side: a.side, auto: true, name: a.name });
      const before = snapStats(st); frontAct(st, a); diffStats(st, before, a); continue;
    }
    const act = a.actions[o.index];
    a.uses[act.name] = (a.uses[act.name] || 0) + (act.usesPerFight ? 1 : 0);
    let x = o.target ? findCard(st, o.target) : null;
    const spec = ACTIONS[a.id]?.[act.name];
    const needsTarget = spec ? !["none", "emptyFront"].includes(spec.t) : true;
    if (spec && ["deadFront", "deadTalemate"].includes(spec.t)) x = st.sides[a.side].grave.find((c) => c.uid === o.target);
    if (needsTarget && !x) {
      // Target gone: wasted (the doc's rule), unless it's a standard melee attack with another target in reach.
      log(st, `${a.name}'s ${act.name} is wasted: its target is gone.`); ev(st, { t: "wasted", uid: a.uid, name: act.name }); continue;
    }
    if (needsTarget && x && !spec?.t?.startsWith("dead") && !["ally", "allyHero", "adjacentAllyHero"].includes(spec?.t)) {
      const legal = targetsFor(st, a, act).some((c) => c && c.uid === x.uid);
      if (!legal) { log(st, `${a.name}'s ${act.name} is wasted: ${x.name} is out of reach.`); ev(st, { t: "wasted", uid: a.uid, name: act.name }); continue; }
    }
    log(st, `${sideName(a.side)} ${a.name} uses ${act.name}${x ? ` on ${x.name}` : ""}.`);
    ev(st, { t: "act", uid: a.uid, side: a.side, name: act.name, tgt: uidOf(x), standard: !spec });
    const before = snapStats(st);
    if (spec && spec.go) spec.go(st, a, x, o.target2 ? findCard(st, o.target2) : null);
    else standardAttack(st, a, x);
    diffStats(st, before, a);
  }
  st.acting = null;
  checkWin(st);
  if (!st.over) upkeep(st);
  return st;
}

function findCard(st, uid) {
  for (const s of st.sides) for (const c of Object.values(s.slots)) if (c && c.uid === uid && !c.dead && !c.removed) return c;
  return null;
}

// ---------- a simple bot ----------
// Scores every (hero, action, target) and picks greedily by value per action point, with a little noise.
function botPlan(st, i, rng = st.rng, noise = 0.35) {
  const foe = 1 - i;
  const plan = { orders: [], items: [], rumpel: null, hunt: null };
  let ap = st.sides[i].ap;
  const ec = crownCard(st, foe);
  const cand = [];
  for (const a of heroes(st, i)) {
    for (const o of options(st, a)) {
      for (const x of o.targets) {
        const v = valueOf(st, a, o.action, x);
        if (v <= 0) continue;
        const t2 = null;
        cand.push({ a, index: o.index, ap: o.action.ap, x, t2, v: (v / Math.max(1, o.action.ap)) * (1 + noise * (rng.next() - 0.5)) });
      }
    }
  }
  cand.sort((p, q) => q.v - p.v);
  const used = new Set();
  // Items: use when clearly useful
  const cost = itemCost(st, i);
  for (const id of st.sides[i].items.slice()) {
    const mine = heroes(st, i);
    let t = null, ok = false;
    switch (id) {
      case "gingerbread": case "golden-apple": case "water-of-life": {
        if (isNight(st)) break;
        t = mine.filter((h) => h.maxHealth - h.health >= (id === "water-of-life" ? 6 : 3)).sort((p, q) => p.health - q.health)[0]; ok = !!t; break;
      }
      case "mead-of-heorot": ok = !isNight(st) && mine.filter((h) => h.maxHealth - h.health >= 2).length >= 2; break;
      case "skull-lantern": case "poisoned-apple": { t = heroes(st, foe).sort((p, q) => p.health - q.health)[0]; ok = !!t; break; }
      case "spindle": { t = heroes(st, foe).sort((p, q) => attackOf(st, q) - attackOf(st, p))[0]; ok = !!t && st.round > 1; break; }
      case "dragons-blood": { t = crownCard(st, i); ok = !!t && t.health <= t.maxHealth / 2; break; }
      case "the-giants-sword": { t = mine.sort((p, q) => attackOf(st, q) - attackOf(st, p))[0]; ok = !!t; break; }
      case "draught-of-the-cauldron": { t = itemTargets(st, i, id)[0]; ok = !!t; break; }
      case "mead-of-poetry": ok = st.round >= 2; break;
    }
    if (ok && ap >= cost && rng.next() < 0.6) {
      plan.items.push({ id, target: t ? t.uid : null });
      ap -= cost; if (id === "mead-of-poetry") ap += 2;
    }
  }
  for (const c of cand) {
    if (used.has(c.a.uid) || c.ap > ap) continue;
    used.add(c.a.uid); ap -= c.ap;
    plan.orders.push({ uid: c.a.uid, index: c.index, target: c.x ? c.x.uid : null, target2: c.t2 ? c.t2.uid : null });
  }
  const eh = heroes(st, foe);
  if (eh.length) {
    const picked = st.sides[i].flags.rumpelPicked || [];
    const fresh = eh.filter((h) => !picked.includes(h.uid));
    if (fresh.length && rng.next() < 0.5) plan.rumpel = rng.pick(fresh).uid;
    plan.hunt = (ec && eh.find((h) => h.uid === ec.uid)) ? ec.uid : rng.pick(eh).uid;
  }
  return plan;
}

function valueOf(st, a, act, x) {
  const foe = 1 - a.side;
  const ec = crownCard(st, foe);
  const name = act.name;
  const dmgValue = (d, t) => {
    if (!t) return 0;
    const eff = Math.max(0, d - (t.guardLeft || 0));
    let v = Math.min(eff, t.health);
    if (eff >= t.health) v += t.kind === "hero" ? 6 : 3;
    if (ec && t.uid === ec.uid) v *= eff >= t.health ? 10 : 1.6;
    return v;
  };
  const missing = (t) => (t ? t.maxHealth - t.health : 0);
  switch (name) {
    case "Attack": case "Claw":
      if (x && x.side === a.side) return 0;
      if (a.id === "zmey-gorynych" && crownIs(st, a.side, "zmey-gorynych")) return 3 * (1 + countRealm(st, a, "Rus'"));
      return dmgValue(attackOf(st, a), x);
    case "Pestle": return dmgValue(5, x);
    case "Skull fire": return dmgValue(3, x);
    case "Mortar ride": return x ? (x.kind === "hero" ? 10 + x.health / 2 : 4 + x.health / 2) : 0;
    case "Excalibur": return dmgValue(5 + (x?.guardLeft || 0), x);
    case "Champion's charge": case "Lance Charge": case "Split the Arrow": return dmgValue(5, x);
    case "Fair fight": return dmgValue(4, x) + (x && !x.flags.acted ? attackOf(st, x) : 0);
    case "Arm-wrench": return dmgValue(attackOf(st, a), x) + 4;
    case "Bite": return dmgValue(attackOf(st, a), x) * 1.4;
    case "Hex": return dmgValue(3 + 1, x);
    case "Sea magic": return a.health > 3 ? dmgValue(attackOf(st, a), x) - 0.5 : 0;
    case "Strike": case "Stones in the belly": return dmgValue(attackOf(st, a), x) + (name === "Stones in the belly" ? 2 : 0);
    case "Quarterstaff": return dmgValue(4, x) + 1;
    case "Rampage": return dmgValue(3, x) + 3 * neighbours(st, x).length * 0.8;
    case "Tail Sweep": return dmgValue(2, x) + 1.5;
    case "Fire Breath": return Math.min(2, cards(st, 1 - a.side).length) * 2.8;
    case "Into the oven": return dmgValue(4, x) + (x?.aspect === "Witch" ? 8 : 0);
    case "Betrayal": return x && ec && x.uid === ec.uid ? dmgValue(6 + (x.guardLeft || 0), x) : (a.health <= 3 ? dmgValue(6, x) : 0);
    case "Break their spirit": return x ? dmgValue(attackOf(st, a), x) + guardOf(st, x) * 3 : 0;
    case "Whirlwind": return dmgValue(3, x) + 1;
    case "The Pyre": {
      if (a.health <= 9) return 0;
      return cards(st, foe).reduce((s, c) => s + dmgValue(6, c), 0) - 6;
    }
    case "Turn": return x ? (x.kind === "hero" ? 14 : 6) : 0;
    case "Swallow whole": return x ? (x.kind === "hero" ? 12 : 4 + x.health / 2) : 0;
    case "Devour": return x ? 5 : 0;
    case "Drag under": return dmgValue(attackOf(st, a), x) + 1;
    case "Shape-shift": return x ? attackOf(st, x) * 2.5 : 0;
    case "Stolen scabbard": return x ? guardOf(st, x) * 3 + 2 : 0;
    case "Enchanted sleep": case "Girdle Leash": return x && x.stoppedRound !== st.round - 1 ? attackOf(st, x) * 1.5 + 1 : 0;
    case "The unhurried pace": return x ? Math.max(0, speedOf(st, x) - 2) : 0;
    case "Shard of the mirror": return x ? attackOf(st, x) * 1.5 : 0;
    case "Wanted": return x ? 3 + (ec && x.uid === ec.uid ? 3 : 0) : 0;
    case "Shield Brother": return x && x.health < x.maxHealth / 2 ? 4 : 0;
    case "Battle of the trees": return crownIs(st, a.side, "gwydion") ? 7 : 4.5;
    case "Steadfast stand": return 2.5;
    case "The master is at hand": return 1.5;
    case "Oak, broom and meadowsweet": return heroes(st, a.side).length > 1 ? 3 : 0;
    case "Queen's mercy": case "The doll's advice": return isNight(st) ? 0 : Math.min(missing(x), 3 + 1) * 1.1;
    case "Cake and wine": return isNight(st) ? 0 : Math.min(missing(x), 4) * 1.1;
    case "Ale and bread": return isNight(st) ? 0 : heroes(st, a.side).reduce((s, h) => s + Math.min(missing(h), 2), 0);
    case "Saved from the wreck": return isNight(st) ? 0 : heroes(st, a.side).reduce((s, h) => s + Math.min(missing(h), 4), 0) - 3;
    case "Completion": return isNight(st) ? 0 : heroes(st, a.side).reduce((s, h) => s + missing(h), 0) - 6;
    case "Heads grow back": return isNight(st) ? 0 : Math.min(missing(a), 6) - 1;
    case "Mend": return isNight(st) ? 0 : neighbours(st, a).reduce((s, n) => s + Math.min(missing(n), 1), 0);
    case "Blood transfusion": return isNight(st) ? 0 : heroes(st, a.side).some((h) => h.uid !== a.uid && missing(h) >= 3) && a.health > 5 ? 2 : 0;
    case "Reanimate": case "Cauldron of rebirth": return x ? 8 : 0;
    case "Straw into gold": return st.sides[a.side].usedItems.length ? 3 : 0;
    case "Gnaw": return 0;
    default: return dmgValue(attackOf(st, a), x);
  }
}

// Plays a whole fight between two bots. Returns 0, 1 or -1 (draw).
function botFight(data, lineups, seed) {
  const rng = makeRng(seed);
  const st = createGame(data, lineups, { rng });
  while (!st.over) playRound(st, [botPlan(st, 0, rng), botPlan(st, 1, rng)]);
  return st;
}

  return { createGame, playRound, botPlan, options, cards, heroes, attackOf, guardOf, speedOf, crownCard, itemTargets, itemCost, canBeStopped, makeRng, NIGHTFALL_ROUND };
})();

// =====================================================================================
// The tutorial: a scripted fight
// =====================================================================================
const TUTORIAL_LINEUPS = [
  { crown: "the-princess", heroes: ["st-george"], front: ["villager", "longbowman", "villager"], items: ["gingerbread"] },
  { crown: "the-dragon", heroes: [], front: ["knight", "berserker", "knight"], items: [] },
];
const TUTORIAL_SEED = 7;
const ph = (a, b) => `<span class="ph">${a}</span><span class="dt">${b}</span>`;

// Each round is a list of steps for the player and one fixed move for the Dragon.
// A step waits for one thing: next (Continue), tap (your hero's slot), action (its name), target ([side, slot]),
// item (its id), useItem or lock. focus: [side, slot], "front" or "fate" only draws the eye.
const TUTORIAL = [
  { steps: [
      { say: `The Dragon has come to the Field at Silene for the Princess, and St George rides out to stop it. Your cards are ${ph("at the bottom", "on the left")}.`, next: true },
      { say: "The Princess wears your Crown. If she falls, you lose. Every other card of yours is there to protect her.", focus: [0, 1], next: true },

const SAVE_KEY = "crown-and-fable-save-1";
const CORE_FRONT = ["knight", "crossbowman", "longbowman", "leshy", "monk", "berserker"];
const STARTER_ITEMS = ["gingerbread", "golden-apple", "dragons-blood"];
const PRICES = { pack: 50, front: 20, Common: 40, Rare: 100, Legendary: 250 };
const PAY = { win: 30, loss: 15, bonus: 5 };
const RENOWN_CAP = 50, BELT = 3, START_GOLD = 50;
const emptyLineup = () => ({ crown: "", heroes: ["", ""], front: ["", "", ""], items: ["", "", ""] });
const fresh = () => ({ v: 1, nightSeen: false, tutorialDone: false, packOpened: false, gold: 0, heroes: {}, front: {}, items: {}, lineup: emptyLineup(), wins: 0, losses: 0, draws: 0, dry: 0, tip: 0 });
function load() { try { const g = JSON.parse(localStorage.getItem(SAVE_KEY)); if (g && g.v === 1) return Object.assign(fresh(), g); } catch (e) {} return fresh(); }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} }
let G = load();

const kindOf = (id) => (DATA.heroes[id] ? "hero" : DATA.front[id] ? "front" : DATA.items[id] ? "item" : null);
const defOf = (id) => DATA.heroes[id] || DATA.front[id] || DATA.items[id];
const bag = (id) => ({ hero: G.heroes, front: G.front, item: G.items }[kindOf(id)]);
const owned = (id) => (id === "villager" ? Infinity : bag(id)[id] || 0);
function give(id, n = 1) { if (id === "villager") return; const b = bag(id); b[id] = (b[id] || 0) + n; }
function take(id, n = 1) { if (id === "villager") return; const b = bag(id); b[id] = Math.max(0, (b[id] || 0) - n); if (!b[id]) delete b[id]; }
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const PAIR = ["grendel", "grendels-mother"];

// The first pack, revealed in this order: the front rank grouped by type (one of each of the six, with two random
// types topped up to six copies), three common items, then the whole St George set and one hero from another
// realm (never Baba Yaga or the Grendel pair).
function firstPack() {
  const [a, b] = shuffle(CORE_FRONT);
  const front = CORE_FRONT.flatMap((id) => Array(id === a || id === b ? 6 : 1).fill(id))
    .sort((x, y) => (x === a || x === b) - (y === a || y === b));
  const others = Object.values(DATA.heroes).filter((h) => h.realm !== "Albion" && h.id !== "baba-yaga" && !PAIR.includes(h.id));
  return [...front, ...STARTER_ITEMS, "the-princess", "the-dragon", "st-george", pick(others).id];
}
// A Fable pack: 4 front-rank cards and 2 items; about 1 pack in 5 swaps an item for a hero.
function fablePack() {
  const pool = [...CORE_FRONT, ...CORE_FRONT, "grandmother", "geat-thane", "mere-beast"];
  const cards = [0, 1, 2, 3].map(() => pick(pool));
  const item = () => { const r = Math.random(), rar = r < 0.05 ? "Legendary" : r < 0.3 ? "Rare" : "Common"; return pick(Object.values(DATA.items).filter((x) => x.rarity === rar)).id; };
  const better = [item(), item()];
  G.dry += 1;
  if (G.dry >= 5 || Math.random() < 0.2) {
    const can = Object.values(DATA.heroes).filter((h) => owned(h.id) < 3);
    if (can.length) {
      const h = pick(can).id; G.dry = 0;
      if (PAIR.includes(h)) better.splice(0, 2, ...PAIR); else better[1] = h;
    }
  }
  return [...cards, ...better];
}

// ---------- line-up ----------
const SLOTS = ["crown", "h0", "h1", "f0", "f1", "f2", "i0", "i1", "i2"];
const slotKind = (s) => (s === "crown" || s[0] === "h" ? "hero" : s[0] === "f" ? "front" : "item");
function getSlot(lu, s) { return s === "crown" ? lu.crown : s[0] === "h" ? lu.heroes[+s[1]] : s[0] === "f" ? lu.front[+s[1]] : lu.items[+s[1]]; }
function setSlot(lu, s, id) { if (s === "crown") lu.crown = id; else if (s[0] === "h") lu.heroes[+s[1]] = id; else if (s[0] === "f") lu.front[+s[1]] = id; else lu.items[+s[1]] = id; }
const fielded = (lu) => SLOTS.map((s) => getSlot(lu, s)).filter(Boolean);
const usedIn = (lu, id, except) => SLOTS.filter((s) => s !== except && getSlot(lu, s) === id).length;
const hasKoschei = (lu) => [lu.crown, ...lu.heroes].includes("koschei");
const renownOf = (lu) => SLOTS.reduce((sum, s) => { const id = getSlot(lu, s); return sum + (id && !(s === "f2" && hasKoschei(lu)) ? defOf(id).renown || 0 : 0); }, 0);
function prune() { // drop anything from the line-up you no longer own
  for (const s of SLOTS) { const id = getSlot(G.lineup, s); if (id && usedIn(G.lineup, id, s) + 1 > owned(id) && SLOTS.indexOf(s) >= SLOTS.findIndex((x) => getSlot(G.lineup, x) === id) + owned(id)) setSlot(G.lineup, s, ""); }
  for (const s of SLOTS) { const id = getSlot(G.lineup, s); if (id && usedIn(G.lineup, id) > owned(id)) setSlot(G.lineup, s, ""); }
}
function issues(lu) {
  const out = [], hs = [lu.crown, ...lu.heroes].filter(Boolean), r = renownOf(lu);
  if (!lu.crown) out.push("Choose a hero to wear the Crown.");
  if (r > RENOWN_CAP) out.push(`You are ${r - RENOWN_CAP} Renown over the limit of ${RENOWN_CAP}.`);
  if (hs.includes(PAIR[0]) !== hs.includes(PAIR[1])) out.push("Grendel and Grendel's Mother must be fielded together.");
  return out;
}
function autoFill() {
  const lu = emptyLineup(); let left = RENOWN_CAP;
  const hs = Object.keys(G.heroes).filter((id) => !PAIR.includes(id)).sort((a, b) => (DATA.heroes[b].tale === "St George and the Dragon") - (DATA.heroes[a].tale === "St George and the Dragon") || DATA.heroes[b].renown - DATA.heroes[a].renown);
  const chosen = [];
  for (const id of hs) { if (chosen.length < 3 && DATA.heroes[id].renown <= left - 6 && id !== "baba-yaga") { chosen.push(id); left -= DATA.heroes[id].renown; } }
  chosen.sort((a, b) => DATA.heroes[b].stats.health - DATA.heroes[a].stats.health);
  lu.crown = chosen[0] || ""; lu.heroes = [chosen[1] || "", chosen[2] || ""];
  const counts = { ...G.front };
  for (let k = 0; k < 3; k++) {
    const opts = Object.keys(counts).filter((id) => counts[id] > 0 && DATA.front[id].renown <= left - (2 - k)).sort((a, b) => DATA.front[b].renown - DATA.front[a].renown || Math.random() - 0.5);
    const id = opts[0] || "villager"; lu.front[k] = id; left -= DATA.front[id].renown; if (counts[id]) counts[id]--;
  }
  const ic = { ...G.items }; let k = 0;
  for (const id of Object.keys(ic).sort((a, b) => DATA.items[a].renown - DATA.items[b].renown)) { while (ic[id] > 0 && k < BELT && DATA.items[id].renown <= left) { lu.items[k++] = id; left -= DATA.items[id].renown; ic[id]--; } }
  G.lineup = lu;
}
function randomFoe() {
  const rng = E.makeRng(Date.now() + Math.floor(Math.random() * 1e6));
  const hs = []; let budget = RENOWN_CAP;
  for (const h of rng.shuffle(Object.values(DATA.heroes))) {
    if (hs.length >= 3) break;
    if (h.renown > budget - 3 || PAIR.includes(h.id) || h.id === "baba-yaga") continue;
    hs.push(h.id); budget -= h.renown;
  }
  const fl = Object.values(DATA.front).filter((f) => f.id !== "the-needle");
  const front = [0, 1, 2].map((k) => { const ok = fl.filter((f) => f.renown <= budget - (2 - k)); const f = ok.length ? rng.pick(ok) : DATA.front.villager; budget -= f.renown; return f.id; });
  const items = [0, 1].map(() => { const ok = Object.values(DATA.items).filter((x) => x.renown <= budget); if (!ok.length) return ""; const x = rng.pick(ok); budget -= x.renown; return x.id; }).filter(Boolean);
  return { crown: hs[0], heroes: hs.slice(1), front, items };
}
