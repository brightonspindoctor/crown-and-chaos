  "sheriff-of-nottingham": { "Wanted": { t: "enemyAny", go: (st, a, x) => { st.marks[`wanted${a.side}`] = x.uid; log(st, `${x.name} is Wanted.`); } },
    "Break their spirit": { t: "enemyHeroMelee", go: (st, a, x) => { hit(st, a, x, attackOf(st, a)); x.noGuard = true; x.guardLeft = 0; } } },
  "st-george": { "Lance Charge": { t: "enemyMelee", go: (st, a, x) => hit(st, a, x, 3, { ignoreGuard: true }) },
    "Shield Brother": { t: "adjacentAllyHero", go: (st, a, x) => { x.flags.shieldRound = st.round; } } },
  "the-bride": { "Completion": { t: "none", go: (st, a) => heroes(st, a.side).forEach((h) => heal(st, a, h, 4)) } },
  "the-creature": { "Rampage": { t: "enemyMelee", go: (st, a, x) => { const ns = neighbours(st, x); hit(st, a, x, 3); ns.forEach((n) => hit(st, a, n, 3)); } },
    "The Pyre": { t: "none", go: (st, a) => { cards(st, 1 - a.side).forEach((c) => damage(st, a, c, 6, { attack: true })); damage(st, null, a, 8, { trueDamage: true }); } } },
  "the-dragon": { "Fire Breath": { t: "none", go: (st, a) => { for (const x of fireTargets(st, a)) hit(st, a, x, 2, { ranged: true }); } },
    "Tail Sweep": { t: "enemyMelee", go: (st, a, x) => { const n = neighbours(st, x)[0]; hit(st, a, x, 2); if (n) hit(st, a, n, 2); } } },
  "the-huntsman": { "Stones in the belly": { t: "enemyAny", go: (st, a, x) => { hit(st, a, x, attackOf(st, a), { ranged: true }); if (!x.dead) x.speedFixed = 1; } } },
  "the-little-mermaid": { "Sea magic": { t: "enemySpell", go: (st, a, x) => { damage(st, a, x, attackOf(st, a), { spell: true, attack: true, ranged: true }); applyHealthLoss(st, { name: "The knives", side: -1 }, a, 1, {}); } },
    "Saved from the wreck": { t: "none", go: (st, a) => heroes(st, a.side).forEach((h) => heal(st, a, h, 4)) } },
  "the-princess": { "Mend": { t: "none", go: (st, a) => neighbours(st, a).forEach((n) => heal(st, a, n, 1)) },
    "Girdle Leash": { t: "enemyBeast", go: (st, a, x) => { (a.flags.leashed ||= []).push(x.uid); stop(st, x, "Girdle Leash"); } } },
  "the-snow-queen": { "Shard of the mirror": { t: "enemyHero", go: (st, a, x) => { x.flags.shardRound = st.round; } } },
  "the-tin-soldier": { "Steadfast stand": { t: "none", go: (st, a) => { a.guardLeft += 2; a.flags.steadfastRound = st.round; } } },
  "the-wolf": { "Shortcut": { t: "none", go: (st, a) => { st.sides[a.side].flags.shortcutUntil = st.round + 2; log(st, "The Wolf knows a shortcut: your heroes have +1 Speed for 3 rounds."); } },
    "Swallow whole": { t: "enemyWolf", go: (st, a, x) => {
    x.removed = true; st.sides[x.side].slots[x.slot] = null; st.sides[x.side].swallowed.push({ by: a.uid, card: x });
    log(st, `The Wolf swallows ${x.name} whole.`);
  } } },
  "van-helsing": { "Blood transfusion": { t: "none", go: (st, a) => {
    applyHealthLoss(st, { name: "Blood transfusion", side: -1 }, a, 2, {});
    const others = heroes(st, a.side).filter((h) => h.uid !== a.uid);
    if (others.length) heal(st, a, st.rng.pick(others), 3);
  } } },
  "vasilisa-the-wise": { "The doll's advice": { t: "allyHero", go: (st, a, x) => { heal(st, a, x, 3); x.guardLeft += 1; } } },
  "victor-frankenstein": { "Reanimate": { t: "deadTalemate", go: (st, a, x) => {
    if (noCheating(st)) return;
    const slot = [2, 3].find((s) => !at(st, a.side, s)); if (!slot) return;
    x.slot = slot; revive(st, x, 3); log(st, `Victor reanimates ${x.name}.`); revived(st, x);
  } } },
  "zmey-gorynych": { "Heads grow back": { t: "none", go: (st, a) => heal(st, a, a, 6) } },
};

// A standard or named attack. Returns damage dealt.
function hit(st, a, x, amount, opts = {}) {
  let target = x;
  // Gram's edge: a Sigurd Crown's attacks ignore Guard.
  if (a.id === "sigurd" && crownIs(st, a.side, "sigurd")) opts = { ...opts, ignoreGuard: true };
  if (a.flags.shardRound === st.round) {
    const own = neighbours(st, a)[0];
    if (own) { log(st, `${a.name}'s attack turns on ${own.name} (Shard of the mirror).`); target = own; }
  }
  const d = damage(st, a, target, amount, { attack: true, ...opts });
  // Venom: a Fafnir Crown's attacks also give 1 Poison.
  if (a.id === "fafnir" && crownIs(st, a.side, "fafnir") && target && !target.dead && d > 0) {
    target.poison += 1; log(st, `Fafnir's venom: ${target.name} gains 1 Poison.`); ev(st, { t: "poison", src: a.uid, tgt: target.uid, amt: 1 });
  }
  if (a.id === "lancelot" && crownIs(st, a.side, "lancelot") && a.flags.chipRound !== st.round) {
    const ec = crownCard(st, 1 - a.side);
    if (ec) { a.flags.chipRound = st.round; applyHealthLoss(st, a, ec, 1, {}); }
  }
  return d;
}

function standardAttack(st, a, x) {
  if (a.id === "zmey-gorynych" && crownIs(st, a.side, "zmey-gorynych")) {
    const per = 1 + Math.max(0, bondFactor(st, a.side)) * countRealm(st, a, "Rus'");
    // Three heads: three random enemy cards anywhere, different cards while there are enough.
    const pool = cards(st, 1 - a.side).slice(), picks = [];
    while (picks.length < 3 && pool.length) picks.push(pool.splice(st.rng.int(pool.length), 1)[0]);
    while (picks.length && picks.length < 3) picks.push(st.rng.pick(picks));
    for (const x of picks) if (!x.dead) hit(st, a, x, per);
    return;
  }
  hit(st, a, x, attackOf(st, a), { ranged: a.ranged });
}

const CHARGE_DMG = 6;
// Charge: the hero spends this round winding up; next round, at its Speed, it strikes for CHARGE_DMG (Guard applies).
function charge(st, a, x, name, ranged) {
  a.flags.charge = { round: st.round + 1, tgt: x.uid, name, ranged };
  log(st, `${a.name} charges ${name} at ${x.name}: ${CHARGE_DMG} damage next round.`);
  ev(st, { t: "debuff", kind: "charge", src: a.uid, tgt: x.uid, text: `${name}: 8 next round` });
}
const isCharging = (st, c) => !!c.flags.charge && c.flags.charge.round === st.round;
// Actions that stop a hero, so a hero stopped last round isn't offered as a target.
const STOPPERS = ["Enchanted sleep", "Petrify", "Medusa's head"];
// Targets for an action, for the planner and the UI.
function targetsFor(st, a, act) { return visibleTo(st, a.side, targetsForAll(st, a, act)); }
function targetsForAll(st, a, act) {
  const foe = 1 - a.side;
  const spec = ACTIONS[a.id]?.[act.name];
  const type = spec?.t ?? (a.ranged || act.text.includes("Ranged") ? "enemyAny" : "enemyMelee");
  // A standard melee attack from slot 1 may also be turned on your own heroes in slots 2–3.
  if (!spec?.t && type === "enemyMelee" && a.slot === 1) {
    return meleeTargets(st, a).concat([2, 3].map((x) => at(st, a.side, x)).filter((c) => c && c.kind === "hero"));
  }
  const eh = heroes(st, foe);
  switch (type) {
    case "none": return [null];
    case "emptyFront": return [4, 5, 6].some((x) => !at(st, a.side, x)) ? [null] : [];
    case "enemyMelee": return meleeTargets(st, a);
    case "enemyAny": case "enemyAny2": return rangedTargets(st, a);
    case "enemySpell": return rangedTargets(st, a, { spell: true });
    case "enemyHero": return STOPPERS.includes(act.name) ? eh.filter((c) => canBeStopped(st, c)) : eh;
    case "enemyHeroMelee": { const m = meleeTargets(st, a).filter((c) => c.kind === "hero"); return m.length ? m : []; }
    case "enemyHeroNotCrown": return eh.filter((c) => c.uid !== st.sides[foe].crownUid);
    case "enemyHero23": return eh.filter((c) => c.slot === 2 || c.slot === 3);
    case "enemyFront": return cards(st, foe).filter((c) => c.kind === "front");
    case "enemyFrontWeak2": return cards(st, foe).filter((c) => c.kind === "front" && c.health <= 2);
    case "enemyWeakNotCrown": return cards(st, foe).filter((c) => (c.kind === "front" || c.uid !== st.sides[foe].crownUid) && c.health <= 3 && !(c.kind === "hero" && c.uid === st.sides[foe].crownUid));
    case "enemyWolf": { const fr = closestRow(st, a.side).filter((c) => c.kind === "front"); return [...fr, ...eh.filter((c) => c.health <= 3 && c.uid !== st.sides[foe].crownUid)]; }
    case "enemyNotCrown": return closestRow(st, a.side).filter((c) => c.uid !== st.sides[foe].crownUid);
    // Girdle Leash: each enemy Beast can be leashed by the same Princess only once a fight.
    case "enemyBeast": return eh.filter((c) => c.aspect === "Beast" && canBeStopped(st, c) && !(a.flags.leashed || []).includes(c.uid));
    case "ally": return cards(st, a.side);
    case "allyHero": return heroes(st, a.side);
    case "adjacentAllyHero": return neighbours(st, a).filter((c) => c.kind === "hero");
    case "deadFront": return st.sides[a.side].grave.filter((c) => c.kind === "front" && !at(st, a.side, c.slot));
    case "deadTalemate": return st.sides[a.side].grave.filter((c) => c.kind === "hero" && c.uid !== a.uid && isTale(st, c, a.tale));
    default: return [];
  }
}

// Usable actions for a hero this round: [{ index, action, targets }]
function options(st, a) {
  const side = st.sides[a.side];
  const out = [];
  if (isCharging(st, a)) return out;
  a.actions.forEach((act, index) => {
    if (act.usesPerFight && (a.uses[act.name] || 0) >= act.usesPerFight) return;
    if (apCost(st, a, act) > st.sides[a.side].ap) return;
    const targets = targetsFor(st, a, act);
    if (!targets.length) return;
    out.push({ index, action: act, targets });
  });
  return out;
}

// Items are free to use, except against Koschei, whose Crown makes them cost 1 action point.
// Rumpelstiltskin has 3 guesses a fight. He may name the same hero again, but not two rounds running.
const RUMPEL_GUESSES = 3;
function rumpelChoices(st, i) {
  const fl = st.sides[i].flags;
  if ((fl.rumpelGuesses || 0) >= RUMPEL_GUESSES) return [];
  return visibleTo(st, i, heroes(st, 1 - i)).filter((h) => !(fl.rumpelLast && fl.rumpelLast.uid === h.uid && fl.rumpelLast.round === st.round - 1));
}
function itemCost(st, i) { return crownIs(st, 1 - i, "koschei") ? 1 : 0; }

const ITEM_TARGETS = {
  "dragons-blood": "allyHero", "draught-of-the-cauldron": "deadHero", "gingerbread": "allyHero", "golden-apple": "allyHero",
  "mead-of-heorot": "none", "mead-of-poetry": "none", "poisoned-apple": "enemyHero", "skull-lantern": "enemyHero",
  "spindle": "enemyHero", "the-giants-sword": "allyHero", "water-of-life": "allyHero",
};
function itemTargets(st, i, id) { return visibleTo(st, i, itemTargetsAll(st, i, id)); }
function itemTargetsAll(st, i, id) {
  switch (ITEM_TARGETS[id]) {
    case "none": return [null];
    case "allyHero": return heroes(st, i);
    case "enemyHero": return id === "spindle" ? heroes(st, 1 - i).filter((c) => canBeStopped(st, c)) : heroes(st, 1 - i);
    case "deadHero": return [2, 3].some((s) => !at(st, i, s)) ? st.sides[i].grave.filter((c) => c.kind === "hero") : [];
    default: return [];
  }
}

function useItem(st, i, id, x) {
  const side = st.sides[i];
  const k = side.items.indexOf(id); if (k < 0) return;
  side.items.splice(k, 1); side.usedItems.push(id);
  const src = { name: itemName(st, id), side: i, id: "item", item: id, flags: {} };
  log(st, `${sideName(i)} uses ${itemName(st, id)}${x ? ` on ${x.name}` : ""}.`);
  ev(st, { t: "item", side: i, item: id, name: itemName(st, id), tgt: uidOf(x) });
  const before = snapStats(st), hp0 = x ? x.health : 0;
  switch (id) {
    case "dragons-blood": x.guardLeft += 3; break;
    case "draught-of-the-cauldron": { if (noCheating(st)) break; const slot = [2, 3].find((s) => !at(st, i, s)); if (slot) { x.slot = slot; revive(st, x, 1); revived(st, x); } break; }
    case "gingerbread": heal(st, src, x, 2); break;
    case "golden-apple": heal(st, src, x, 3); x.poison = 0; break;
    case "mead-of-heorot": heroes(st, i).forEach((h) => heal(st, src, h, 2)); break;
    case "poisoned-apple": x.poison += 2; break;
    case "skull-lantern": damage(st, src, x, x.aspect === "Witch" ? 4 : 2, { spell: true }); break;
    case "spindle": stop(st, x, "Spindle"); break;
    case "the-giants-sword": x.flags.giantSword = st.round; break;
    case "water-of-life": x.health = Math.max(x.health, Math.min(20, x.maxHealth));
      if (x.health > hp0) ev(st, { t: "heal", item: id, tgt: x.uid, amt: x.health - hp0, hp: x.health }); break;
  }
  if (id === "the-giants-sword") ev(st, { t: "attackUp", item: id, tgt: x.uid, amt: 3 });
  diffStats(st, before, src);
}

// ---------- front-rank automatic actions ----------
function frontAct(st, c) {
  if (c.flags.frozenRound === st.round) { log(st, `${c.name} is frozen and skips its action.`); ev(st, { t: "skip", uid: c.uid, why: "frozen" }); return; }
  const foe = 1 - c.side;
  const seen = (x) => (x && !isBlind(st, x) ? x : null);
  const near = () => { const r = visibleTo(st, c.side, closestRow(st, c.side)); return r.length ? st.rng.pick(r) : null; };
  const opposite = () => (c.slot >= 4 ? seen(at(st, foe, c.slot)) : null) || near();
  const a = attackOf(st, c);
  switch (c.id) {
    case "berserker": { const x = opposite(); if (!x) return; const n = neighbours(st, x)[0]; damage(st, c, x, a, { attack: true }); if (n) damage(st, c, n, a, { attack: true }); return; }
    case "crossbowman": {
      const hs = heroes(st, foe).filter((h) => (h.slot === 2 || h.slot === 3) && !inLabyrinth(st, h)).sort((p, q) => p.health - q.health);
      const x = visibleTo(st, c.side, hs)[0] || opposite(); if (x) damage(st, c, x, a, { attack: true, ranged: true }); return;
    }
    case "longbowman": {
      const x = seen(crownCard(st, foe)) || seen(at(st, foe, 1)) || near();
      if (x) damage(st, c, x, a, { attack: true, ranged: true }); return;
    }
    case "grandmother": {
      const behind = { 4: [2], 5: [2, 3], 6: [3] }[c.slot] || [];
      const h = behind.map((s) => at(st, c.side, s)).filter(Boolean).sort((p, q) => p.health - q.health)[0];
      if (h) heal(st, c, h, 1); return;
    }
    case "monk": { const x = cards(st, c.side).filter(injured); if (x.length) heal(st, c, st.rng.pick(x), 2); return; }
    case "leshy": case "the-needle": return;
    case "mere-beast": { const x = opposite(); if (!x) return; const d = damage(st, c, x, a, { attack: true }); if (d >= 0 && !x.dead) x.poison = Math.max(x.poison, 1); return; }
    default: { const x = opposite(); if (x && a > 0) damage(st, c, x, a, { attack: true }); }
  }
}

// ---------- a full round ----------
// plans: [planBlue, planRed]; a plan is { orders: [{ uid, index, target, target2 }], items: [{ id, target }],
//   rumpel: uid | null, hunt: uid | null }
function playRound(st, plans) {
  if (st.over) return st;
  st.acting = null; // uid of the card acting right now, for pages that replay the round
  const ords = [];
  for (const i of [0, 1]) {
    const plan = plans[i] || { orders: [], items: [] };
    let ap = st.sides[i].ap;
    for (const it of (plan.items || []).slice(0, 1)) {
      if (it.id === "mead-of-poetry") ap += 2;
    }
    // Items first: one a round
    for (const it of (plan.items || []).slice(0, 1)) {
      const cost = itemCost(st, i);
      if (ap < cost || !st.sides[i].items.includes(it.id)) continue;
      ap -= cost;
      ords.push({ side: i, item: it.id, target: it.target, prio: 100 });
    }
    const used = new Set();
    for (const o of plan.orders || []) {
      const a = cards(st, i).find((c) => c.uid === o.uid);
      if (!a || used.has(a.uid) || isCharging(st, a)) continue;
      const act = a.actions[o.index]; if (!act) continue;
      const cost = apCost(st, a, act);
      if (cost > ap) continue;
      ap -= cost; used.add(a.uid);
      ords.push({ side: i, actor: a, index: o.index, target: o.target, target2: o.target2 });
    }
    if (crownIs(st, i, "the-huntsman") && plan.hunt) st.marks[`hunt${i}`] = plan.hunt;
    // Front rank acts automatically
    for (const c of cards(st, i).filter((c) => c.kind === "front")) ords.push({ side: i, actor: c, auto: true });
    // Charged heroes strike automatically
    for (const c of heroes(st, i)) if (isCharging(st, c)) ords.push({ side: i, actor: c, charge: true });
  }
  // Rumpelstiltskin's guess
  for (const i of [0, 1]) {
    const pick = plans[i]?.rumpel;
    const rum = crownCard(st, i);
    if (!pick || !rum || rum.id !== "rumpelstiltskin" || !crownActive(st, i)) continue;
    if (!rumpelChoices(st, i).some((h) => h.uid === pick)) continue;
    const fl = st.sides[i].flags;
    fl.rumpelGuesses = (fl.rumpelGuesses || 0) + 1; fl.rumpelLast = { uid: pick, round: st.round };
    const o = ords.find((x) => x.actor && x.actor.uid === pick && !x.auto);
    const tgt = heroes(st, 1 - i).find((h) => h.uid === pick);
    const guessed = () => ev(st, { t: "act", uid: rum.uid, side: i, name: "Guess the name", tgt: uidOf(tgt) });
    if (o) { o.cancelled = true; log(st, `Rumpelstiltskin guesses ${tgt?.name}'s name: its action is cancelled.`); guessed(); applyHealthLoss(st, rum, tgt, 2, {}); }
    else { log(st, `Rumpelstiltskin guesses wrong.`); guessed(); applyHealthLoss(st, { name: "A wrong guess", side: -1 }, rum, 1, {}); }
  }
  for (const c of allCards(st)) c.flags.acted = false;
  ev(st, { t: "phase", name: "resolve" });
  // Resolve items, then cards in Speed order (recomputed each step)
  for (const o of ords.filter((o) => o.item)) {
    const tgt = o.item === "draught-of-the-cauldron"
      ? st.sides[o.side].grave.find((c) => c.uid === o.target)
      : (o.target ? findCard(st, o.target) : null);
    if (ITEM_TARGETS[o.item] !== "none" && !tgt) continue; // no valid target: the item isn't spent
    useItem(st, o.side, o.item, tgt);
  }
  // Mirrored shield and Nobody aren't Speed dependent: once chosen, they're up before anyone acts.
  for (const o of ords) {
    if (o.item || o.auto || o.cancelled || !o.actor || o.actor.stopNow || o.actor.dead) continue;
    const nm = o.actor.actions[o.index]?.name;
    if (o.actor.id === "perseus" && nm === "Mirrored shield") o.actor.flags.reflectRound = st.round;
    if (o.actor.id === "odysseus" && nm === "Nobody") o.actor.flags.nobodyRound = st.round;
  }
  let pending = ords.filter((o) => !o.item);
  while (pending.length && !st.over) {
    pending = pending.filter((o) => o.actor && !o.actor.dead && !o.actor.removed);
    if (!pending.length) break;
    pending.sort((p, q) => speedOf(st, q.actor) - speedOf(st, p.actor) ||
      (p.side === st.fate ? -1 : 0) - (q.side === st.fate ? -1 : 0) || p.actor.slot - q.actor.slot);
    const o = pending.shift();
    const a = o.actor;
    st.acting = a.uid;
    if (o.cancelled || a.stopNow) {
      a.flags.acted = true;
      if (o.charge) { log(st, `${a.name} loses the charge.`); a.flags.charge = null; }
      ev(st, { t: "skip", uid: a.uid, why: o.cancelled ? "cancelled" : "stopped" }); continue;
    }
    a.flags.acted = true;
    if (o.charge) {
      const ch = a.flags.charge; a.flags.charge = null;
      const x = findCard(st, ch.tgt);
      if (!x) { log(st, `${a.name}'s ${ch.name} is wasted: its target is gone.`); ev(st, { t: "wasted", uid: a.uid, name: ch.name }); continue; }
      log(st, `${sideName(a.side)} ${a.name} uses ${ch.name} on ${x.name} (charged).`);
      ev(st, { t: "act", uid: a.uid, side: a.side, name: ch.name, tgt: x.uid });
      const before = snapStats(st);
      damage(st, a, x, CHARGE_DMG, { attack: true, ranged: ch.ranged, ignoreGuard: a.id === "sigurd" && crownIs(st, a.side, "sigurd") });
      diffStats(st, before, a); continue;
    }
    if (o.auto) {
      ev(st, { t: "act", uid: a.uid, side: a.side, auto: true, name: a.name });
      const before = snapStats(st); frontAct(st, a); diffStats(st, before, a); continue;
    }
    const act = a.actions[o.index];
    a.uses[act.name] = (a.uses[act.name] || 0) + (act.usesPerFight ? 1 : 0);
    let x = o.target ? findCard(st, o.target) : null;
    const spec = ACTIONS[a.id]?.[act.name];
    const needsTarget = spec ? !["none", "emptyFront"].includes(spec.t) : true;
    if (spec && ["deadFront", "deadTalemate"].includes(spec.t)) x = st.sides[a.side].grave.find((c) => c.uid === o.target);
    if (needsTarget && !x) {
      // Target gone: wasted (the doc's rule), unless it's a standard melee attack with another target in reach.
      log(st, `${a.name}'s ${act.name} is wasted: its target is gone.`); ev(st, { t: "wasted", uid: a.uid, name: act.name }); continue;
    }
    if (needsTarget && x && !spec?.t?.startsWith("dead") && !["ally", "allyHero", "adjacentAllyHero"].includes(spec?.t)) {
      const legal = targetsFor(st, a, act).some((c) => c && c.uid === x.uid);
      if (!legal) { log(st, `${a.name}'s ${act.name} is wasted: ${x.name} is out of reach.`); ev(st, { t: "wasted", uid: a.uid, name: act.name }); continue; }
    }
    log(st, `${sideName(a.side)} ${a.name} uses ${act.name}${x ? ` on ${x.name}` : ""}.`);
    ev(st, { t: "act", uid: a.uid, side: a.side, name: act.name, tgt: uidOf(x), standard: !spec });
    const before = snapStats(st);
    if (spec && spec.go) spec.go(st, a, x, o.target2 ? findCard(st, o.target2) : null);
    else standardAttack(st, a, x);
    diffStats(st, before, a);
  }
  st.acting = null;
  checkWin(st);
  if (!st.over) upkeep(st);
  return st;
}

function findCard(st, uid) {
  for (const s of st.sides) for (const c of Object.values(s.slots)) if (c && c.uid === uid && !c.dead && !c.removed) return c;
  return null;
}

// ---------- a simple bot ----------
// Scores every (hero, action, target) and picks greedily by value per action point, with a little noise.
function botPlan(st, i, rng = st.rng, noise = 0.35) {
  const foe = 1 - i;
  const plan = { orders: [], items: [], rumpel: null, hunt: null };
  let ap = st.sides[i].ap;
  const ec = crownCard(st, foe);
  const cand = [];
  for (const a of heroes(st, i)) {
    for (const o of options(st, a)) {
      for (const x of o.targets) {
        // Hidden cards (the wooden horse) can't be judged: the bot guesses.
        const v = x && x.side === foe && isHidden(st, x) ? 1 + 3 * rng.next() : valueOf(st, a, o.action, x);
        if (v <= 0) continue;
        const t2 = null, cost = apCost(st, a, o.action);
        cand.push({ a, index: o.index, ap: cost, x, t2, v: (v / Math.max(1, cost)) * (1 + noise * (rng.next() - 0.5)) });
      }
    }
  }
  cand.sort((p, q) => q.v - p.v);
  const used = new Set();
  // Items: use when clearly useful
  const cost = itemCost(st, i);
  for (const id of st.sides[i].items.slice()) {
    const mine = heroes(st, i);
    let t = null, ok = false;
    switch (id) {
      case "gingerbread": case "golden-apple": case "water-of-life": {
        if (isNight(st)) break;
        t = mine.filter((h) => h.maxHealth - h.health >= (id === "water-of-life" ? 6 : 3)).sort((p, q) => p.health - q.health)[0]; ok = !!t; break;
      }
      case "mead-of-heorot": ok = !isNight(st) && mine.filter((h) => h.maxHealth - h.health >= 2).length >= 2; break;
      case "skull-lantern": case "poisoned-apple": { t = heroes(st, foe).sort((p, q) => p.health - q.health)[0]; ok = !!t; break; }
      case "spindle": { t = heroes(st, foe).sort((p, q) => attackOf(st, q) - attackOf(st, p))[0]; ok = !!t && st.round > 1; break; }
      case "dragons-blood": { t = crownCard(st, i); ok = !!t && t.health <= t.maxHealth / 2; break; }
      case "the-giants-sword": { t = mine.sort((p, q) => attackOf(st, q) - attackOf(st, p))[0]; ok = !!t; break; }
      case "draught-of-the-cauldron": { t = itemTargets(st, i, id)[0]; ok = !!t; break; }
      case "mead-of-poetry": ok = st.round >= 2; break;
    }
    if (ok && ap >= cost && rng.next() < 0.6) {
      plan.items.push({ id, target: t ? t.uid : null });
      ap -= cost; if (id === "mead-of-poetry") ap += 2;
      break;
    }
  }
  for (const c of cand) {
    if (used.has(c.a.uid) || c.ap > ap) continue;
    used.add(c.a.uid); ap -= c.ap;
    plan.orders.push({ uid: c.a.uid, index: c.index, target: c.x ? c.x.uid : null, target2: c.t2 ? c.t2.uid : null });
  }
  const eh = heroes(st, foe);
  if (eh.length) {
    const fresh = rumpelChoices(st, i);
    if (fresh.length && rng.next() < 0.5) plan.rumpel = rng.pick(fresh).uid;
    plan.hunt = (ec && eh.find((h) => h.uid === ec.uid)) ? ec.uid : rng.pick(eh).uid;
  }
  return plan;
}

function valueOf(st, a, act, x) {
  const foe = 1 - a.side;
  const ec = crownCard(st, foe);
  const name = act.name;
  const dmgValue = (d, t) => {
    if (!t) return 0;
    const eff = Math.max(0, d - (t.guardLeft || 0));
    let v = Math.min(eff, t.health);
    if (eff >= t.health) v += t.kind === "hero" ? 6 : 3;
    if (ec && t.uid === ec.uid) v *= eff >= t.health ? 10 : 1.6;
    return v;
  };
  const missing = (t) => (t ? t.maxHealth - t.health : 0);
  switch (name) {
    case "Attack": case "Claw":
      if (x && x.side === a.side) return 0;
      if (a.id === "zmey-gorynych" && crownIs(st, a.side, "zmey-gorynych")) return 3 * (1 + countRealm(st, a, "Rus'"));
      return dmgValue(attackOf(st, a), x);
    case "Pestle": return dmgValue(5, x);
    case "Skull fire": return dmgValue(3, x);
    case "Mortar ride": return x ? (x.kind === "hero" ? 10 + x.health / 2 : 4 + x.health / 2) : 0;
    case "Excalibur": return dmgValue(5 + (x?.guardLeft || 0), x);
    case "Champion's charge": return dmgValue(5, x) + (crownCard(st, 1 - a.side) ? 1.5 : 0);
    case "Axe throw": return dmgValue(attackOf(st, a), x);
    case "Shortcut": return (st.sides[a.side].flags.shortcutUntil || 0) >= st.round ? 0 : 1.2 * heroes(st, a.side).length;
    case "Lance Charge": return dmgValue(3 + (x?.guardLeft || 0), x);
    case "Split the Arrow": return dmgValue(2, x) + (cards(st, 1 - a.side).length > 1 ? 1.5 : 0);
    case "Fair fight": return dmgValue(4, x) + (x && !x.flags.acted ? attackOf(st, x) : 0);
    case "Arm-wrench": return dmgValue(attackOf(st, a), x) + 4;
    case "Bite": return dmgValue(attackOf(st, a), x) * 1.4;
    case "Hex": return dmgValue(3 + 1, x);
    case "Sea magic": return a.health > 3 ? dmgValue(attackOf(st, a), x) - 0.5 : 0;
    case "Stones in the belly": return dmgValue(attackOf(st, a), x) + 2;
    case "Quarterstaff": return dmgValue(4, x) + 1;
    case "Rampage": return dmgValue(3, x) + 3 * neighbours(st, x).length * 0.8;
    case "Tail Sweep": return dmgValue(2, x) + 1.5;
    case "Fire Breath": return Math.min(2, cards(st, 1 - a.side).length) * 1.9;
    case "Into the oven": return dmgValue(4, x) + (x?.aspect === "Witch" ? 8 : 0);
    case "Betrayal": return x && ec && x.uid === ec.uid ? dmgValue(6 + (x.guardLeft || 0), x) : (a.health <= 3 ? dmgValue(6, x) : 0);
    case "Break their spirit": return x ? dmgValue(attackOf(st, a), x) + guardOf(st, x) * 3 : 0;
    case "Whirlwind": return dmgValue(3, x) + 1;
    case "The Pyre": {
      if (a.health <= 9) return 0;
      return cards(st, foe).reduce((s, c) => s + dmgValue(6, c), 0) - 6;
    }
    case "Turn": return x ? (x.kind === "hero" ? 14 : 6) : 0;
    case "Swallow whole": return x ? (x.kind === "hero" ? 12 : 4 + x.health / 2) : 0;
    case "Devour": return x ? 5 : 0;
    case "Drag under": return dmgValue(attackOf(st, a), x) + 1;
    case "Shape-shift": return x ? attackOf(st, x) * 2.5 : 0;
    case "Stolen scabbard": return x ? guardOf(st, x) * 3 + 2 : 0;
    case "Enchanted sleep": case "Girdle Leash": return x && x.stoppedRound !== st.round - 1 ? attackOf(st, x) * 1.5 + 1 : 0;
    case "The unhurried pace": return x ? Math.max(0, speedOf(st, x) - 2) : 0;
    case "Shard of the mirror": return x ? attackOf(st, x) * 1.5 : 0;
    case "Wanted": return x ? 3 + (ec && x.uid === ec.uid ? 3 : 0) : 0;
    case "Shield Brother": return x && x.health < x.maxHealth / 2 ? 4 : 0;
    case "Battle of the trees": return crownIs(st, a.side, "gwydion") ? 7 : 4.5;
    case "Steadfast stand": return 2.5;
    case "The master is at hand": return 1.5;
    case "Oak, broom and meadowsweet": return heroes(st, a.side).length > 1 ? 3 : 0;
    case "Queen's mercy": case "The doll's advice": return isNight(st) ? 0 : Math.min(missing(x), 3 + 1) * 1.1;
    case "Cake and wine": return isNight(st) ? 0 : Math.min(missing(x), 4) * 1.1;
    case "Ale and bread": return isNight(st) ? 0 : heroes(st, a.side).reduce((s, h) => s + Math.min(missing(h), 2), 0);
    case "Saved from the wreck": return isNight(st) ? 0 : heroes(st, a.side).reduce((s, h) => s + Math.min(missing(h), 4), 0) - 3;
    case "Completion": return isNight(st) ? 0 : heroes(st, a.side).reduce((s, h) => s + Math.min(missing(h), 4), 0) - 4;
    case "Heads grow back": return isNight(st) ? 0 : Math.min(missing(a), 6) - 1;
    case "Mend": return isNight(st) ? 0 : neighbours(st, a).reduce((s, n) => s + Math.min(missing(n), 1), 0);
    case "Blood transfusion": return isNight(st) ? 0 : heroes(st, a.side).some((h) => h.uid !== a.uid && missing(h) >= 3) && a.health > 5 ? 2 : 0;
    case "Reanimate": case "Cauldron of rebirth": return x ? 8 : 0;
    case "Straw into gold": return st.sides[a.side].usedItems.length ? 3 : 0;
    case "Gnaw": return 0;
    case "Mirrored shield": {
      const threat = heroes(st, foe).reduce((s, h) => s + attackOf(st, h), 0);
      return a.health <= a.maxHealth * 0.7 || (crownCard(st, a.side)?.uid === a.uid) ? Math.min(6, threat / 2) : 1;
    }
    case "Nobody": return a.health <= a.maxHealth * 0.6 ? 4 : 1;
    case "Medusa's head": return x && x.stoppedRound !== st.round - 1 ? attackOf(st, x) * 1.5 + 1 : 0;
    case "Petrify": return x && x.stoppedRound !== st.round - 1 ? attackOf(st, x) * 1.5 + 1 : 0;
    case "Serpent hair": return Math.min(2, cards(st, foe).length) * 2.6;
    case "Hurl the boulder": return dmgValue(4, x) + (x?.kind === "hero" ? 1 : 0);
    case "Transfigure": return x ? Math.max(0, attackOf(st, x) - 1) * 2 : 0;
    case "Royal decree": return st.sides[foe].flags.decreeRound === st.round + 1 ? 0 : 3 + heroes(st, foe).length;
    case "Dig the pit": case "Deep breath": return x ? dmgValue(8 + (x.guardLeft || 0), x) * 0.7 + (x.uid === crownCard(st, foe)?.uid ? 3 : 0) : 0;
    case "Mistletoe": return dmgValue(3 + (x?.guardLeft || 0), x);
    case "Crown thief": {
      const old = crownCard(st, foe); if (!old || st.sides[foe].noCrown) return 0;
      const heir = heroes(st, foe).filter((h) => h.uid !== old.uid).sort((p, q) => q.health - p.health)[0];
      return heir && heir.health > old.health ? 2.5 : 0;
    }
    case "Growl": return st.sides[foe].flags.growlRound === st.round + 1 ? 0 : 1 + 0.8 * cards(st, foe).length;
    case "Gore": return dmgValue(5 + (x?.guardLeft || 0), x);
    default: return dmgValue(attackOf(st, a), x);
  }
}

// Plays a whole fight between two bots. Returns 0, 1 or -1 (draw).
function botFight(data, lineups, seed) {
  const rng = makeRng(seed);
  const st = createGame(data, lineups, { rng });
  while (!st.over) playRound(st, [botPlan(st, 0, rng), botPlan(st, 1, rng)]);
  return st;
}

// =====================================================================================
// Quests: three fights in a row with one company. What a side has lost (front-rank cards, items, Health)
// carries from one fight to the next.
// =====================================================================================
// How many of each front-rank card make up a warband, set so each warband is won about 9 times in 10 and costs
// a company roughly a sixth of its Health.
// No Hoplites: with no nightfall, a Phalanx can hold out until the round limit.
const QUEST_TROOPS = { berserker: 3, knight: 3, crossbowman: 4, longbowman: 4, "geat-thane": 4, "mere-beast": 3 };
// In every quest fight the player holds the Fate token throughout and night never falls.
// A quest fight still at a stand-off after round 12 is a draw, which loses the quest.
const QUEST_RULES = { fate: 0, noNight: true, maxRounds: 12 };
// The three foes of a quest: a warband of one front-rank card, two cheap heroes alone, and a final company of three
// heroes from one realm under a strong Crown (or Baba Yaga alone), with no front rank, fought blind.
function questPlan(data, rng) {
  const H = Object.values(data.heroes), banned = ["baba-yaga", "grendel", "grendels-mother"];
  const troops = rng.pick(Object.keys(QUEST_TROOPS));
  const cheap = rng.shuffle(H.filter((h) => !banned.includes(h.id) && h.renown <= 13));
  const easy = { crown: cheap[0].id, heroes: [cheap[1].id], front: [], items: [] };
  let final;
  if (rng.next() < 0.2) final = { crown: "baba-yaga", heroes: [], front: [], items: [], blind: true, revealRound: 3 };
  else {
    const byRealm = {};
    // Koschei always brings the Needle, which would be hidden and so could never be destroyed; Robin Hood wears
    // no Crown, so every hidden hero would have to fall. Neither suits a blind fight.
    for (const h of H) if (!banned.includes(h.id) && h.id !== "koschei" && h.realm !== "Geatland") (byRealm[h.realm] ||= []).push(h);
    const realm = rng.pick(Object.keys(byRealm).filter((r) => byRealm[r].length >= 3));
    const top = byRealm[realm].slice().sort((a, b) => b.renown - a.renown);
    const crown = rng.pick(top.filter((h) => h.id !== "robin-hood").slice(0, 2));
    const rest = rng.shuffle(top.filter((h) => h.id !== crown.id)).slice(0, 2);
    final = { crown: crown.id, heroes: rest.map((h) => h.id), front: [], items: [], blind: true, ap: 2, revealRound: 3 };
  }
  return { fights: [{ kind: "warband", lineup: { troops, troopCount: QUEST_TROOPS[troops], front: [], items: [] } }, { kind: "easy", lineup: easy }, { kind: "final", lineup: final }] };
}
// After a fight: the company that marches on, and the Health each card carries. Only cards that started the fight
// count (summoned cards stay behind); the hero wearing the Crown at the end leads the next fight.
function carryOver(st, i, lu) {
  const side = st.sides[i], start = new Set(side.startUids || []);
  const alive = Object.values(side.slots).filter((c) => c && !c.dead && !c.removed && start.has(c.uid));
  const hs = alive.filter((c) => c.kind === "hero").sort((a, b) => a.slot - b.slot);
  const crown = crownCard(st, i);
  const lead = crown && start.has(crown.uid) ? crown : hs[0];
  const health = { hero: {}, front: [null, null, null] };
  hs.forEach((c) => { health.hero[c.id] = c.health; });
  const front = [0, 1, 2].map((k) => { const c = alive.find((x) => x.slot === 4 + k && x.kind === "front"); if (c) health.front[k] = c.health; return c ? c.id : null; });
  const left = side.items.slice(), items = [];
  for (const id of lu.items || []) { const k = left.indexOf(id); if (k >= 0) { items.push(id); left.splice(k, 1); } }
  return { lineup: { crown: lead ? lead.id : null, heroes: hs.filter((c) => c !== lead).map((c) => c.id), front, items }, health };
}
function applyCarry(st, i, health) {
  for (const c of Object.values(st.sides[i].slots)) {
    if (!c) continue;
    const h = c.kind === "hero" ? health.hero[c.id] : c.slot >= 4 ? health.front[c.slot - 4] : null;
    if (h == null) continue;
    c.health = Math.max(1, h);
    if (c.health > c.maxHealth) c.maxHealth = c.health;
  }
}

  return { createGame, playRound, botPlan, options, cards, heroes, attackOf, guardOf, speedOf, crownCard, itemTargets, itemCost, canBeStopped, makeRng, NIGHTFALL_ROUND, rumpelChoices, RUMPEL_GUESSES, isHidden, isBlind, apCost, STOPPERS, isCharging, questPlan, carryOver, applyCarry, QUEST_RULES };
})();

const emptyLineup = () => ({ crown: "", heroes: ["", ""], front: ["", "", ""], items: ["", ""] });

  lore: [], variants: [], art: {}, ownCrowns: ["gold"], wearing: "gold", spent: 0, levelSeen: 1 });
function load() { try { const g = JSON.parse(localStorage.getItem(SAVE_KEY)); if (g && g.v === 1) { if (g.crowns == null) g.crowns = (g.wins || 0) + (g.tutorialDone ? 1 : 0); if (g.lineup?.items) g.lineup.items = g.lineup.items.slice(0, BELT); const out = Object.assign(fresh(), g); if (g.levelSeen == null) out.levelSeen = levelOf(repPoints(out)); if (g.repSeen == null) out.repSeen = repPoints(out); return out; } } catch (e) {} return fresh(); }

let G = load();

const kindOf = (id) => (DATA.heroes[id] ? "hero" : DATA.front[id] ? "front" : DATA.items[id] ? "item" : null);
const defOf = (id) => DATA.heroes[id] || DATA.front[id] || DATA.items[id];
const bag = (id) => ({ hero: G.heroes, front: G.front, item: G.items }[kindOf(id)]);
const owned = (id) => (id === "villager" ? Infinity : bag(id)[id] || 0);
function give(id, n = 1) { if (id === "villager") return; const b = bag(id); b[id] = (b[id] || 0) + n; }
function take(id, n = 1) { if (id === "villager") return; const b = bag(id); b[id] = Math.max(0, (b[id] || 0) - n); if (!b[id]) delete b[id]; }
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const PAIR = ["grendel", "grendels-mother"];

// The first pack: 23 cards, revealed in this order. Ten front-rank cards grouped by type (one of each of the six, with
// two random types topped up to three copies), the four common items, six heroes, then three lore cards.
// The heroes are the St George set (St George, the Dragon, the Princess) and three heroes from three different
// other realms, never Baba Yaga or the Grendel pair, that fit in one line-up together. The lore cards are the first
// lore card of each of the St George set.
const STARTER_LORE = ["st-george-1", "the-dragon-1", "the-princess-1"];
function starterTrio() {
  const pool = Object.values(DATA.heroes).filter((h) => h.realm !== "Albion" && h.id !== "baba-yaga" && !PAIR.includes(h.id));
  for (let k = 0; k < 200; k++) {
    const trio = [];
    for (const h of shuffle(pool)) if (trio.length < 3 && !trio.some((x) => x.realm === h.realm)) trio.push(h);
    if (trio.reduce((s, h) => s + h.renown, 0) <= RENOWN_CAP - 3) return trio.map((h) => h.id);
  }
  return shuffle(pool).slice(0, 3).map((h) => h.id);
}
function firstPack() {
  const [a, b] = shuffle(CORE_FRONT);
  const front = CORE_FRONT.flatMap((id) => Array(id === a || id === b ? 3 : 1).fill(id))
    .sort((x, y) => (x === a || x === b) - (y === a || y === b));
  const lore = STARTER_LORE.filter((id) => LORE_CARDS.some((c) => c.id === id)).map((id) => `lore:${id}`);
  return [...front, ...STARTER_ITEMS, "the-princess", "the-dragon", "st-george", ...starterTrio(), ...lore];
}
// A Fable pack: 4 front-rank cards and 2 better cards; about 1 pack in 5 swaps a better card for a hero.
// Better cards: common item 45%, rare 15%, legendary 3%, gold 20%, lore 10%, variant painting 7%. Packs never hold crowns:
// crowns come from the shop and from levels. Lore and variant paintings are only drawn for cards you own and
// haven't collected; when none are left, the draw becomes gold.
// Gold, lore, variants and crowns travel as tokens such as "gold:25", "lore:st-george-1", "var:<key>", "crown:iron".
const tok = (t) => { const i = String(t).indexOf(":"); return i < 0 ? null : { kind: t.slice(0, i), val: t.slice(i + 1) }; };
const loreFree = (taken) => LORE_CARDS.filter((c) => owned(c.hero) > 0 && !G.lore.includes(c.id) && !taken.includes(`lore:${c.id}`));
const variantFree = (taken) => Object.values(VARIANTS).flat().filter((v) => owned(v.card) > 0 && !G.variants.includes(v.key) && !taken.includes(`var:${v.key}`));
const goldCard = () => { const r = Math.random(); return `gold:${r < 0.75 ? 10 : r < 0.95 ? 25 : 100}`; };
function betterCard(taken) {
  const r = Math.random() * 100;
  const item = (rar) => pick(Object.values(DATA.items).filter((x) => x.rarity === rar)).id;
  if (r < 45) return item("Common");
  if (r < 60) return item("Rare");
  if (r < 63) return item("Legendary");
  if (r < 83) return goldCard();
  if (r < 93) { const l = loreFree(taken); return l.length ? `lore:${pick(l).id}` : goldCard(); }
  const v = variantFree(taken); return v.length ? `var:${pick(v).key}` : goldCard();
}
function fablePack() {
  const pool = [...CORE_FRONT, ...CORE_FRONT, "grandmother", "geat-thane", "mere-beast"];
  const cards = [0, 1, 2, 3].map(() => pick(pool));
  const better = [];
  better.push(betterCard(better)); better.push(betterCard(better));
  G.dry += 1;
  if (G.dry >= 5 || Math.random() < 0.2) {
    const can = Object.values(DATA.heroes).filter((h) => owned(h.id) < 3);
    if (can.length) {
      const h = pick(can).id; G.dry = 0;
      if (PAIR.includes(h)) better.splice(0, 2, ...PAIR); else better[1] = h;
    }
  }
  return [...cards, ...better];
}

// ---------- levels ----------
// A player's level comes from the gold they have spent and the Crowns they have won. Players never see the sums,
// only their level and a Reputation bar. Level L needs 25 x L x (L - 1) points. A Crown taken from the computer
// is worth 5 points (25 from a real player, once there are real players), so the computer can't be farmed for levels.
// Every 5th level gifts a hero (never one you own 3 of); every 10th level gifts a level crown.
function spend(n) { G.gold -= n; G.spent = (G.spent || 0) + n; }
function repPoints(g) { return (g.spent || 0) + 5 * (g.crowns || 0); }
function levelOf(pts) { return Math.max(1, Math.floor((1 + Math.sqrt(1 + pts / 6.25)) / 2)); }
const levelStart = (L) => 25 * L * (L - 1);
const myLevel = () => levelOf(repPoints(G));
function repShare() { const pts = repPoints(G), L = levelOf(pts); return Math.min(1, (pts - levelStart(L)) / (levelStart(L + 1) - levelStart(L))); }
const nextCrownLevel = (L) => Math.ceil((L + 1) / 10) * 10;
function giftHero() {
  const can = Object.values(DATA.heroes).filter((h) => owned(h.id) < 3).map((h) => h.id);
  if (!can.length) { G.gold += 100; return null; }
  const h = pick(can);
  if (PAIR.includes(h)) { PAIR.forEach((id) => give(id)); return PAIR.slice(); }
  give(h); return [h];
}
// Called whenever the player is back on a menu screen: shows any levels gained since last time, then their gifts.
function checkLevel() {
  if (!G.packOpened || U.over) return;
  const pts = repPoints(G), to = levelOf(pts), from = G.levelSeen || 1;
  // Where the Reputation bar stood when the player last saw it, so the level-up can fill it from there.
  const before = Math.max(levelStart(from), Math.min(G.repSeen == null ? levelStart(from) : G.repSeen, levelStart(from + 1)));
  if (to <= from) { if (G.repSeen !== pts) { G.repSeen = pts; save(); } return; }
  const steps = [{ kind: "level" }];
  for (let L = from + 1; L <= to; L++) {
    if (L % 10 === 0) { const c = CROWNS.find((x) => x.level === L); if (c && !G.ownCrowns.includes(c.id)) { G.ownCrowns.push(c.id); steps.push({ kind: "crown", id: c.id, level: L }); } }
    if (L % 5 === 0) { const got = giftHero(); steps.push(got ? { kind: "hero", ids: got, level: L } : { kind: "gold", level: L }); }
  }
  G.levelSeen = to; G.repSeen = pts; save();
  const startShare = (before - levelStart(from)) / (levelStart(from + 1) - levelStart(from));
  syncPlayer();
  U.over = { type: "levelup", from, to, steps, i: 0, anim: { L: from, share: startShare, end: repShare(), done: false } };
  SND.play("levelup");
}
function repBar(L, share = repShare(), anim = false) {
  const pct = Math.round(share * 100), id = anim ? ' id="lvbar"' : "";

    <div class="rep-bar" role="progressbar" aria-label="Progress to level ${L + 1}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div></div>`;
}
// The level-up screen fills the Reputation bar from where it was, once for every level gained: the seal
// stamps each new level as the bar fills, then the bar settles where the player now stands.
function runLevelAnim() {
  const o = U.over; if (!o || o.type !== "levelup" || o.i !== 0 || !o.anim || o.anim.done || o.anim.running) return;
  const a = o.anim; a.running = true;

  const n = o.to - o.from, ms = reduce ? 0 : n > 6 ? 260 : n > 2 ? 480 : 800;

    const { box } = dom(); if (!box) return;
    const bar = box.querySelector(".rep-bar i"); bar.style.transitionDuration = instant ? "0ms" : `${ms}ms`; bar.style.width = `${Math.round(share * 100)}%`;
    box.querySelector(".rep-next").textContent = `Level ${a.L + 1}`;
    box.querySelector(".rep-bar").setAttribute("aria-valuenow", Math.round(share * 100));
  };

    const { seal } = dom(); if (!seal) return;

  };

      setTimeout(() => { if (U.over !== o) return; a.L += 1; a.share = 0; stamp(); SND.play(a.L === o.to ? "ping" : "tick"); paint(0, true); setTimeout(step, reduce ? 0 : 140); }, ms + 60);
    } else { a.share = a.end; paint(a.end); a.done = true; a.running = false; }

const roman = (n) => [[100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]].reduce((out, [v, r]) => { while (n >= v) { out += r; n -= v; } return out; }, "");
// A wax seal with the level in Roman numerals: the gothic stamp on every level screen.

function levelUpHtml(o) {

  const btn = (label) => `<div class="btns"><button class="btn gilt" data-act="lv-next">${label}</button></div>`;
  if (st.kind === "level") {
    const n = o.to - o.from, rest = o.steps.length - 1, a = o.anim || { L, share: repShare() }, shown = a.done ? L : a.L, c = nextCrownLevel(L);

      <p>${n > 1 ? `From Level ${o.from} to Level ${L}. The realms speak of little else.` : "Word of your deeds spreads across the realms."}</p>

// ---------- players, names and the Hall of Fame ----------
// Each player claims a unique name, kept in the game's Supabase database (project crown-and-chaos) together with
// their level and the crown they wear. There is no sign-in: the phone keeps a long random secret and the database
// stores only its hash, so only this phone can update this name. The public ladder shows names, levels and crowns.
const NET = { url: "https://ozgqbncvttpdjojkmofj.supabase.co", key: "sb_publishable_xWhSyqHJGEllD26JnKIiMw_E1VyNNjf" };
async function rpc(fn, body) {
  const r = await fetch(`${NET.url}/rest/v1/rpc/${fn}`, { method: "POST", headers: { apikey: NET.key, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const text = await r.text(); let data = null; try { data = text ? JSON.parse(text) : null; } catch (e) {}
  if (!r.ok) { const err = new Error((data && data.message) || `HTTP ${r.status}`); err.code = data && data.message; throw err; }
  return data;
}
const NAME_WORDS = { ok: "Available", length: "Use 3 to 16 characters", characters: "Letters, numbers, spaces, - and _ only, starting and ending with a letter or number", reserved: "That name is reserved", blocked: "Please choose another name", taken: "Already taken", too_many: "Too many names made from this connection today. Try again tomorrow." };
const initial = (name) => esc(((name || "?").trim()[0] || "?").toUpperCase());
const myName = () => (G.player && G.player.name) || "You";
function newSecret() { const b = new Uint8Array(32); crypto.getRandomValues(b); return Array.from(b, (x) => x.toString(16).padStart(2, "0")).join(""); }
function askName() {
  if (G.player || U.nameLater || U.over || !G.packOpened) return;
  U.over = { type: "name" };
}
function nameHtml() {
  return gothic(`<p class="eyebrow">The Hall of Fame</p><h1 class="blackletter">What are you called?</h1>
    <p>Choose the name other players will see on the level ladder. It must be yours alone.</p>${DIVIDER}
    <label class="namefield"><span>Your name</span><input id="namein" data-name maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false" value="${esc(U.nameDraft || "")}" aria-describedby="namemsg"></label>
    <p class="namemsg" id="namemsg" role="status">${esc(U.nameMsg || "3 to 16 letters or numbers")}</p>
    <div class="btns"><button class="btn gilt" data-act="name-claim" id="nameclaim">Claim this name</button><button class="btn quiet" data-act="name-later">Later</button></div>`, "lv-name");
}
let nameTimer = null;
function onNameInput(v) {
  U.nameDraft = v; clearTimeout(nameTimer);
  const msg = document.getElementById("namemsg"); if (!msg) return;
  msg.className = "namemsg"; msg.textContent = v.trim().length ? "Checking…" : "3 to 16 letters or numbers";
  if (!v.trim().length) return;
  nameTimer = setTimeout(async () => {
    try { const r = await rpc("name_available", { p_name: v }); if (U.nameDraft !== v) return; msg.textContent = NAME_WORDS[r] || r; msg.className = `namemsg ${r === "ok" ? "good" : "bad"}`; }
    catch (e) { msg.textContent = "Can't reach the Hall of Fame right now"; msg.className = "namemsg bad"; }
  }, 350);
}
async function claimName() {
  const v = (U.nameDraft || "").trim(), msg = document.getElementById("namemsg"), btn = document.getElementById("nameclaim");
  if (!v) { if (msg) msg.textContent = "Type a name first"; return; }
  if (btn) btn.disabled = true;
  const secret = G.playerSecret || newSecret();
  try {
    const id = await rpc("claim_name", { p_name: v, p_secret: secret, p_level: myLevel(), p_crown: G.wearing });
    G.player = { id, name: v, level: myLevel(), crown: G.wearing }; G.playerSecret = secret; save();
    U.over = null; U.ladder = null; SND.play("ping"); render();
  } catch (e) {
    const code = String(e.code || e.message || "").replace(/^name_/, "");
    if (msg) { msg.textContent = NAME_WORDS[code] || "Can't reach the Hall of Fame right now. Try again in a moment."; msg.className = "namemsg bad"; }
    if (btn) btn.disabled = false;
  }
}
// Keep the ladder up to date with the player's level and crown. Quietly retries on the next change if offline.
let syncing = false;
async function syncPlayer() {
  const p = G.player; if (!p || syncing) return;
  const L = myLevel(), crown = G.wearing;
  if (p.level === L && p.crown === crown) return;
  syncing = true;
  try { await rpc("update_player", { p_id: p.id, p_secret: G.playerSecret, p_level: L, p_crown: crown }); p.level = L; p.crown = crown; save(); U.ladder = null; }
  catch (e) {} finally { syncing = false; }
}
// Every finished fight is sent to the fights table for playtesting and balancing: the result, both line-ups,
// rounds, the player's level, and whether the computer was going easy. Fights that can't be sent wait on the phone
// (up to 50) and go with the next one.
const BUILD = "2026-11-19-e41db36";
const lineupIds = (lu) => ({ crown: lu.crown || null, heroes: (lu.heroes || []).filter(Boolean), front: (lu.front || []).filter(Boolean), items: (lu.items || []).filter(Boolean) });
function logFight(st, w) {
  if (!S.lineups) return;
  const me = lineupIds(S.lineups[0]), foe = lineupIds(S.lineups[1]);
  const renownOfIds = (x) => [x.crown, ...x.heroes].reduce((t, id) => t + (DATA.heroes[id]?.renown || 0), 0) + x.front.reduce((t, id) => t + (DATA.front[id]?.renown || 0), 0) + x.items.reduce((t, id) => t + (DATA.items[id]?.renown || 0), 0);
  G.fightQueue = (G.fightQueue || []).concat([{
    p_level: myLevel(), p_result: w === 0 ? "win" : w === 1 ? "loss" : "draw", p_rounds: st.round, p_easy: !!S.easy, p_kind: S.kind === "tutorial" ? "tutorial" : S.kind === "quest" ? "quest" : "computer",
    p_my_crown: me.crown, p_my_heroes: me.heroes, p_my_front: me.front, p_my_items: me.items, p_my_renown: renownOfIds(me),
    p_foe_crown: foe.crown, p_foe_heroes: foe.heroes, p_foe_front: foe.front, p_foe_items: foe.items, p_foe_renown: renownOfIds(foe),
    p_crown_fell: w === 0 ? "theirs" : w === 1 ? "mine" : "both", p_version: BUILD,
  }]).slice(-50);
  save(); sendFights();
}
let sendingFights = false;
async function sendFights() {
  if (sendingFights || !(G.fightQueue || []).length) return;
  sendingFights = true;
  try {
    while (G.fightQueue.length) {
      const f = G.fightQueue[0];
      await rpc("log_fight", { p_id: G.player ? G.player.id : null, p_secret: G.player ? G.playerSecret : null, ...f });
      G.fightQueue.shift(); save();
    }
  } catch (e) {} finally { sendingFights = false; }
}

// ---------- line-up ----------
const SLOTS = ["crown", "h0", "h1", "f0", "f1", "f2", "i0", "i1", "i2"];
const slotKind = (s) => (s === "crown" || s[0] === "h" ? "hero" : s[0] === "f" ? "front" : "item");
function getSlot(lu, s) { return s === "crown" ? lu.crown : s[0] === "h" ? lu.heroes[+s[1]] : s[0] === "f" ? lu.front[+s[1]] : lu.items[+s[1]]; }
function setSlot(lu, s, id) { if (s === "crown") lu.crown = id; else if (s[0] === "h") lu.heroes[+s[1]] = id; else if (s[0] === "f") lu.front[+s[1]] = id; else lu.items[+s[1]] = id; }
const fielded = (lu) => SLOTS.map((s) => getSlot(lu, s)).filter(Boolean);
const usedIn = (lu, id, except) => SLOTS.filter((s) => s !== except && getSlot(lu, s) === id).length;
const hasKoschei = (lu) => [lu.crown, ...lu.heroes].includes("koschei");
const renownOf = (lu) => SLOTS.reduce((sum, s) => { const id = getSlot(lu, s); return sum + (id && !(s === "f2" && hasKoschei(lu)) ? defOf(id).renown || 0 : 0); }, 0);
function prune() { // drop anything from the line-up you no longer own
  for (const s of SLOTS) { const id = getSlot(G.lineup, s); if (id && usedIn(G.lineup, id, s) + 1 > owned(id) && SLOTS.indexOf(s) >= SLOTS.findIndex((x) => getSlot(G.lineup, x) === id) + owned(id)) setSlot(G.lineup, s, ""); }
  for (const s of SLOTS) { const id = getSlot(G.lineup, s); if (id && usedIn(G.lineup, id) > owned(id)) setSlot(G.lineup, s, ""); }
}
function issues(lu) {
  const out = [], hs = [lu.crown, ...lu.heroes].filter(Boolean), r = renownOf(lu);
  if (!lu.crown) out.push("Choose a hero to wear the Crown.");
  if (r > RENOWN_CAP) out.push(`You are ${r - RENOWN_CAP} Renown over the limit of ${RENOWN_CAP}.`);
  if (hs.includes(PAIR[0]) !== hs.includes(PAIR[1])) out.push("Grendel and Grendel's Mother must be fielded together.");
  return out;
}
function autoFill() {
  const lu = emptyLineup(); let left = RENOWN_CAP;
  const hs = Object.keys(G.heroes).filter((id) => !PAIR.includes(id)).sort((a, b) => (DATA.heroes[b].tale === "St George and the Dragon") - (DATA.heroes[a].tale === "St George and the Dragon") || DATA.heroes[b].renown - DATA.heroes[a].renown);
  const chosen = [];
  for (const id of hs) { if (chosen.length < 3 && DATA.heroes[id].renown <= left - 6 && id !== "baba-yaga") { chosen.push(id); left -= DATA.heroes[id].renown; } }
  chosen.sort((a, b) => DATA.heroes[b].stats.health - DATA.heroes[a].stats.health);
  lu.crown = chosen[0] || ""; lu.heroes = [chosen[1] || "", chosen[2] || ""];
  const counts = { ...G.front };
  for (let k = 0; k < 3; k++) {
    const opts = Object.keys(counts).filter((id) => counts[id] > 0 && DATA.front[id].renown <= left - (2 - k)).sort((a, b) => DATA.front[b].renown - DATA.front[a].renown || Math.random() - 0.5);
    const id = opts[0] || "villager"; lu.front[k] = id; left -= DATA.front[id].renown; if (counts[id]) counts[id]--;
  }
  const ic = { ...G.items }; let k = 0;
  for (const id of Object.keys(ic).sort((a, b) => DATA.items[a].renown - DATA.items[b].renown)) { while (ic[id] > 0 && k < BELT && DATA.items[id].renown <= left) { lu.items[k++] = id; left -= DATA.items[id].renown; ic[id]--; } }
  G.lineup = lu;
}
// A helping hand after a losing run: two defeats in a row up to Level 25, three up to Level 50, four after that.
// The computer then fields a badly built company at the full 50 Renown, until the player wins: a Crown that is
// wasted in the Crown slot (Lancelot above all), weak heroes from realms that share no Bond, passive front-rank
// cards, and careless play. The player is never told. In simulation a struggling player wins about 72% of these,
// against about 43% normally. The lists come from simulation (sim) and may want refreshing after rebalancing.
const EASY = {
  crowns: ["lancelot", "the-minotaur", "the-creature", "the-bride", "sigurd"],
  heroes: ["robin-hood", "king-minos", "victor-frankenstein", "little-john", "st-george", "the-tin-soldier", "red-riding-hood", "zmey-gorynych", "polyphemus", "blodeuwedd", "bran-the-blessed", "loki", "the-wolf", "fafnir"],
  front: ["leshy", "monk", "villager"], noise: 1.2,
};
const lossesForHelp = (L) => (L <= 25 ? 2 : L <= 50 ? 3 : 4);
const easyNext = () => (G.lossStreak || 0) >= lossesForHelp(myLevel());
function awkwardFoe(rng) {
  const crown = DATA.heroes[rng.pick(EASY.crowns.filter((id) => DATA.heroes[id]))];
  const hs = [crown.id], realms = new Set([crown.realm]); let budget = RENOWN_CAP - crown.renown;
  for (const id of rng.shuffle(EASY.heroes.filter((x) => DATA.heroes[x]))) {
    const h = DATA.heroes[id]; if (hs.length >= 3) break;
    if (hs.includes(id) || realms.has(h.realm) || h.renown > budget - 3) continue;
    hs.push(id); realms.add(h.realm); budget -= h.renown;
  }
  const fl = EASY.front.map((id) => DATA.front[id]).filter(Boolean);
  const front = [0, 1, 2].map((k) => { const ok = fl.filter((f) => f.renown <= budget - (2 - k)); const f = ok.length ? rng.pick(ok) : DATA.front.villager; budget -= f.renown; return f.id; });
  const items = [0, 1].map(() => { const ok = Object.values(DATA.items).filter((x) => x.renown <= budget); if (!ok.length) return ""; const x = rng.pick(ok); budget -= x.renown; return x.id; }).filter(Boolean);
  return { crown: hs[0], heroes: hs.slice(1), front, items };
}
function randomFoe(easy = false) {
  const rng = E.makeRng(Date.now() + Math.floor(Math.random() * 1e6));
  if (easy) return awkwardFoe(rng);
  const hs = []; let budget = RENOWN_CAP;
  for (const h of rng.shuffle(Object.values(DATA.heroes))) {
    if (hs.length >= 3) break;
    if (h.renown > budget - 3 || PAIR.includes(h.id) || h.id === "baba-yaga") continue;
    hs.push(h.id); budget -= h.renown;
  }
  const fl = Object.values(DATA.front).filter((f) => f.id !== "the-needle");
  const front = [0, 1, 2].map((k) => { const ok = fl.filter((f) => f.renown <= budget - (2 - k)); const f = ok.length ? rng.pick(ok) : DATA.front.villager; budget -= f.renown; return f.id; });
  const items = [0, 1].map(() => { const ok = Object.values(DATA.items).filter((x) => x.renown <= budget); if (!ok.length) return ""; const x = rng.pick(ok); budget -= x.renown; return x.id; }).filter(Boolean);
  return { crown: hs[0], heroes: hs.slice(1), front, items };
}

// Puts a pack's cards in the collection. A crown you already own becomes 20 gold.
function claim(t) {
  const k = tok(t);
  if (!k) { give(t); return ""; }
  if (k.kind === "gold") G.gold += +k.val;
  else if (k.kind === "lore") { if (!G.lore.includes(k.val)) G.lore.push(k.val); }
  else if (k.kind === "var") { if (!G.variants.includes(k.val)) G.variants.push(k.val); }
  else if (k.kind === "crown") { if (G.ownCrowns.includes(k.val)) { G.gold += 20; return "dup"; } G.ownCrowns.push(k.val); }
  return "";
}

  if (o.type === "name") return nameHtml();
  if (o.type === "menu") {
    return `<div class="panel"><p class="eyebrow">Crown &amp; Chaos</p><h1>${esc(S.board.name)}</h1>
      <div class="btns"><button class="btn" data-act="resume">Back to the fight</button>
      <button class="btn quiet" data-act="sound" aria-pressed="${!SND.muted}">Sound: ${SND.muted ? "off" : "on"}</button>
      <button class="btn quiet" data-act="set-music" aria-pressed="${SND.music}">Music: ${SND.music ? "on" : "off"}</button>
      <button class="btn quiet" data-act="motion" aria-pressed="${G.motion !== false}">Card animations: ${G.motion === false ? "off" : "on"}</button>
      ${S.kind === "tutorial" ? `<button class="btn quiet" data-act="tutorial">Restart the tutorial</button><button class="btn quiet" data-act="leave">Leave the tutorial</button>`
        : `<button class="btn quiet" data-act="concede">Concede this fight</button>`}</div>
      ${S.kind === "tutorial" ? "" : `<p class="credit">Conceding pays no gold. Cards already lost stay lost.</p>`}</div>`;
  }
  if (o.type === "gaps") {
    return `<div class="panel" style="text-align:left;align-items:stretch"><p class="eyebrow" style="text-align:center">Before you fight</p><h1 style="text-align:center">Check your line-up</h1>
      <ul>${o.gaps.map((g) => `<li>${esc(g)}</li>`).join("")}</ul>
      <p style="font-size:15.5px;color:var(--muted)">Unspent Renown pays 1 gold a point if you win, so a lean line-up can be a choice.</p>
      <div class="btns"><button class="btn" data-go="formation">Back to my line-up</button><button class="btn quiet" data-act="fight-anyway">Fight anyway</button></div></div>`;
  }
  if (o.type === "night") {
    return `<div class="panel" style="text-align:left;align-items:stretch"><p class="eyebrow" style="text-align:center">Round ${E.NIGHTFALL_ROUND}</p><h1 style="text-align:center">Night falls</h1>${NIGHT_RULES}
      <div class="btns"><button class="btn" data-act="night-ok">Into the dark</button></div><p class="credit" style="text-align:center">Tap the round counter at any time to read this again.</p></div>`;
  }
  if (o.type === "abandoned") {
    const names = (ids) => { const c = {}; ids.forEach((id) => (c[id] = (c[id] || 0) + 1)); return Object.entries(c).map(([id, n]) => `${defOf(id).name}${n > 1 ? ` × ${n}` : ""}`).join(", "); };
    const lost = [...(o.lostFront || []), ...(o.usedItems || [])];
    return `<div class="panel"><p class="eyebrow">Round ${o.round || 1}${o.foe ? ` · against ${esc(o.foe)}` : ""}</p><h1>Fight abandoned</h1>
      <p>The game closed in the middle of a ${o.quest ? "quest fight, so the quest is lost" : "fight, so it counts as conceded"}: no gold${lost.length ? `, and what was already lost stays lost: ${esc(names(lost))}` : ""}.</p>
      <div class="btns"><button class="btn" data-act="close-over">Continue</button></div></div>`;
  }
  if (o.type === "quest-intro") {
    const q = G.quest, t = questTale(q);
    return `<div class="panel" style="text-align:left;align-items:stretch"><p class="eyebrow" style="text-align:center">A quest</p><h1 style="text-align:center">${esc(t.title)}</h1>
      <p class="questtale">${esc(t.open)}</p>
      <ol class="queststeps">${[0, 1, 2].map((k) => `<li>${esc(questStep(q, k).text)}</li>`).join("")}</ol>
      <p style="font-size:15.5px;color:var(--muted)">Your company stays as it is from fight to fight: cards that fall are gone for good, and nobody heals. You hold the Fate token in every quest fight, and night never falls, but a fight still standing after round ${E.QUEST_RULES.maxRounds} is a draw, and a draw ends the quest. Win all three for ${QUEST_REWARD} gold. Lose any fight and the quest ends with nothing. Quests don't count towards the Hall of Fame. You can set out on ${QUESTS_PER_DAY} quests a day; this is quest ${questsToday() + 1} of ${QUESTS_PER_DAY} today.</p>
      <div class="btns"><button class="btn" data-act="quest-go">Set out</button><button class="btn quiet" data-act="quest-cancel">Not now</button></div></div>`;
  }
  if (o.type === "quest-between") {
    const q = G.quest, names = (ids) => ids.map((id) => defOf(id).name).join(", ");
    const lost = [...(o.lostFront || []), ...(o.usedItems || [])];
    return `<div class="panel" style="text-align:left;align-items:stretch"><p class="eyebrow" style="text-align:center">A quest · fight ${q.stage} of 3 won</p><h1 style="text-align:center">You march on</h1>
      ${lost.length ? `<p>Lost on the way: ${esc(names(lost))}.</p>` : ""}${questCompany(q)}
      <p class="questtale">${esc(questStep(q, q.stage).text)}</p>
      <div class="btns"><button class="btn" data-act="quest-go">Fight on</button><button class="btn quiet" data-act="quest-abandon">Abandon the quest</button></div></div>`;
  }
  if (o.type === "quest-end") {
    const done = (G.questsDone || []).length;
    return `<div class="panel">${o.won ? CROWN_SVG : ""}<p class="eyebrow">A quest</p><h1>${o.won ? "Quest complete" : "The quest is lost"}</h1>
      <p class="questtale">${esc(o.won ? o.tale.won : `${o.tale.lost} Gather your company and try again.`)}</p>
      ${o.won ? `<div class="ledger"><div><span>Quest reward</span><b>+${QUEST_REWARD}</b></div><div class="tot"><span>Your gold</span><b>${G.gold}</b></div><div class="tot"><span>Quests completed</span><b>${done}</b></div></div>` : ""}
      <div class="btns"><button class="btn" data-go="home">Home</button><button class="btn quiet" data-go="formation">Line-up</button></div></div>`;
  }
  if (o.type === "tutorial-end") {
    if (o.winner !== 0) return `<div class="panel"><p class="eyebrow">Tutorial</p><h1>${o.winner === 1 ? "Defeat" : "A draw"}</h1><p>The Crown fell. Try the tutorial again.</p><div class="btns"><button class="btn" data-act="tutorial">Try again</button></div></div>`;
    return `<div class="panel">${CROWN_SVG}<p class="eyebrow">Tutorial complete</p><h1>Victory</h1>
      <p>The Dragon is down and the Princess keeps her Crown.${o.first ? " You have taken your first enemy Crown." : ""}</p>
      ${o.first ? `<div class="ledger"><div class="tot"><span>Crowns won</span><b>${G.crowns}</b></div></div>` : ""}
      <ul><li>Protect your Crown; take theirs.</li><li>4 action points a round, one action per hero.</li><li>The front rank acts on its own, every round.</li><li>Fastest acts first; the Fate token breaks ties and crosses the board each round.</li><li>Items act before any card.</li><li>Night falls in round 8: no healing, and every card takes rising damage.</li></ul>
      <div class="btns"><button class="btn" data-act="after-tutorial">Continue</button></div></div>`;
  }
  const names = (ids) => { const c = {}; ids.forEach((id) => (c[id] = (c[id] || 0) + 1)); return Object.entries(c).map(([id, n]) => `${defOf(id).name}${n > 1 ? ` × ${n}` : ""}`).join(", "); };
  return `<div class="panel">${o.winner === 0 ? CROWN_SVG : ""}<p class="eyebrow">Round ${o.round} · against ${esc(S.foeName)}</p>
    <h1>${o.conceded ? "Conceded" : o.winner === 0 ? "Victory" : o.winner === 1 ? "Defeat" : "A draw"}</h1>
    ${o.conceded ? `<p>A conceded fight pays no gold.</p>` : ""}<div class="ledger">${o.lines.map(([l, n]) => `<div><span>${esc(l)}</span><b>+${n}</b></div>`).join("")}<div class="tot"><span>Your gold</span><b>${G.gold}</b></div>${o.winner === 0 ? `<div class="tot"><span>Crowns won</span><b>${G.crowns}</b></div>` : ""}</div>
    <p style="font-size:15.5px">${o.lostFront.length ? `Fell in the front rank, and gone for good: ${esc(names(o.lostFront))}.` : "Your front rank all came home."}${o.usedItems.length ? ` Used up: ${esc(names(o.usedItems))}.` : ""}</p>
    <div class="btns"><button class="btn" data-act="fight">Fight again</button><button class="btn quiet" data-go="formation">Line-up</button><button class="btn quiet" data-go="shop">Shop</button><button class="btn quiet" data-go="home">Home</button></div></div>`;
}
function sheetHtml() {
  const sh = U.sheet; if (!sh) return "";
  return { card: cardSheet, item: itemSheet, targets: targetSheet, picker: pickerSheet, detail: detailSheet, night: nightSheet, lore: loreSheet }[sh.type](sh);
}
function render() {
  const battle = U.screen === "battle";
  el("battle").hidden = !battle; el("page").hidden = battle;
  if (battle) renderBattle(); else renderPage();
  el("sheet").innerHTML = sheetHtml();
  el("over").innerHTML = overHtml();
  runLevelAnim();
}

// =====================================================================================
// Input
// =====================================================================================
function go(screen) {
  if (!G.packOpened && !["home", "ready"].includes(screen)) screen = "home";
  clearTimeout(S.timer);
  Object.assign(U, { screen, sheet: null, over: null, confirmReset: false });
  if (screen === "formation") prune();
  if (screen !== "pack" && screen !== "ready") { checkLevel(); askName(); syncPlayer(); }
  if (screen === "hall") U.ladder = null;
  render();
}
function chooseForSlot(id) {
  const s = U.sheet.slot, lu = G.lineup;
  if (id === "baba-yaga") { if (s !== "crown") return; }
  setSlot(lu, s, id); U.sheet = null; save(); render();
}
function buy(id) {
  const price = kindOf(id) === "front" ? frontPrice(id) : PRICES[DATA.items[id].rarity];
  if (G.gold < price) return;
  spend(price); give(id); save(); checkLevel(); render();
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act],[data-go],[data-tab]");
  if (!t) { if (e.target.id === "sheet" && !step()) { U.sheet = U.sheet && U.sheet.back ? U.sheet.back : null; render(); } return; }
  if (t.disabled) return;
  if (S.animating && !["skip", "speed", "sound", "menu"].includes(t.dataset.act)) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.tab) { U.tab = t.dataset.tab; U.kept = null; return render(); }
  const act = t.dataset.act, d = t.dataset;
  switch (act) {
    case "card": tapCard(+d.uid); break;
    case "action": chooseAction(+d.k); break;
    case "item": tapItem(d.id); break;
    case "use-item": useItem(); break;
    case "target": completePick(+d.uid); render(); break;
    case "mark": { const m = markInfo(); U.sheet = null; beginPick({ kind: "mark", key: m.key, name: m.name }, m.cards); render(); break; }
    case "unmark": { const m = markInfo(); if (m) S.plan[m.key] = null; render(); break; }
    case "lock": lock(); break;
    case "next": { const g = step(); if (g && g.next) { advance(); render(); } break; }
    case "skip": endPlayback(); break;
    case "speed": G.fast = !G.fast; save(); if (!S.animating) { clearTimeout(S.timer); S.timer = setTimeout(nextFrame, 250); } render(); break;
    case "sound": SND.setMuted(!SND.muted); if (!SND.muted) SND.play("ping"); render(); break;
    case "motion": G.motion = G.motion === false; save(); render(); break;
    case "night": if (!step() && !S.pick) { U.sheet = { type: "night" }; render(); } break;
    case "night-ok": G.nightSeen = true; save(); U.over = null; render(); break;
    case "close": U.sheet = null; render(); break;
    case "close-detail": U.sheet = U.sheet.back || null; render(); break;
    case "cancel": S.pick = null; render(); break;
    case "del-order": S.plan.orders.splice(+d.k, 1); render(); break;
    case "del-item": S.plan.items.splice(+d.k, 1); render(); break;
    case "menu": if (S.phase === "play") endPlayback(); if (S.phase !== "over") { U.over = { type: "menu" }; render(); } break;
    case "resume": U.over = null; render(); break;
    case "concede": U.over = null; concede(); break;
    case "close-over": U.over = null; checkLevel(); render(); break;
    case "quest-new": newQuest(); break;
    case "quest-go": U.over = null; questFight(); break;
    case "quest-cancel": delete G.quest; U.over = null; save(); render(); break;
    case "quest-resume": U.over = { type: G.quest && G.quest.began ? "quest-between" : "quest-intro" }; render(); break;
    case "quest-abandon": delete G.quest; U.over = null; U.screen = "home"; save(); render(); break;
    case "leave": go("home"); break;
    case "tutorial": startTutorial(); break;
    case "after-tutorial": G.tutorialDone = true; save(); go(G.packOpened ? "home" : "ready"); break;
    case "open-first": G.packOpened = true; G.tutorialDone = true; G.gold += START_GOLD; U.over = null;
      openPack(firstPack(), { title: "Your first Fable pack", first: true }); render(); break;
    case "pack-next": U.pack.i += 1; render(); break;
    case "pack-all": U.pack.i = U.pack.cards.length; render(); break;
    case "detail": U.sheet = { type: "detail", id: d.id, back: U.sheet && U.sheet.type === "picker" ? U.sheet : null }; render(); break;
    case "slot": U.sheet = { type: "picker", slot: d.slot }; render(); break;
    case "choose": chooseForSlot(d.id); break;
    case "tip": G.tip += 1; save(); render(); break;
    case "autofill": autoFill(); save(); render(); break;
    case "clear": G.lineup = emptyLineup(); save(); render(); break;
    case "fight": U.over = null; startFight(); break;
    case "fight-anyway": U.over = null; startFight(true); break;
    case "buy": buy(d.id); break;
    case "set-sound": SND.setMuted(!SND.muted); if (!SND.muted) SND.play("ping"); render(); break;
    case "set-music": SND.setMusic(!SND.music); render(); break;
    case "set-fast": G.fast = !G.fast; save(); render(); break;
    case "admin-all": PREFS.write("adminAll", !adminAll()); render(); break;
    case "lv-wear": if (G.ownCrowns.includes(d.id)) { G.wearing = d.id; save(); SND.play("ping"); syncPlayer(); } // falls through to the next step
    case "lv-next": { const o = U.over; if (o && o.type === "levelup" && o.i < o.steps.length - 1) o.i += 1; else U.over = null; render(); break; }
    case "court-crowns": U.tab = "crown"; go("collection"); break;
    case "buy-crown": { const c = crownById[d.id]; if (c && c.price && G.gold >= c.price && !G.ownCrowns.includes(c.id)) { spend(c.price); G.ownCrowns.push(c.id); save(); checkLevel(); render(); } break; }
    case "lore": U.sheet = { type: "lore", id: d.id }; render(); break;
    case "wear-crown": if (G.ownCrowns.includes(d.id)) { G.wearing = d.id; save(); syncPlayer(); } U.sheet = null; render(); break;
    case "name-open": U.nameLater = false; U.over = { type: "name" }; render(); setTimeout(() => document.getElementById("namein")?.focus(), 50); break;
    case "name-later": U.nameLater = true; U.over = null; render(); break;
    case "name-claim": claimName(); break;
    case "ladder-retry": U.ladderError = false; U.ladder = null; render(); break;
    case "wear-art": if (!d.key || G.variants.includes(d.key)) { if (d.key) G.art[d.card] = d.key; else delete G.art[d.card]; save(); } render(); break;
    case "lib-tab": U.tab = d.tab2; U.sheet = null; U.kept = null; render(); break;
    case "buy-pack": if (G.gold >= PRICES.pack) { spend(PRICES.pack); openPack(fablePack(), { title: "Fable pack" }); render(); } break;
    case "reset": if (U.confirmReset) { G = fresh(); save(); U.confirmReset = false; go("home"); } else { U.confirmReset = true; render(); } break;
  }
});
document.addEventListener("input", (e) => {
  if (e.target.dataset && e.target.dataset.name != null) { onNameInput(e.target.value); return; }
  const k = e.target.dataset && e.target.dataset.vol; if (!k) return;
  const v = +e.target.value / 100;
  if (k === "sfx") { SND.setVolume(v); SND.play("tick"); } else SND.setMusicVolume(v);
});
document.addEventListener("change", (e) => { if (e.target.dataset.filter != null) { U.realm = e.target.value; render(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "namein") { e.preventDefault(); claimName(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && U.sheet && !step()) { U.sheet = U.sheet.back || null; render(); } });
if (G.tutorialDone && !G.packOpened) U.screen = "ready";
try { const q = new URLSearchParams(location.search); if (q.has("admin")) PREFS.write("admin", q.get("admin") !== "0"); } catch (e) {}
document.addEventListener("pointerdown", () => SND.startMusic(), { once: true });
abandonedFight();
if (!U.over) checkLevel();
askName();
syncPlayer();
sendFights();
render();
</script>
<script>
// Installable web app: register the service worker when the game is served from its own site (not inside a preview).
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
