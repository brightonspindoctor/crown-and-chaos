const LORE = {"baba-yaga":{"hero":"baba-yaga","personality":"Ancient, hungry and fair in her own terrible way. She keeps her word, and she eats those who waste her time.","voice":"Ask too much and you grow old here.","cards":[{"id":"baba-yaga-1","n":1,"title":"The Old Woman of the Forest","text":"Deep in the forest stands her house, fenced with human bones, with a skull on every stake. At night the skulls' eyes burn and light the clearing like noon. Three riders serve her: a white one who brings the bright day, a red one who is the sun, and a black one who is the dark night. She is older than any of them, and she eats those who displease her.","source":{"work":"Vasilísa the Fair","author":"collected by A. N. Afanasyev, 1855–67; English by Leonard A. Magnus, 1915","edition":"Russian Folk-Tales, Kegan Paul, 1915","chapter":"Vasilísa the Fair","url":"https://www.gutenberg.org/ebooks/62509","licence":"Public domain"}},{"id":"baba-yaga-2","n":2,"title":"The Girl Who Came for Fire","text":"One night a merchant's daughter, Vasilisa, came to her gate. Her cruel stepmother had sent her to fetch fire from Baba Yaga, hoping she would never return. The witch came home riding her mortar, steering with her pestle. She agreed to give the girl fire if she worked for it, and set her impossible tasks. If one was left undone, she would eat her.","source":{"work":"Vasilísa the Fair","author":"collected by A. N. Afanasyev, 1855–67; English by Leonard A. Magnus, 1915","edition":"Russian Folk-Tales, Kegan Paul, 1915","chapter":"Vasilísa the Fair","url":"https://www.gutenberg.org/ebooks/62509","licence":"Public domain"}},{"id":"baba-yaga-3","n":3,"title":"The Blessing","text":"Every task was done. The witch asked how, and Vasilisa said her dead mother's blessing helped her. Baba Yaga would not keep a blessed girl in her house, so she sent her home with what she had come for: a skull with burning eyes. That night its stare burned the stepmother and her daughters to ashes. Baba Yaga stayed in her forest, and is there still.","source":{"work":"Vasilísa the Fair","author":"collected by A. N. Afanasyev, 1855–67; English by Leonard A. Magnus, 1915","edition":"Russian Folk-Tales, Kegan Paul, 1915","chapter":"Vasilísa the Fair","url":"https://www.gutenberg.org/ebooks/62509","licence":"Public domain"}}]},"beowulf":{"hero":"beowulf","personality":"Proud, plain-spoken and fearless. He boasts, and then he does exactly what he said.","voice":"I will not bear a blade against him.","cards":[{"id":"beowulf-1","n":1,"title":"Ecgtheow's Son","text":"Beowulf was a Geat, the son of Ecgtheow and the nephew of King Hygelac. As a boy he was thought slow, but he grew into the strongest man of his age, with the grip of thirty men. As a young man he swam a race against Breca for days and nights in the open sea, and killed nine sea-monsters that dragged him to the bottom.","source":{"work":"Beowulf","author":"Anglo-Saxon poem, c. 700–1000; English by Francis B. Gummere, 1910","edition":"Harvard Classics, 1910","chapter":"Beowulf","url":"https://www.gutenberg.org/ebooks/981","licence":"Public domain"}},{"id":"beowulf-2","n":2,"title":"Heorot","text":"For twelve winters a monster called Grendel had raided the Danish king's hall, Heorot. Beowulf crossed the sea with fourteen companions and fought Grendel bare-handed, tearing off his arm. The next night Grendel's mother came for revenge, and Beowulf followed her down into her lake and killed her with a giants' sword he found on her wall. He went home loaded with gifts.","source":{"work":"Beowulf","author":"Anglo-Saxon poem, c. 700–1000; English by Francis B. Gummere, 1910","edition":"Harvard Classics, 1910","chapter":"Beowulf","url":"https://www.gutenberg.org/ebooks/981","licence":"Public domain"}},{"id":"beowulf-3","n":3,"title":"Fifty Winters","text":"In time Beowulf became king of the Geats and ruled them well for fifty winters. When he was old, a thief stole a cup from a dragon's hoard and the dragon burned his country. Beowulf went out against it with an iron shield. His men ran, all but young Wiglaf. Together they killed the dragon, but its venom killed the king. They buried him in a great mound on a headland, where sailors could see it from the sea.","source":{"work":"Beowulf","author":"Anglo-Saxon poem, c. 700–1000; English by Francis B. Gummere, 1910","edition":"Harvard Classics, 1910","chapter":"Beowulf","url":"https://www.gutenberg.org/ebooks/981","licence":"Public domain"}}]},"circe":{"hero":"circe","personality":"Lovely, amused and dangerous. She sees what people truly are and helps them become it.","voice":"Come in, and be welcome. Drink.","cards":[{"id":"circe-1","n":1,"title":"Aiaia","text":"Circe, daughter of the Sun, lived on the island of Aiaia in a stone house deep in the woods. Tame wolves and lions fawned around her door, and she sang as she wove at her great loom. Travellers who found her house were given a warm welcome and a sweet drink.","source":{"work":"The Odyssey","author":"Homer; English prose by Samuel Butler, 1900","edition":"A. C. Fifield, 1900","chapter":"Book X","url":"https://sacred-texts.com/cla/homer/ody/ody10.htm","licence":"Public domain"}},{"id":"circe-2","n":2,"title":"The Swine","text":"Odysseus's scouts drank her wine, mixed with a drug that made them forget home. She touched them with her wand and they became pigs, grunting in her sties but still thinking like men. Odysseus came to rescue them carrying a herb called moly from Hermes, so her magic could not touch him. She swore not to harm him and turned his men back again.","source":{"work":"Tanglewood Tales","author":"Nathaniel Hawthorne, 1853","edition":"Ticknor, Reed and Fields, 1853","url":"https://www.gutenberg.org/ebooks/976","licence":"Public domain","chapter":"Circe's Palace"}},{"id":"circe-3","n":3,"title":"Counsel","text":"For a whole year she kept Odysseus and his crew as honoured guests. When he finally asked to leave, she did not stop him. Instead she told him the way ahead: the Sirens' song, the rocks of Scylla and Charybdis, and the cattle of the Sun that must never be touched.","source":{"work":"The Odyssey","author":"Homer; English prose by Samuel Butler, 1900","edition":"A. C. Fifield, 1900","chapter":"Book XII","url":"https://sacred-texts.com/cla/homer/ody/ody12.htm","licence":"Public domain"}}]},"king-minos":{"hero":"king-minos","personality":"Stern, wealthy and unbending. He rules the sea and expects every city in it to pay.","voice":"Crete is owed, and Crete will be paid.","cards":[{"id":"king-minos-1","n":1,"title":"The Sea King","text":"Minos ruled Crete and its great fleets. When his son was killed in Athens, he made war on the city until it agreed to a terrible price. Every few years, Athens must send seven young men and seven young women to Crete, and none of them ever came home.","source":{"work":"The Heroes, or Greek Fairy Tales for My Children","author":"Charles Kingsley, 1856","edition":"Macmillan, 1856","url":"https://sacred-texts.com/cla/gft/index.htm","licence":"Public domain","chapter":"Theseus: How Theseus Slew the Minotaur"}},{"id":"king-minos-2","n":2,"title":"The Labyrinth","text":"Under his palace, his clever craftsman Daedalus built a maze of passages so tangled that no one who entered could find the way out. At its heart lived the Minotaur, and the young people of Athens were sent in to be its food. Minos kept the secret of the maze and was proud of it.","source":{"work":"Tanglewood Tales","author":"Nathaniel Hawthorne, 1853","edition":"Ticknor, Reed and Fields, 1853","url":"https://www.gutenberg.org/ebooks/976","licence":"Public domain","chapter":"The Minotaur"}},{"id":"king-minos-3","n":3,"title":"Judge of the Dead","text":"Minos's laws were so strict that even death did not end his rule. In the House of Hades, Odysseus saw him on his throne, holding a golden sceptre and judging the dead as they gathered round to plead their cases.","source":{"work":"The Odyssey","author":"Homer; English prose by Samuel Butler, 1900","edition":"A. C. Fifield, 1900","chapter":"Book XI","url":"https://sacred-texts.com/cla/homer/ody/ody11.htm","licence":"Public domain"}}]},"medusa":{"hero":"medusa","personality":"Cold, sorrowful and terrible. She was once a beautiful woman, and the curse took everything but her pride.","voice":"Look at me. Everyone does, once.","cards":[{"id":"medusa-1","n":1,"title":"The Cursed Sister","text":"Of three Gorgon sisters, Medusa alone could die. She had been beautiful once, but a curse turned her hair to living snakes. Ever after, anyone who looked her in the face became stone. She lived with her sisters at the far edge of the world, among the statues of people who had come to stare.","source":{"work":"The Heroes, or Greek Fairy Tales for My Children","author":"Charles Kingsley, 1856","edition":"Macmillan, 1856","url":"https://sacred-texts.com/cla/gft/index.htm","licence":"Public domain","chapter":"Perseus: How Perseus Slew the Gorgon"}},{"id":"medusa-2","n":2,"title":"The Stone Garden","text":"Around the Gorgons' home stood men and beasts who had met her eyes and turned to stone in mid-stride. The snakes on her head hissed and writhed even while she slept. No hero who came looking for her had ever gone home again.","source":{"work":"A Wonder-Book for Girls and Boys","author":"Nathaniel Hawthorne, 1851","edition":"Ticknor, Reed and Fields, 1851 (Walter Crane edition, 1893)","url":"https://www.gutenberg.org/ebooks/32242","licence":"Public domain","chapter":"The Gorgon's Head"}},{"id":"medusa-3","n":3,"title":"The Mirror","text":"Perseus came on winged sandals while the sisters slept. He watched her only in his polished shield and struck her head off with one blow. Her sisters woke screaming and hunted the sky for him, but he was gone. Even dead, her gaze kept its power, and it turned a king and his court to stone.","source":{"work":"A Wonder-Book for Girls and Boys","author":"Nathaniel Hawthorne, 1851","edition":"Ticknor, Reed and Fields, 1851 (Walter Crane edition, 1893)","url":"https://www.gutenberg.org/ebooks/32242","licence":"Public domain","chapter":"The Gorgon's Head"}}]},"odysseus":{"hero":"odysseus","personality":"Clever, patient and proud of it. He would rather trick an enemy than fight one, and he never forgets the road home.","voice":"My name is Nobody.","cards":[{"id":"odysseus-1","n":1,"title":"The Wooden Horse","text":"For ten years the Greeks besieged Troy and could not take it. Odysseus had a great wooden horse built and hid the best fighters inside it. The Trojans dragged it through their gates as a prize. That night the Greeks climbed out, and Troy fell to a trick.","source":{"work":"The Odyssey","author":"Homer; English prose by Samuel Butler, 1900","edition":"A. C. Fifield, 1900","chapter":"Book VIII","url":"https://sacred-texts.com/cla/homer/ody/ody08.htm","licence":"Public domain"}},{"id":"odysseus-2","n":2,"title":"Nobody","text":"Sailing home, he and his men were trapped in a cave by the Cyclops Polyphemus, who began to eat them. Odysseus made the giant drunk and told him his name was Nobody. Then they blinded him with a burning stake. When the other Cyclopes asked who was hurting him, he roared, \"Nobody!\" and they went away.","source":{"work":"The Odyssey","author":"Homer; English prose by Samuel Butler, 1900","edition":"A. C. Fifield, 1900","chapter":"Book IX","url":"https://sacred-texts.com/cla/homer/ody/ody09.htm","licence":"Public domain"}},{"id":"odysseus-3","n":3,"title":"The Bow","text":"Odysseus came home to Ithaca after twenty years, dressed as a beggar. His house was full of men trying to marry his wife Penelope. She set a test: string Odysseus's great bow and shoot through twelve axe heads. None of them could even bend it. The beggar strung it easily, made the shot, and turned the bow on them.","source":{"work":"The Odyssey","author":"Homer; English prose by Samuel Butler, 1900","edition":"A. C. Fifield, 1900","chapter":"Book XXI","url":"https://sacred-texts.com/cla/homer/ody/ody21.htm","licence":"Public domain"}}]},"perseus":{"hero":"perseus","personality":"Brave, eager and a little reckless. He makes promises first and works out how to keep them afterwards.","voice":"Bring me what I swore to bring.","cards":[{"id":"perseus-1","n":1,"title":"Cast Adrift","text":"His grandfather feared a prophecy and shut the baby Perseus and his mother Danaë in a wooden chest, then set it adrift on the sea. The chest washed up on the island of Seriphos, where a fisherman took them in. Perseus grew up strong there, mending nets and watching over his mother.","source":{"work":"The Heroes, or Greek Fairy Tales for My Children","author":"Charles Kingsley, 1856","edition":"Macmillan, 1856","url":"https://sacred-texts.com/cla/gft/index.htm","licence":"Public domain","chapter":"Perseus: How Perseus and his Mother came to Seriphos"}},{"id":"perseus-2","n":2,"title":"The Rash Vow","text":"Seriphos's king, Polydectes, wanted Danaë for himself and wanted her son out of the way. At his feast, proud young Perseus promised to bring him the Gorgon's head. Help came from the gods: winged sandals, a sharp blade, a bag for the head and a polished shield to look into, never at the Gorgon herself.","source":{"work":"The Heroes, or Greek Fairy Tales for My Children","author":"Charles Kingsley, 1856","edition":"Macmillan, 1856","url":"https://sacred-texts.com/cla/gft/index.htm","licence":"Public domain","chapter":"Perseus: How Perseus Vowed a Rash Vow"}},{"id":"perseus-3","n":3,"title":"Home Again","text":"Flying home with the head, he found Andromeda chained to a rock for a sea monster and freed her. Back on Seriphos, the king and his friends still mocked him. Perseus drew out the Gorgon's head, and they sat at their table as stone. Then he gave the head away, his vow kept.","source":{"work":"The Heroes, or Greek Fairy Tales for My Children","author":"Charles Kingsley, 1856","edition":"Macmillan, 1856","url":"https://sacred-texts.com/cla/gft/index.htm","licence":"Public domain","chapter":"Perseus: How Perseus came Home Again"}}]},"polyphemus":{"hero":"polyphemus","personality":"Huge, lonely and savage. He cares for his sheep more gently than for any person, god or guest.","voice":"Who are you, stranger? Speak, and I will eat you last.","cards":[{"id":"polyphemus-1","n":1,"title":"The Shepherd Giant","text":"Polyphemus, son of the sea god Poseidon, was a one-eyed giant. He lived alone in a cave with his sheep and goats, made cheese, and respected no gods and no laws of hospitality. When strangers came to his cave, he rolled a huge stone across the door and ate them two at a time.","source":{"work":"The Odyssey","author":"Homer; English prose by Samuel Butler, 1900","edition":"A. C. Fifield, 1900","chapter":"Book IX","url":"https://sacred-texts.com/cla/homer/ody/ody09.htm","licence":"Public domain"}},{"id":"polyphemus-2","n":2,"title":"Blinded","text":"He was promised a gift for eating the stranger called Nobody last. The gift was strong wine, and he drank until he fell asleep. He woke to a burning stake in his eye. In the morning he felt along his rams' backs as they went out, but the men clung beneath the sheep's bellies and slipped out past him.","source":{"work":"The Odyssey","author":"Homer; English prose by Samuel Butler, 1900","edition":"A. C. Fifield, 1900","chapter":"Book IX","url":"https://sacred-texts.com/cla/homer/ody/ody09.htm","licence":"Public domain"}},{"id":"polyphemus-3","n":3,"title":"The Curse","text":"From his ship, Odysseus shouted his real name back at him. The blind giant tore off a mountain top and hurled it, and the wave almost carried the ship back to shore. Then Polyphemus prayed to his father Poseidon, and the sea god made sure Odysseus's long journey home was paid for in years.","source":{"work":"The Odyssey","author":"Homer; English prose by Samuel Butler, 1900","edition":"A. C. Fifield, 1900","chapter":"Book IX","url":"https://sacred-texts.com/cla/homer/ody/ody09.htm","licence":"Public domain"}}]},"red-riding-hood":{"hero":"red-riding-hood","personality":"Bright, trusting and quick to learn. She is fooled once and never again.","voice":"I will never leave the path again.","cards":[{"id":"red-riding-hood-1","n":1,"title":"The Red Cap","text":"There was once a sweet little girl who was loved by everyone who saw her, and most of all by her grandmother, who could not give her enough. One day the grandmother gave her a little cap of red velvet. It suited her so well that she would wear nothing else, and so everyone called her Little Red-Cap.","source":{"work":"Grimm's Household Tales","author":"Jacob and Wilhelm Grimm, 1812–57; English by Margaret Hunt, 1884","edition":"George Bell and Sons, 1884","chapter":"Little Red-Cap","url":"https://en.wikisource.org/wiki/Grimm%27s_Household_Tales,_Volume_1/Little_Red-Cap","licence":"Public domain"}},{"id":"red-riding-hood-2","n":2,"title":"The Path Through the Wood","text":"Her mother sent her through the wood with cake and wine for her grandmother, who was ill, and told her not to leave the path. A wolf met her and talked her into picking flowers. When she reached the cottage he was already in her grandmother's bed, and he swallowed her whole. A passing huntsman cut him open, and out she came, saying how dark it had been inside.","source":{"work":"Grimm's Household Tales","author":"Jacob and Wilhelm Grimm, 1812–57; English by Margaret Hunt, 1884","edition":"George Bell and Sons, 1884","chapter":"Little Red-Cap","url":"https://en.wikisource.org/wiki/Grimm%27s_Household_Tales,_Volume_1/Little_Red-Cap","licence":"Public domain"}},{"id":"red-riding-hood-3","n":3,"title":"Never Again","text":"Afterwards she promised herself she would never leave the path again. Some time later another wolf spoke to her in the wood, and this time she hurried straight to her grandmother's and told her. They bolted the door. The wolf climbed onto the roof to wait for her, so they filled the trough below with water that sausages had been boiled in. The smell drew him down; he slipped and drowned.","source":{"work":"Grimm's Household Tales","author":"Jacob and Wilhelm Grimm, 1812–57; English by Margaret Hunt, 1884","edition":"George Bell and Sons, 1884","chapter":"Little Red-Cap","url":"https://en.wikisource.org/wiki/Grimm%27s_Household_Tales,_Volume_1/Little_Red-Cap","licence":"Public domain"}}]},"st-george":{"hero":"st-george","personality":"Dutiful, tired and courteous. He fights to protect, not for glory.","voice":"Stand behind me.","cards":[{"id":"st-george-1","n":1,"title":"The Knight of Cappadocia","text":"George was born in Cappadocia and became a soldier, a tribune in the Roman army. Riding alone through Libya, he came to the city of Silene and found it in mourning. A dragon lived in the lake beside its walls, and the people had been feeding it their children to keep it away. That day, the lot had fallen on the king's daughter.","source":{"work":"The Golden Legend","author":"Jacobus de Voragine, c. 1260; English by William Caxton, 1483","edition":"Temple Classics, ed. F. S. Ellis, 1900","chapter":"Of S. George, Martyr","url":"https://sourcebooks.web.fordham.edu/basis/goldenlegend/GL-vol3-george.asp","licence":"Public domain"}},{"id":"st-george-2","n":2,"title":"The Dragon of Silene","text":"He found the princess waiting at the lake and would not leave her. When the dragon rose from the water he wounded it with his spear, and she led it into the city on her girdle. There George promised to kill it if the people would be baptised. They agreed, and he slew it before them all. The king offered him great treasure, and George gave every coin of it to the poor.","source":{"work":"The Golden Legend","author":"Jacobus de Voragine, c. 1260; English by William Caxton, 1483","edition":"Temple Classics, ed. F. S. Ellis, 1900","chapter":"Of S. George, Martyr","url":"https://sourcebooks.web.fordham.edu/basis/goldenlegend/GL-vol3-george.asp","licence":"Public domain"}},{"id":"st-george-3","n":3,"title":"The Last Battle","text":"Years later, the emperor ordered every Christian to sacrifice to the old gods. George gave away all he owned, took off his soldier's dress and refused in front of the court. They tortured him for days and could not make him yield, so they beheaded him. Long afterwards, the legend says, crusaders at Jerusalem saw a knight in white armour with a red cross fighting beside them, and knew him.","source":{"work":"The Golden Legend","author":"Jacobus de Voragine, c. 1260; English by William Caxton, 1483","edition":"Temple Classics, ed. F. S. Ellis, 1900","chapter":"Of S. George, Martyr","url":"https://sourcebooks.web.fordham.edu/basis/goldenlegend/GL-vol3-george.asp","licence":"Public domain"}}]},"the-dragon":{"hero":"the-dragon","personality":"Ancient, hungry, and then tamed. Its loyalty is grudging but complete.","voice":"Something must burn.","cards":[{"id":"the-dragon-1","n":1,"title":"The Thing in the Lake","text":"No one in Silene knew where it came from. One day there was simply a dragon in the great lake outside the walls, as wide as a sea. When it came near the city its breath poisoned the air, and people died without being touched. The citizens armed themselves and marched out against it. They were beaten back, and after that they did not go out again.","source":{"work":"The Golden Legend","author":"Jacobus de Voragine, c. 1260; English by William Caxton, 1483","edition":"Temple Classics, ed. F. S. Ellis, 1900","chapter":"Of S. George, Martyr","url":"https://sourcebooks.web.fordham.edu/basis/goldenlegend/GL-vol3-george.asp","licence":"Public domain"}},{"id":"the-dragon-2","n":2,"title":"The Tribute","text":"To keep it from the walls, the city fed it two sheep every day. When the sheep grew few, they gave it one sheep and one person. When the sheep ran out, they drew lots among the children, and no family, rich or poor, was spared. For years the dragon lay in its lake and waited to be fed, until the day the lot fell on the king's own daughter.","source":{"work":"The Golden Legend","author":"Jacobus de Voragine, c. 1260; English by William Caxton, 1483","edition":"Temple Classics, ed. F. S. Ellis, 1900","chapter":"Of S. George, Martyr","url":"https://sourcebooks.web.fordham.edu/basis/goldenlegend/GL-vol3-george.asp","licence":"Public domain"}},{"id":"the-dragon-3","n":3,"title":"Led on a Girdle","text":"A stranger's spear brought it down at the lakeside. Wounded and tied with the princess's girdle, the dragon followed her into Silene as meekly as a dog, while the people who had fed it fled in terror. In the city square the knight killed it. It was so huge that it took four teams of oxen to drag its body out beyond the walls.","source":{"work":"The Golden Legend","author":"Jacobus de Voragine, c. 1260; English by William Caxton, 1483","edition":"Temple Classics, ed. F. S. Ellis, 1900","chapter":"Of S. George, Martyr","url":"https://sourcebooks.web.fordham.edu/basis/goldenlegend/GL-vol3-george.asp","licence":"Public domain"}}]},"the-huntsman":{"hero":"the-huntsman","personality":"Steady, watchful and slow to shoot. He has been tracking this one for a long time.","voice":"Do I find you here, you old sinner?","cards":[{"id":"the-huntsman-1","n":1,"title":"Years on the Trail","text":"He knew every path in the wood, and for years he had tracked one old wolf that always slipped away. One day, passing the old woman's cottage, he heard snoring far louder than any grandmother could make. Worried that she was ill, he went in. There in her bed lay the wolf. He had long sought him, and now he had found him.","source":{"work":"Grimm's Household Tales","author":"Jacob and Wilhelm Grimm, 1812–57; English by Margaret Hunt, 1884","edition":"George Bell and Sons, 1884","chapter":"Little Red-Cap","url":"https://en.wikisource.org/wiki/Grimm%27s_Household_Tales,_Volume_1/Little_Red-Cap","licence":"Public domain"}},{"id":"the-huntsman-2","n":2,"title":"Scissors, Not a Shot","text":"He raised his gun, then lowered it. The wolf might have swallowed the grandmother, and she might still be saved. So he took a pair of scissors and carefully cut open the sleeping wolf's belly. After a few snips he saw a red cap shining, and a little girl sprang out, and then the grandmother after her, weak but alive.","source":{"work":"Grimm's Household Tales","author":"Jacob and Wilhelm Grimm, 1812–57; English by Margaret Hunt, 1884","edition":"George Bell and Sons, 1884","chapter":"Little Red-Cap","url":"https://en.wikisource.org/wiki/Grimm%27s_Household_Tales,_Volume_1/Little_Red-Cap","licence":"Public domain"}},{"id":"the-huntsman-3","n":3,"title":"Home With the Pelt","text":"The girl fetched great stones, and they filled the wolf's belly with them. When he woke and tried to escape, he fell down dead. The huntsman skinned the old enemy he had chased for so long and went home with the pelt, while the grandmother ate the cake and drank the wine, and all three of them were glad.","source":{"work":"Grimm's Household Tales","author":"Jacob and Wilhelm Grimm, 1812–57; English by Margaret Hunt, 1884","edition":"George Bell and Sons, 1884","chapter":"Little Red-Cap","url":"https://en.wikisource.org/wiki/Grimm%27s_Household_Tales,_Volume_1/Little_Red-Cap","licence":"Public domain"}}]},"the-minotaur":{"hero":"the-minotaur","personality":"Furious, hungry and alone in the dark. Half bull and half man, he belongs to neither world.","voice":"(A bellow that shakes the walls.)","cards":[{"id":"the-minotaur-1","n":1,"title":"Born a Monster","text":"The Minotaur was born in the royal house of Crete, with a man's body and a bull's head. King Minos could not kill it and could not bear to see it. He had it shut away in the dark at the heart of the Labyrinth, where it roared and paced alone.","source":{"work":"Tanglewood Tales","author":"Nathaniel Hawthorne, 1853","edition":"Ticknor, Reed and Fields, 1853","url":"https://www.gutenberg.org/ebooks/976","licence":"Public domain","chapter":"The Minotaur"}},{"id":"the-minotaur-2","n":2,"title":"Fed on Tribute","text":"Every few years a black-sailed ship brought fourteen young Athenians to Crete. They were pushed into the maze, and the Minotaur hunted them through its turns. People across the sea grew up fearing the day their names would be chosen.","source":{"work":"The Heroes, or Greek Fairy Tales for My Children","author":"Charles Kingsley, 1856","edition":"Macmillan, 1856","url":"https://sacred-texts.com/cla/gft/index.htm","licence":"Public domain","chapter":"Theseus: How Theseus Slew the Minotaur"}},{"id":"the-minotaur-3","n":3,"title":"The Thread","text":"Prince Theseus sailed with the tribute to put an end to it. Minos's daughter Ariadne gave him a ball of thread to unwind behind him. In the deepest passage he met the beast and fought it with his bare hands and his sword until it fell. Then he followed the thread back into the light.","source":{"work":"The Heroes, or Greek Fairy Tales for My Children","author":"Charles Kingsley, 1856","edition":"Macmillan, 1856","url":"https://sacred-texts.com/cla/gft/index.htm","licence":"Public domain","chapter":"Theseus: How Theseus Slew the Minotaur"}}]},"the-princess":{"hero":"the-princess","personality":"Calm and commanding, not a damsel. She walked to the lake herself.","voice":"Again.","cards":[{"id":"the-princess-1","n":1,"title":"The King's Daughter","text":"She was the only daughter of the king of Silene. When the lot fell on her, her father offered the people his gold, his silver and half his kingdom to spare her. They refused him: their own children had gone to the lake, and so must his. He was given eight days. When they were over, he dressed her as a bride, kissed her, and let her go.","source":{"work":"The Golden Legend","author":"Jacobus de Voragine, c. 1260; English by William Caxton, 1483","edition":"Temple Classics, ed. F. S. Ellis, 1900","chapter":"Of S. George, Martyr","url":"https://sourcebooks.web.fordham.edu/basis/goldenlegend/GL-vol3-george.asp","licence":"Public domain"}},{"id":"the-princess-2","n":2,"title":"At the Water's Edge","text":"She waited alone by the lake. A young knight rode up and asked why she wept, and her first words to him were a warning: ride on, before you die with me. He stayed. When the dragon fell wounded he told her to tie her girdle round its neck, and she did. It was she, not the knight, who led the beast through the gates of Silene.","source":{"work":"The Golden Legend","author":"Jacobus de Voragine, c. 1260; English by William Caxton, 1483","edition":"Temple Classics, ed. F. S. Ellis, 1900","chapter":"Of S. George, Martyr","url":"https://sourcebooks.web.fordham.edu/basis/goldenlegend/GL-vol3-george.asp","licence":"Public domain"}},{"id":"the-princess-3","n":3,"title":"The Spring at the Altar","text":"After the dragon was slain, the king and twenty thousand of his people were baptised. Where her life had been bargained away, the king built a great church to Our Lady and St George. The legend says a spring rose from its altar, and its water healed every sick person who drank it.","source":{"work":"The Golden Legend","author":"Jacobus de Voragine, c. 1260; English by William Caxton, 1483","edition":"Temple Classics, ed. F. S. Ellis, 1900","chapter":"Of S. George, Martyr","url":"https://sourcebooks.web.fordham.edu/basis/goldenlegend/GL-vol3-george.asp","licence":"Public domain"}}]},"the-wolf":{"hero":"the-wolf","personality":"Patient, polite and always hungry. He speaks kindly to the weak because they are the easiest to eat.","voice":"All the better to see you with.","cards":[{"id":"the-wolf-1","n":1,"title":"The Old Sinner","text":"He was an old wolf of the wood, and the huntsman had been after him for years. He never fought what he could talk into his jaws. When a girl in a red cap came along the path one morning, he greeted her politely, walked beside her, and thought what a tender mouthful she would make.","source":{"work":"Grimm's Household Tales","author":"Jacob and Wilhelm Grimm, 1812–57; English by Margaret Hunt, 1884","edition":"George const E = (() => { // Crown & Chaos rules engine.
// Shared by the simulator (Node) and the playable page (browser). No dependencies.
//
// Board: each side has slots 1–6. Slot 1 is the Crown, slots 2–3 are heroes,
// slots 4–6 are the front rank. A round is: upkeep, plan, resolve (Speed order).
//
// Where the design doc leaves a detail open, the engine makes a choice and lists it
// in ASSUMPTIONS so it can be checked against playtesting.

const NIGHTFALL_ROUND = 8;
const ASSUMPTIONS = [
  "Items resolve before any card acts that round.",
  "Opposite slots face each other: 4 faces 4, 5 faces 5, 6 faces 6.",
  "Slot 1 counts as next to slots 2 and 3; front-rank slots are next to their row neighbours.",
  "Baba Yaga's Mortar ride is simplified: she kills the closest enemy card that isn't the Crown and stays in slot 1.",
  "Koschei's Whirlwind swaps the target with the other hero in slots 2–3 (never the Crown).",
  "A Thrall made by Dracula's Turn has 3 Health and the victim's Attack, and attacks the card opposite.",
  "Merlin's Enchanted sleep stops the hero for this round only, because no hero can be stopped two rounds running.",
  "Fights that pass round 20 are draws.",
  "Mirrored shield and Nobody are not Speed dependent: if chosen (and not stopped or cancelled), they are up before anyone acts that round.",
  "Mirrored shield reflects the attack's damage before Guard; the attacker's own Guard then applies.",
  "The wooden horse hides only from the enemy's view; the computer opponent plans blind against hidden cards in round 1.",
  "Men of Ithaca counts every Hellas hero fielded at the start, Odysseus included; Villagers are placed at upkeep.",
  "The Labyrinth stops Ranged attacks and random ranged effects (Fire Breath, Split the Arrow, Crossbows) reaching heroes in slots 2–3; Spells still reach them.",
  "Hurl the boulder slows the hero it hits in the next round, since Polyphemus (Speed 1) usually acts last.",
  "Royal decree: a second decree before the first runs out doesn't stack.",
  "Charge moves (Dig the pit, Deep breath): the hero is busy this round and next; the strike goes off at its Speed next round. Stopped, cancelled or killed first, the charge is lost.",
  "A charged strike deals 6, less the target's Guard (a Sigurd Crown's Gram's edge still ignores Guard); it ignores reach, since the target was chosen when the charge began.",
  "Andvari's curse: if Poison, nightfall or a dead card killed Fafnir, a random enemy hero gets the 3 Poison.",
  "Shape-shifter: if Loki has no other hero, he still survives on 1 Health and stays the Crown.",
  "Unbound: Loki returns at the second upkeep after his death (once per fight); if Van Helsing's Crown is out, he doesn't. He takes the Crown back only if he wore it earlier in the fight.",
  "Crown thief does nothing against a No Crown side (Robin Hood) or when the Crown already has the most Health.",
  "The slot-1 rules (shielded only by two heroes; can't melee past its own heroes) apply to whoever is in slot 1, including under Robin's No Crown.",
  "Only the standard Attack can be turned on your own heroes, and only from slot 1.",
  "Front-rank cards in front of the Crown don't stop it attacking; only heroes in slots 2–3 do.",
];

const NIGHTFALL = 8;
// Action points each round, and how many items a line-up can bring into a fight.
const BASE_AP = 4, TOOL_BELT = 2;
const MAX_ROUNDS = 20;
const FRONT_SPEED = 2;

// ---------- random numbers (seedable, so fights can be replayed) ----------
function makeRng(seed = Date.now()) {
  let s = (Math.imul(seed >>> 0, 2654435761) ^ 0x9e3779b9) >>> 0 || 1;
  const next = () => {
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
  for (let k = 0; k < 8; k++) next(); // warm up, so small seeds don't give lopsided first rolls
  return {
    next,
    int: (n) => Math.floor(next() * n),
    pick: (arr) => arr[Math.floor(next() * arr.length)],
    shuffle: (arr) => {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(next() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
  };
}

// ---------- setting up a fight ----------
let UID = 0;

function makeHero(def, side, slot) {
  const s = def.stats;
  return {
    uid: ++UID, id: def.id, kind: "hero", side, slot, name: def.name,
    realm: def.realm, tale: def.tale, aspect: def.aspect, ranged: !!s.ranged, tags: def.tags || [],
    baseHealth: s.health, maxHealth: s.health, health: s.health,
    baseAtk: s.attack, baseGuard: s.guard, baseSpeed: s.speed,
    atkPerm: 0, speedPerm: 0, guardIntoAtk: 0, atkMult: 1, speedFixed: null,
    actions: def.actions.map((a) => ({ ...a })), uses: {},
    guardLeft: 0, roundGuard: 0, poison: 0, dead: false, removed: false,
    noGuard: false, noHeal: false, stoppedRound: -9, stopNow: false,
    flags: {},
  };
}

function makeFront(def, side, slot) {
  return {
    uid: ++UID, id: def.id, kind: "front", side, slot, name: def.name,
    realm: def.realm || null, tale: def.tale || null, aspect: null, ranged: false,
    baseHealth: def.health, maxHealth: def.health, health: def.health,
    baseAtk: def.attack, baseGuard: def.guard, baseSpeed: def.speed ?? FRONT_SPEED,
    atkPerm: 0, speedPerm: 0, guardIntoAtk: 0, atkMult: 1, speedFixed: null,
    auto: def.auto, actions: [], uses: {},
    guardLeft: 0, roundGuard: 0, poison: 0, dead: false, removed: false,
    noGuard: false, noHeal: false, stoppedRound: -9, stopNow: false,
    flags: {},
  };
}

// lineup: { crown, heroes: [id, id], front: [id, id, id], items: [id...] }
function createGame(data, lineups, opts = {}) {
  const rng = opts.rng || makeRng(opts.seed);
  const st = {
    data, rng, round: 0, fate: rng.int(2), log: [], over: false, winner: null,
    sides: [0, 1].map((i) => ({ index: i, slots: {}, items: [], usedItems: [], grave: [], swallowed: [],
      noCrown: false, crownUid: null, ap: BASE_AP, flags: {} })),
    marks: {},
  };
  lineups.forEach((lu, i) => setupSide(st, i, lu));
  // Morgan le Fay as Crown starts with the Fate token (an enemy Renfield keeps it instead; two Morgans leave it to chance).
  const morgan = [0, 1].filter((i) => lineups[i]?.crown === "morgan-le-fay");
  const renfield = [0, 1].filter((i) => lineups[i]?.crown === "renfield");
  if (morgan.length === 1 && !renfield.includes(1 - morgan[0])) st.fate = morgan[0];
  // Quests: one side may hold the Fate token all fight, and night may never fall.
  if (opts.fate != null) { st.fixedFate = opts.fate; st.fate = opts.fate; }
  if (opts.noNight) st.noNight = true;
  if (opts.maxRounds) st.maxRounds = opts.maxRounds;
  // Start-of-fight effects
  for (const side of st.sides) {
    const crown = crownCard(st, side.index);
    if (crown?.id === "robin-hood") side.noCrown = true;
  }
  applyStartingHealth(st);
  // Men of Ithaca: one Villager per Hellas hero fielded, if Odysseus is fielded.
  for (const side of st.sides) {
    if (heroes(st, side.index).some((h) => h.id === "odysseus"))
      side.flags.ithacaLeft = heroes(st, side.index).filter((h) => h.realm === "Hellas").length;
  }
  for (const side of st.sides) {
    const crown = crownCard(st, side.index);
    if (crown && crownActive(st, side.index) && crown.id === "sheriff-of-nottingham") {
      const foe = st.sides[1 - side.index];
      if (foe.items.length) {
        const i = rng.int(foe.items.length);
        const [taken] = foe.items.splice(i, 1);
        side.items.push(taken);
        log(st, `${sideName(side.index)} taxed: the Sheriff of Nottingham takes ${itemName(st, taken)} from ${sideName(foe.index)}.`);
      }
    }
  }
  if (opts.noUpkeep !== true) upkeep(st);
  return st;
}

function setupSide(st, i, lu) {
  const side = st.sides[i];
  const H = (id) => st.data.heroes[id];
  const F = (id) => st.data.front[id];
  let crownId = lu.crown;
  const heroes = (lu.heroes || []).slice(0, 2);
  if ([crownId, ...heroes].includes("baba-yaga") && crownId !== "baba-yaga") {
    heroes[heroes.indexOf("baba-yaga")] = crownId;
    crownId = "baba-yaga";
  }
  // A warband (quests): the same front-rank card in every slot, and no Crown.
  if (lu.troops) {
    for (let k = 1; k <= (lu.troopCount || 6); k++) side.slots[k] = makeFront(F(lu.troops), i, k);
    side.troops = true; side.noCrown = true; side.crownUid = null;
    return;
  }
  if (crownId) side.slots[1] = makeHero(H(crownId), i, 1);
  heroes.forEach((id, k) => { if (id) side.slots[2 + k] = makeHero(H(id), i, 2 + k); });
  const front = (lu.front || []).slice(0, 3);
  const hasKoschei = [crownId, ...heroes].includes("koschei");
  front.forEach((id, k) => { if (id && !(hasKoschei && k === 2)) side.slots[4 + k] = makeFront(F(id), i, 4 + k); });
  if (hasKoschei) side.slots[6] = makeFront(F("the-needle"), i, 6);
  side.items = (lu.items || []).filter(Boolean).slice(0, TOOL_BELT);
  side.crownUid = side.slots[1]?.uid ?? null;
  // A blind fight (quests): this side's cards are hidden from the other side, and can't be targeted, until each
  // one first acts on a card of the other side.
  if (lu.blind) side.blind = true;
  if (lu.ap != null) side.baseAp = lu.ap;
  if (lu.revealRound != null) side.revealRound = lu.revealRound;
  side.startUids = Object.values(side.slots).map((c) => c.uid);
}

// ---------- small helpers ----------
const sideName = (i) => (i === 0 ? "Blue" : "Red");
const itemName = (st, id) => st.data.items[id]?.name || id;
// st.onLog, if set, is called after every log line, so a page can record the fight step by step.
function log(st, msg) { st.log.push(`R${st.round}: ${msg}`); if (st.onLog) st.onLog(msg); }
// Events: a structured record of what happened, in order, so a screen can animate it.
// Every event has t (its type) and r (the round). Card references are uids.
// Each event carries n, the number of log lines written before it. An event explains the log line just
// before it, except phase, skip and a front-rank card's act, which open what follows.
function ev(st, e) {
  (st.events ||= []).push({ r: st.round, n: st.log.length, ...e });
  // A hidden card shows itself the first time it acts on a card of the other side.
  if (e.t === "reveal" || !(st.sides[0].blind || st.sides[1].blind)) return;
  const srcUid = e.src ?? (e.t === "act" ? e.uid : null);
  const src = srcUid != null ? findCard(st, srcUid) : null;
  if (!src || !st.sides[src.side].blind || src.flags.seen) return;
  const tg = [e.tgt, ...(e.tgts || [])].filter((u) => u != null).map((u) => findCard(st, u)).filter(Boolean);
  if (tg.some((t) => t.side !== src.side)) { src.flags.seen = true; log(st, `${src.name} is revealed.`); ev(st, { t: "reveal", uid: src.uid }); }
}
const uidOf = (c) => (c && c.uid != null ? c.uid : null);
const styleOf = (opts) => opts.spell ? "spell" : opts.ranged ? "ranged" : opts.attack ? "melee" : "effect";
// Gains in Guard and Poison, and some changes to Health, are made in many places, so they are found
// by comparing before and after. A health change no event explains gets an "hp" event; a card that
// appears from nowhere (a summon) gets an "appear" event.
function snapStats(st) {
  const m = new Map(allCards(st).map((c) => [c.uid, { g: c.guardLeft, p: c.poison, h: c.health }]));
  m.idx = (st.events || []).length;
  return m;
}
function diffStats(st, before, src) {
  const since = (st.events || []).slice(before.idx);
  for (const c of allCards(st)) {
    const b = before.get(c.uid);
    if (!b) {
      if (!since.some((e) => e.t === "revive" && e.uid === c.uid)) ev(st, { t: "appear", uid: c.uid, side: c.side, slot: c.slot, name: c.name, hp: c.health });
      continue;
    }
    if (c.guardLeft > b.g) ev(st, { t: "guardUp", src: uidOf(src), item: src?.item, tgt: c.uid, amt: c.guardLeft - b.g });
    if (c.poison > b.p) ev(st, { t: "poison", src: uidOf(src), item: src?.item, tgt: c.uid, amt: c.poison - b.p });
    let shown = b.h;
    for (const e of since) if ((e.tgt === c.uid || e.uid === c.uid) && "hp" in e) shown = e.hp;
    if (c.health !== shown) ev(st, { t: "hp", src: uidOf(src), item: src?.item, tgt: c.uid, delta: c.health - shown, hp: c.health });
  }
}


function cards(st, i) { return Object.values(st.sides[i].slots).filter((c) => c && !c.dead && !c.removed); }
function heroes(st, i) { return cards(st, i).filter((c) => c.kind === "hero"); }
function allCards(st) { return [...cards(st, 0), ...cards(st, 1)]; }
function at(st, i, slot) { const c = st.sides[i].slots[slot]; return c && !c.dead && !c.removed ? c : null; }
function crownCard(st, i) {
  const side = st.sides[i];
  if (side.noCrown) return null;
  return Object.values(side.slots).find((c) => c && c.uid === side.crownUid && !c.dead) || null;
}
function crownActive(st, i) { return !st.sides[i].noCrown; }
function crownIs(st, i, id) { const c = crownCard(st, i); return !!c && c.id === id && crownActive(st, i); }
function anyCrown(st, id) { return crownIs(st, 0, id) || crownIs(st, 1, id); }
const isNight = (st) => !st.noNight && st.round >= NIGHTFALL;
const injured = (c) => c.health < c.maxHealth;

function neighbours(st, c) {
  const i = c.side, s = c.slot;
  const map = { 1: [2, 3], 2: [1, 3], 3: [1, 2], 4: [5], 5: [4, 6], 6: [5] };
  return (map[s] || []).map((x) => at(st, i, x)).filter(Boolean);
}

// For bonds: realm/tale checks bend under King Arthur's crown.
// The Round Table works from round 3 until nightfall.
function arthur(st, i) { return crownIs(st, i, "king-arthur") && st.round >= 3 && !isNight(st); }
function isRealm(st, c, realm) { return c.realm === realm || (arthur(st, c.side) && c.kind === "hero"); }
function isTale(st, c, tale) { return c.tale === tale || (arthur(st, c.side) && c.kind === "hero"); }
function otherHeroes(st, c, pred = () => true) { return heroes(st, c.side).filter((h) => h.uid !== c.uid && pred(h)); }
function countRealm(st, c, realm) { return otherHeroes(st, c, (h) => isRealm(st, h, realm)).length; }

// Bond strength for a side: 1 normally, 0 if the enemy crown is Morgan and she holds the Fate token,
// -1 if it is the Little Mermaid.
function bondFactor(st, i) {
  const foe = 1 - i;
  if (crownIs(st, foe, "morgan-le-fay") && st.fate === foe) return 0;
  if (crownIs(st, foe, "the-little-mermaid")) return -1;
  return 1;
}
function hasBond(st, c) { return bondFactor(st, c.side) !== 0; }

// ---------- derived stats ----------
function attackOf(st, c) {
  let a = c.baseAtk + c.atkPerm + c.guardIntoAtk;
  if (c.flags.harmless) return 0;
  const f = bondFactor(st, c.side);
  if (c.kind === "hero" && f) {
    if (["renfield", "van-helsing"].includes(c.id)) a += f * countRealm(st, c, "Gothic");
    if (c.id === "rumpelstiltskin") a += f * countRealm(st, c, "Märchen");
    if (c.id === "the-huntsman") a += f * Math.min(2, countRealm(st, c, "Märchen"));
    if (c.id === "the-tin-soldier") a += f * countRealm(st, c, "Eventyr");
    // Morgan's Bond also costs your King Arthur 1 Attack.
    if (c.id === "king-arthur" && heroes(st, c.side).some((h) => h.id === "morgan-le-fay")) a -= f;
    if (c.id === "lancelot") {
      const mine = heroes(st, c.side);
      if (mine.some((h) => h.aspect === "Sovereign") && !mine.some((h) => h.aspect === "Healer")) a += f * 2;
    }
  }
  if (c.id === "the-bride" && crownIs(st, c.side, "the-bride") && gothicBeast(st, c)) a += 1;
  if (c.kind === "hero" && f) {
    // Gorgon's bane: +1 Attack for each Beast on the board, either side.
    if (c.id === "perseus") a += f * allCards(st).filter((x) => x.kind === "hero" && x.aspect === "Beast").length;
    // Son of Poseidon: +1 with another Hellas hero alive; -1 instead while an enemy Trickster lives.
    if (c.id === "polyphemus") {
      if (heroes(st, 1 - c.side).some((h) => h.aspect === "Trickster")) a -= f;
      else if (countRealm(st, c, "Hellas") > 0) a += f;
    }
  }
  a = a * c.atkMult;
  // Transfigure: Attack becomes 1. Aiaia: front-rank swine have 0 Attack.
  if (c.flags.transfigUntil >= st.round) a = Math.min(a, 1);
  if (c.flags.swineRound === st.round) a = 0;
  return Math.max(0, a);
}
function gothicBeast(st, c) { return otherHeroes(st, c, (h) => h.aspect === "Beast" && isRealm(st, h, "Gothic")).length > 0; }

function guardOf(st, c) {
  if (c.noGuard) return 0;
  let g = c.baseGuard;
  if (c.id === "blodeuwedd" && c.flags.night) g = c.baseGuard * 2;
  const i = c.side;
  // bonds from cards on this side
  for (const src of heroes(st, i)) {
    const f = bondFactor(st, i);
    if (!f) break;
    if (src.id === "king-arthur" && c.kind === "hero" && isRealm(st, c, "Albion")) g += f;
    if (src.id === "sheriff-of-nottingham" && isRealm(st, c, "Albion")) g += f;
    if (src.id === "blodeuwedd" && c.kind === "hero" && isRealm(st, c, "Cymru")) g += f;
  }
  const f = bondFactor(st, i);
  if (c.kind === "hero" && f) {
    if (c.id === "bran-the-blessed") g += f * countRealm(st, c, "Cymru");
    if (c.id === "friar-tuck") g += f * countRealm(st, c, "Albion");
    if (c.id === "the-snow-queen") g += f * countRealm(st, c, "Eventyr");
  }
  if (crownIs(st, i, "little-john") && c.kind === "hero" && c.realm === "Albion") g += 1;
  if (crownIs(st, i, "merlin") && c.kind === "front") g += 1;
  if (c.id === "the-bride" && crownIs(st, i, "the-bride") && gothicBeast(st, c)) g += 1;
  // Gwydion's Bond: your front rank has +1 Guard for each of your Cymru heroes that has died.
  if (c.kind === "front" && f && heroes(st, i).some((h) => h.id === "gwydion"))
    g += f * st.sides[i].grave.filter((d) => d.kind === "hero" && isRealm(st, d, "Cymru")).length;
  if (f) {
    // Gorgon sisters: Medusa has +1 Guard for each of your Hellas heroes that has died.
    if (c.id === "medusa") g += f * st.sides[i].grave.filter((d) => d.kind === "hero" && isRealm(st, d, "Hellas")).length;
    // Guests of Aiaia: Circe gives your other Hellas heroes +1 Guard.
    if (c.kind === "hero" && c.id !== "circe" && isRealm(st, c, "Hellas") && heroes(st, i).some((h) => h.id === "circe")) g += f;
  }
  if (c.kind === "front" && crownIs(st, i, "polyphemus")) g += 1;
  // Winged sandals: your heroes have +1 Guard in rounds you hold the Fate token.
  if (c.kind === "hero" && st.fate === i && crownIs(st, i, "perseus")) g += 1;
  // Growl: -1 Guard to every enemy card in the round after the Minotaur growls.
  if (st.sides[i].flags.growlRound === st.round) g -= 1;
  // Phalanx: a Hoplite has +1 Guard for each Hoplite next to it.
  if (c.id === "hoplite") g += neighbours(st, c).filter((n) => n.id === "hoplite").length;
  // Dread: the Creature as Crown takes 1 Guard from every enemy hero.
  if (crownIs(st, 1 - i, "the-creature") && c.kind === "hero") g -= 1;
  return Math.max(0, g);
}

function speedOf(st, c) {
  if (c.flags.speedOneRound === st.round) return 1;

      if (src.id === "baba-yaga" && src.uid !== c.uid && c.kind === "hero") s -= f;
    }
    if (c.id === "rhiannon") s += f * countRealm(st, c, "Cymru");

    if (c.id === "king-arthur" && heroes(st, i).some((h) => h.id === "morgan-le-fay")) s -= f;

  // Winged sandals: your heroes have +1 Speed in rounds you don't hold the Fate token.
  if (c.kind === "hero" && st.fate !== i && crownIs(st, i, "perseus")) s += 1;
  // Growl: -1 Speed to every enemy card in the round after the Minotaur growls.
  if (st.sides[i].flags.growlRound === st.round) s -= 1;
  // Hurl the boulder: -1 Speed in the round after the hit.
  if (c.flags.slowRound === st.round) s -= 1;

  if (c.kind === "hero" && (st.sides[i].flags.shortcutUntil || 0) >= st.round) s += 1;
  // Hard frost: in rounds when the Snow Queen's side holds the Fate token, every enemy card has -2 Speed.
  if (crownIs(st, 1 - i, "the-snow-queen") && st.fate === 1 - i) s -= 2;

}

// Health bonuses from bonds are set once, at the start of the fight.
function applyStartingHealth(st) {
  for (const i of [0, 1]) {
    const f = bondFactor(st, i);
    for (const c of cards(st, i)) {
      let bonus = 0;
      if (f && c.kind === "hero") {
        for (const src of heroes(st, i)) {
          if (src.id === "lancelot" && isRealm(st, c, "Albion")) bonus += f;
          if (src.id === "baba-yaga" && src.uid !== c.uid) bonus -= 2 * f;
        }
        if (c.id === "koschei") bonus += f * countRealm(st, c, "Rus'");
        if (c.id === "gretel") bonus += f * countRealm(st, c, "Märchen");
      }
      if (c.kind === "hero" && crownIs(st, i, "guinevere")) bonus += 1;
      if (c.kind === "front" && crownIs(st, i, "polyphemus")) bonus += 2;
      if (bonus) {
        c.maxHealth = Math.max(1, c.maxHealth + bonus);
        c.health = Math.max(1, Math.min(c.maxHealth, c.health + bonus));

}

// ---------- healing ----------
function heal(st, src, target, amount, opts = {}) {
  if (!target || target.dead || target.removed) return 0;
  if (isNight(st) && !opts.ignoreNight) return 0;
  if (target.noHeal) return 0;
  if (target.flags.noHealRound === st.round) return 0;
  let amt = amount;
  if (src && !opts.flat) {
    const i = src.side, f = bondFactor(st, i);
    if (f) {
      const guin = heroes(st, i).find((h) => h.id === "guinevere");
      if (guin) amt += f * heroes(st, i).filter((h) => isRealm(st, h, "Albion")).length;
      if (src.id === "the-princess") amt += f * countRealm(st, src, "Albion");
      if (src.id === "vasilisa-the-wise" && countRealm(st, src, "Rus'") > 0) amt += f;
    }
  }
  if (crownIs(st, 0, "van-helsing")) amt -= 1;
  if (crownIs(st, 1, "van-helsing")) amt -= 1;
  amt = Math.max(0, amt);
  const cap = target.id === "baba-yaga" ? Math.max(target.maxHealth, target.health) : target.maxHealth;
  const before = target.health;
  target.health = Math.min(cap, target.health + amt);
  const gain = target.health - before;
  if (gain > 0) log(st, `${src?.name || "Healing"} heals ${sideName(target.side)} ${target.name} for ${gain}.`);
  if (gain > 0) ev(st, { t: "heal", src: uidOf(src), item: src?.item, tgt: target.uid, amt: gain, hp: target.health });
  return gain;
}

// ---------- targeting ----------
// Closest enemy row: front rank, then heroes in 2–3, then the Crown.
// Enemy rows, closest first. The front rank shields everything. Behind it, the Crown (slot 1) is
// shielded from melee only while both hero slots (2 and 3) are filled; once one is empty the Crown
// can be struck alongside the remaining hero.
function enemyRows(st, attackerSide) {
  const foe = 1 - attackerSide;
  const front = [4, 5, 6].map((s) => at(st, foe, s)).filter(Boolean);
  const mid = [2, 3].map((s) => at(st, foe, s)).filter(Boolean);
  const back = at(st, foe, 1);
  const rows = [front];
  if (mid.length >= 2) { rows.push(mid); if (back) rows.push([back]); }
  else rows.push(back ? [...mid, back] : mid);
  return rows.filter((r) => r.length);
}
function closestRow(st, attackerSide) { return enemyRows(st, attackerSide)[0] || []; }
// A card in slot 1 can't melee the enemy while one of its own heroes stands in front of it.
function crownBlocked(st, c) {
  return c.kind === "hero" && c.slot === 1 && [2, 3].some((s) => at(st, c.side, s)?.kind === "hero");
}
function meleeTargets(st, attacker) {
  if (crownBlocked(st, attacker)) return [];
  const rows = enemyRows(st, attacker.side);
  if (!rows.length) return [];
  let out = rows[0];
  if (crownIs(st, attacker.side, "bran-the-blessed") && rows[1]) out = out.concat(rows[1]);
  return out;
}
function rangedTargets(st, attacker, opts = {}) {
  const foe = 1 - attacker.side;
  return cards(st, foe).filter((c) => !(c.id === "the-wolf" && hasBond(st, c) &&
    otherHeroes(st, c, (h) => isRealm(st, h, "Märchen")).length > 0) && (opts.spell || !inLabyrinth(st, c)));
}
// The Labyrinth: enemy Ranged attacks can't reach the Minotaur's side's heroes in slots 2 and 3.
function inLabyrinth(st, c) { return c.kind === "hero" && (c.slot === 2 || c.slot === 3) && crownIs(st, c.side, "the-minotaur"); }
// The wooden horse: in round 1, every card under an Odysseus Crown except Odysseus is hidden from the enemy.
function isHidden(st, c) { return isBlind(st, c) || (!!c && st.round === 1 && c.id !== "odysseus" && crownIs(st, c.side, "odysseus")); }
// A card on a blind side that hasn't yet shown itself: the other side can't see it or target it.
function isBlind(st, c) { return !!c && !!st.sides[c.side]?.blind && !c.flags.seen; }
const visibleTo = (st, side, list) => list.filter((c) => !c || c.side === side || !isBlind(st, c));
// Royal decree makes every action cost 1 more action point.
function apCost(st, c, act) { return act.ap + (st.sides[c.side].flags.decreeRound === st.round ? 1 : 0); }
function reachable(st, attacker, ranged) { return ranged ? rangedTargets(st, attacker) : meleeTargets(st, attacker); }

// ---------- damage ----------
// opts: { attack: bool, ranged: bool, spell: bool, ignoreGuard: bool, noRedirect: bool }
function damage(st, src, target, amount, opts = {}) {
  if (!target || target.dead || target.removed) return 0;
  let t = target;
  const atk = !!opts.attack;
  const tSide = t.side;
  // Redirects (attacks only)
  if (atk && !opts.noRedirect) t = redirect(st, src, t, opts);
  if (!t) return 0;
  if (t !== target) ev(st, { t: "redirect", src: uidOf(src), from: target.uid, to: t.uid });
  const style = styleOf(opts);
  // Nobody: the first attack aimed at Odysseus this round misses, and the attacker takes 1.
  if (atk && t.flags.nobodyRound === st.round) {
    t.flags.nobodyRound = -1;
    log(st, `${src ? src.name + "'s" : "The"} attack on Odysseus misses: "Nobody" is there.`);
    ev(st, { t: "miss", src: uidOf(src), tgt: t.uid, style });
    if (src && src.uid != null && !src.dead) applyHealthLoss(st, t, src, 1, {});
    return 0;
  }
  // Mirrored shield: the first attack aimed at Perseus this round goes back to the attacker.
  if (atk && t.flags.reflectRound === st.round && src && src.uid != null && !src.dead) {
    t.flags.reflectRound = -1;
    log(st, `Perseus's mirrored shield turns ${src.name}'s attack back on it.`);
    ev(st, { t: "redirect", src: uidOf(src), from: t.uid, to: src.uid });
    return damage(st, t, src, amount, {});
  }
  // Stony gaze: a melee attack on a Medusa Crown costs the attacking hero 1 Speed for the fight.
  if (atk && !opts.ranged && !opts.spell && t.id === "medusa" && crownIs(st, t.side, "medusa") && src?.kind === "hero" && src.side !== t.side && !src.flags.gazed) {
    src.flags.gazed = true; src.speedPerm -= 1; log(st, `${src.name} meets Medusa's gaze and slows (-1 Speed).`);
    ev(st, { t: "debuff", kind: "gaze", src: t.uid, tgt: src.uid, text: "−1 Speed" });
  }
  // Misses and immunities
  if (atk && t.id === "rhiannon" && crownIs(st, t.side, "rhiannon") && src && speedOf(st, src) < speedOf(st, t) &&
      t.flags.missRound !== st.round) {
    t.flags.missRound = st.round;
    log(st, `${src.name}'s attack on Rhiannon misses.`);
    ev(st, { t: "miss", src: uidOf(src), tgt: t.uid, style });

  }
  if (t.flags.shieldRound === st.round) { log(st, `${t.name} is shielded and takes no damage.`); ev(st, { t: "hit", src: uidOf(src), item: src?.item, tgt: t.uid, style, dmg: 0, shielded: true, hp: t.health }); return 0; }
  let amt = amount, saved = 0, guarded = 0;
  if (atk && src) {
    const s = src.side, f = bondFactor(st, s);
    if (crownIs(st, s, "gretel") && ["Witch", "Beast", "Slayer"].includes(t.aspect)) amt += 2;
    if (crownIs(st, s, "the-wolf") && injured(t)) amt += 1;
    if (crownIs(st, s, "the-huntsman") && st.marks[`hunt${s}`] === t.uid) amt += 1;
    if (st.marks[`wanted${s}`] === t.uid) amt += 1;
    if (f && heroes(st, s).some((h) => h.id === "the-dragon") && t.aspect === "Slayer") amt += f;
    if (src.flags.giantSword === st.round) { amt += 3; opts = { ...opts, ignoreGuard: true }; src.flags.giantSword = -1; }
    if (opts.ranged && crownIs(st, t.side, "grendels-mother") && t.kind === "hero") amt -= 2;
  }
  if (opts.spell && src) {
    const f = bondFactor(st, src.side);
    if (f) {
      if (src.id === "merlin" && otherHeroes(st, src, (h) => isRealm(st, h, "Albion")).length) amt += f;
      // Morgan's Bond: +1 to her Spells while you field King Arthur.
      if (src.id === "morgan-le-fay" && heroes(st, src.side).some((h) => h.id === "king-arthur")) amt += f;
    }
  }
  amt = Math.max(0, amt);
  if (atk && crownIs(st, t.side, "maid-marian") && st.fate === t.side) amt = Math.ceil(amt / 2);
  if (atk && t.kind === "hero" && crownIs(st, t.side, "st-george") && t.flags.georgeRound !== st.round) {
    t.flags.georgeRound = st.round;
    const blocked = Math.min(1, amt);
    amt -= blocked; saved = blocked;
    if (blocked) log(st, `St George blocks ${blocked} damage to ${t.name}.`);

  const ignoreGuard = opts.ignoreGuard || (atk && src && crownIs(st, src.side, "beowulf"));
  if (!ignoreGuard && t.guardLeft > 0 && !opts.trueDamage) {
    const g = Math.min(t.guardLeft, amt);
    t.guardLeft -= g; amt -= g; guarded = g;
    if (amt <= 0 && g > 0) log(st, `${sideName(t.side)} ${t.name}'s Guard blocks ${src ? src.name + "'s hit" : "the damage"}.`);
  }
  if (amt <= 0) { ev(st, { t: "hit", src: uidOf(src), item: src?.item, tgt: t.uid, style, dmg: 0, guarded, saved, hp: t.health }); return 0; }
  return applyHealthLoss(st, src, t, amt, { ...opts, _style: style, _guarded: guarded, _saved: saved });
}

function redirect(st, src, t, opts) {
  const side = t.side;
  // The Renfield guard: takes the next hit aimed at your crown.
  const crown = crownCard(st, side);
  if (crown && t.uid === crown.uid) {
    const ren = heroes(st, side).find((h) => h.flags.guardCrownRound === st.round && h.uid !== t.uid);
    if (ren) { ren.flags.guardCrownRound = -1; log(st, `${ren.name} takes the hit meant for the crown.`); return ren; }
  }
  // Tin Soldier: takes the first attack aimed at any other of your heroes.
  if (t.kind === "hero") {
    const tin = heroes(st, side).find((n) => n.uid !== t.uid && n.id === "the-tin-soldier" && n.flags.steadfastRound >= st.round - 1 && n.flags.steadfastUsed !== st.round);
    if (tin) { tin.flags.steadfastUsed = st.round; log(st, `The Tin Soldier steps in front of ${t.name}.`); return tin; }
  }
  // Little John's bond: first attack each round on another Albion hero.
  if (t.kind === "hero" && isRealm(st, t, "Albion") && t.id !== "little-john") {
    const lj = heroes(st, side).find((h) => h.id === "little-john");
    if (lj && hasBond(st, lj) && bondFactor(st, side) > 0 && st.sides[side].flags.johnRound !== st.round) {
      st.sides[side].flags.johnRound = st.round;
      log(st, `Little John takes the blow meant for ${t.name}.`);
      return lj;
    }
  }
  // Leshy: the first attack each round aimed at another card of yours.
  const leshy = cards(st, side).find((c) => c.id === "leshy" && c.uid !== t.uid);
  if (leshy && st.sides[side].flags.leshyRound !== st.round) {
    st.sides[side].flags.leshyRound = st.round;
    log(st, `The Leshy takes the attack meant for ${t.name}.`);
    return leshy;
  }
  return t;
}

const noCheating = (st) => anyCrown(st, "van-helsing");

function applyHealthLoss(st, src, t, amt, opts = {}) {
  const side = t.side;
  // Koschei's hidden death
  if (t.id === "koschei" && !opts.nightfall) {
    const needle = cards(st, side).find((c) => c.id === "the-needle");
    if (needle && t.health - amt < 1) amt = t.health - 1;
  }
  if (t.health - amt <= 0 && t.kind === "hero") {
    // The Dragon's crown: he swaps in and takes the hit (once).
    const dragon = crownCard(st, side);
    if (dragon && dragon.id === "the-dragon" && dragon.uid !== t.uid && !st.sides[side].flags.dragonSwapped && !opts.nightfall) {
      st.sides[side].flags.dragonSwapped = true;
      const s1 = dragon.slot, s2 = t.slot;
      st.sides[side].slots[s1] = t; st.sides[side].slots[s2] = dragon;
      t.slot = s1; dragon.slot = s2;
      st.sides[side].crownUid = t.uid;
      log(st, `The Dragon swaps in to save ${t.name}, who becomes the Crown.`);
      ev(st, { t: "swap", a: t.uid, b: dragon.uid, side });
      return applyHealthLoss(st, src, dragon, amt, opts);
    }
    // Shape-shifter: a Loki Crown survives his first death on 1 Health and hands the Crown to his highest-Health hero.
    if (t.id === "loki" && crownIs(st, side, "loki")) t.flags.woreCrown = true;
    if (t.id === "loki" && crownIs(st, side, "loki") && !st.sides[side].flags.lokiShifted && !opts.nightfall && !noCheating(st)) {
      st.sides[side].flags.lokiShifted = true;
      t.health = 1;
      log(st, `Loki shifts his shape and slips away on 1 Health.`);
      ev(st, { t: "hit", src: uidOf(src), item: src?.item, tgt: t.uid, style: opts._style || "effect", dmg: amt, hp: 1, survived: true });
      const heir = heroes(st, side).filter((h) => h.uid !== t.uid).sort((p, q) => q.health - p.health)[0];
      if (heir) { swapCrown(st, side, heir); log(st, `${heir.name} is left holding the Crown.`); }
      return amt;
    }
    if (!noCheating(st)) {
      if (crownIs(st, side, "vasilisa-the-wise") && !st.sides[side].flags.vasilisaUsed) {
        st.sides[side].flags.vasilisaUsed = true;
        t.health = 2; log(st, `${t.name} survives on 2 Health (Vasilisa).`);
        ev(st, { t: "hit", src: uidOf(src), item: src?.item, tgt: t.uid, style: opts._style || "effect", dmg: amt, hp: 2, survived: true });
        const back = st.sides[side].grave.find((c) => c.kind === "front" && !at(st, side, c.slot));

        t.health = 3; log(st, `Red Riding Hood survives on 3 Health.`);
        ev(st, { t: "hit", src: uidOf(src), item: src?.item, tgt: t.uid, style: opts._style || "effect", dmg: amt, hp: 3, survived: true }); return amt;

    }
  }
  t.health -= amt;
  log(st, `${src ? src.name : "Nightfall"} deals ${amt} to ${sideName(side)} ${t.name}${t.health <= 0 ? " — it dies" : ""}.`);
  ev(st, { t: "hit", src: uidOf(src), item: src?.item, tgt: t.uid, dmg: amt, hp: Math.max(0, t.health),
    style: opts._style || (opts.nightfall ? "night" : src?.name === "Poison" ? "poison" : "effect"),
    guarded: opts._guarded || 0, saved: opts._saved || 0 });
  if (src && opts.attack && src.kind === "hero" && crownIs(st, src.side, "dracula")) heal(st, null, src, st.fate === src.side ? 2 : 1, { flat: true });
  if (t.health <= 0) kill(st, t, src);
  return amt;
}

// The Crown moves: the old Crown and the new one swap slots, and the new one becomes the Crown.
function swapCrown(st, side, heir) {
  const s = st.sides[side], old = crownCard(st, side);

  const s1 = old.slot, s2 = heir.slot;
  s.slots[s1] = heir; s.slots[s2] = old; heir.slot = s1; old.slot = s2;
  s.crownUid = heir.uid;
  ev(st, { t: "swap", a: heir.uid, b: old.uid, side });
  return true;
}

function kill(st, t, src) {
  if (t.dead) return;
  t.dead = true; t.health = 0;
  ev(st, { t: "death", uid: t.uid, side: t.side, slot: t.slot });
  const side = st.sides[t.side];
  side.grave.push(t);
  onDeath(st, t, src);
}

function onDeath(st, t, src) {
  const i = t.side;
  if (t.kind === "front") {
    const s = 1 - i;
    // Athenian tribute: each enemy front-rank death heals your heroes 1.
    const minos = crownIs(st, s, "king-minos") ? crownCard(st, s) : null;
    if (minos) for (const h of heroes(st, s)) heal(st, minos, h, 1);
    // Lord of the Labyrinth: each enemy front-rank death heals your Beast heroes 3.
    const lord = heroes(st, s).find((h) => h.id === "king-minos");
    if (lord && bondFactor(st, s) > 0) for (const h of heroes(st, s)) if (h.aspect === "Beast") heal(st, lord, h, 3);
    return;
  }
  if (t.kind !== "hero") return;
  // Andvari's curse: Fafnir's killer gains 3 Poison.
  if (t.id === "fafnir" && bondFactor(st, i) > 0) {
    let k = src && src.uid != null && src.side === 1 - i && !src.dead ? src : null;
    if (!k) { const hs = heroes(st, 1 - i); k = hs.length ? st.rng.pick(hs) : null; }
    if (k) {
      log(st, `Andvari's curse falls on ${k.name}.`);
      ev(st, { t: "debuff", kind: "curse", src: t.uid, tgt: k.uid, text: "Andvari's curse" });
      k.poison += 3;
    }
  }
  // Unbound: Loki comes back two upkeeps later (not as a fallen Crown: that fight is over).
  if (t.id === "loki" && bondFactor(st, i) > 0 && !t.flags.unboundUsed && st.sides[i].crownUid !== t.uid) {
    t.flags.unboundUsed = true; t.flags.returnRound = st.round + 2;
    log(st, `Loki is bound, but not for long.`);
  }
  // Fed on tribute: when the Minotaur kills an enemy hero, your other Hellas heroes heal 1.
  if (src && src.id === "the-minotaur" && src.side !== i && !src.dead && bondFactor(st, src.side) > 0)
    for (const h of heroes(st, src.side)) if (h.uid !== src.uid && isRealm(st, h, "Hellas")) heal(st, src, h, 1);
  // Released from the Wolf
  if (t.id === "the-wolf") {
    for (const s of st.sides) {
      for (const v of s.swallowed.filter((x) => x.by === t.uid)) {
        if (noCheating(st)) continue;
        const slot = v.card.slot;
        if (!at(st, v.card.side, slot)) {
          v.card.removed = false; v.card.health = 1; st.sides[v.card.side].slots[slot] = v.card;
          log(st, `${v.card.name} comes back out of the Wolf on 1 Health.`);
        }
      }
      s.swallowed = s.swallowed.filter((x) => x.by !== t.uid);
    }
  }
  // Bonds that react to deaths, on both sides
  for (const side of [0, 1]) {
    const f = bondFactor(st, side);
    if (!f) continue;
    for (const h of heroes(st, side)) {
      const mine = side === i;
      if (h.id === "beowulf" && t.aspect === "Beast") h.atkPerm += f;
      // The dragon's heart: any Beast's death gives Sigurd +1 Attack and +1 Speed.
      if (h.id === "sigurd" && t.aspect === "Beast") { h.atkPerm += f; h.speedPerm += f; log(st, `Sigurd tastes the dragon's heart: +1 Attack, +1 Speed.`); }
      if (!mine) continue;
      if (h.id === "maid-marian" && isRealm(st, t, "Albion") && !h.flags.marianDone) {
        h.flags.marianDone = true; h.atkPerm += 2 * f; h.speedPerm += f;
      }
      if (h.id === "st-george") {
        if (t.aspect === "Beast" && !h.flags.georgeBeast) { h.flags.georgeBeast = true; h.guardIntoAtk += f * guardOf(st, h); if (f > 0) { h.noGuard = true; h.guardLeft = 0; log(st, `St George gives up his Guard: his Attack is now ${attackOf(st, h)}.`); } }
        if (t.aspect === "Healer" && !h.flags.georgeHealer) { h.flags.georgeHealer = true; h.atkMult = f > 0 ? 2 : 1; }
      }
      if (h.id === "grendels-mother" && t.id === "grendel") { h.atkPerm += 3 * f; h.speedFixed = 3; }
      if (h.id === "the-creature" && isRealm(st, t, "Gothic")) {
        h.flags.gothicDeaths = (h.flags.gothicDeaths || 0) + 1;
        if (h.flags.gothicDeaths === 1) h.atkPerm += 2 * f;
        if (h.flags.gothicDeaths === 2) { h.atkPerm += 2 * f; h.speedPerm += f; }
      }
      if (h.id === "dracula" && isRealm(st, t, "Gothic")) heal(st, h, h, 4 * f > 0 ? 4 : 0, { flat: true });
    }
    if (side === i && t.id === "the-little-mermaid") {
      for (const h of heroes(st, side)) if (isRealm(st, h, "Eventyr")) heal(st, t, h, 3);
    }
  }
}

// ---------- stopping a card from acting ----------
function stop(st, target, why) {
  if (!target || target.dead) return false;
  if (crownIs(st, target.side, "the-tin-soldier") && target.kind === "hero") { log(st, `${target.name} can't be stopped (Tin Soldier).`); return false; }
  if (target.stoppedRound === st.round - 1) { log(st, `${target.name} was stopped last round, so it can't be stopped again.`); return false; }
  target.stopNow = true; target.stoppedRound = st.round;
  log(st, `${target.name} is stopped (${why}).`);
  ev(st, { t: "stop", tgt: target.uid, why });
  return true;
}

// Fire Breath: two different enemy cards, chosen at random when it resolves (one if only one is left).
function fireTargets(st, a) {
  const pool = cards(st, 1 - a.side).filter((c) => !inLabyrinth(st, c)), out = [];
  while (out.length < 2 && pool.length) out.push(pool.splice(st.rng.int(pool.length), 1)[0]);
  return out;
}

// A card stopped last round can't be stopped again this round, so it isn't offered as a target.
function canBeStopped(st, c) { return c.stoppedRound !== st.round - 1; }

// ---------- upkeep ----------
function upkeep(st) {
  ev(st, { t: "phase", name: "upkeep" });
  const upkeepBefore = snapStats(st);
  st.round += 1;
  st.marks = {};
  // A blind side can't hide for ever: from its reveal round, every card still hidden shows itself.
  for (const side of st.sides) if (side.blind && side.revealRound != null && st.round >= side.revealRound)
    for (const c of cards(st, side.index)) if (!c.flags.seen) { c.flags.seen = true; log(st, `${c.name} is revealed.`); ev(st, { t: "reveal", uid: c.uid }); }
  // Fate token
  const ren0 = crownIs(st, 0, "renfield"), ren1 = crownIs(st, 1, "renfield");
  if (st.fixedFate != null) st.fate = st.fixedFate;
  else if (ren0 && !ren1) st.fate = 0; else if (ren1 && !ren0) st.fate = 1; else if (st.round > 1) st.fate = 1 - st.fate;
  for (const i of [0, 1]) {
    // Galvanism: +1 action point for each of Victor's other living heroes, counted at upkeep.
    st.sides[i].ap = (st.sides[i].baseAp ?? BASE_AP) + (crownIs(st, i, "victor-frankenstein") ? heroes(st, i).filter((h) => h.id !== "victor-frankenstein").length : 0);
    st.sides[i].flags.itemApExtra = 0;
  }
  // Blodeuwedd's change at nightfall comes first
  if (st.round === NIGHTFALL && !st.noNight) {
    for (const c of allCards(st)) if (c.id === "blodeuwedd" && !c.flags.night) {
      c.flags.night = true; c.maxHealth = c.baseHealth * 2; c.health = c.maxHealth; c.baseAtk *= 2;
      log(st, `Blodeuwedd becomes the owl: 14 Health, Attack 4.`);
    }
  }
  // Guard refreshes
  for (const c of allCards(st)) { c.guardLeft = guardOf(st, c); c.stopNow = false; }
  // Nightfall damage and Poison (ignore Guard)
  if (isNight(st)) {
    const n = st.round - NIGHTFALL + 1;
    for (const c of allCards(st)) applyHealthLoss(st, null, c, n, { nightfall: true });
  }
  // Poison halves after each tick (rounded down), so it ends after it deals 1.
  // Steadfast: Poison doesn't work on heroes under a Tin Soldier Crown.
  for (const c of allCards(st)) if (c.poison > 0 && c.kind === "hero" && crownIs(st, c.side, "the-tin-soldier")) c.poison = 0;
  for (const c of allCards(st)) if (c.poison > 0) { const p = c.poison; c.poison = Math.floor(p / 2); applyHealthLoss(st, { name: "Poison", side: -1 }, c, p, {}); }
  // Unbound: Loki breaks free and lashes every enemy card for 1.
  for (const i of [0, 1]) {
    for (const c of st.sides[i].grave.slice()) {
      if (c.id !== "loki" || c.flags.returnRound !== st.round || noCheating(st) || at(st, i, c.slot)) continue;
      c.flags.returnRound = null; c.flags.unbound = true;
      revive(st, c, 3); log(st, `Loki breaks his bonds and returns on 3 Health.`); revived(st, c);
      // He takes back a Crown he wore earlier in the fight.
      if (c.flags.woreCrown && crownCard(st, i) && crownCard(st, i).uid !== c.uid && !st.sides[i].noCrown) { swapCrown(st, i, c); log(st, `Loki takes the Crown back.`); }
      for (const x of cards(st, 1 - i)) applyHealthLoss(st, c, x, 1, {});
    }
  }
  // Crown passives at upkeep
  for (const i of [0, 1]) {
    const crown = crownCard(st, i);
    if (!crown || !crownActive(st, i)) continue;
    const foe = 1 - i;
    switch (crown.id) {
      case "blodeuwedd": {
        for (const h of heroes(st, i)) if (h.uid !== crown.uid) { crown.guardLeft += h.guardLeft; h.guardLeft = 0; }
        break;
      }
      case "the-princess": { const c = st.rng.pick(cards(st, i)); heal(st, crown, c, 1); break; }
      case "red-riding-hood": {
        const c = cards(st, i).filter(injured).sort((a, b) => (b.maxHealth - b.health) - (a.maxHealth - a.health))[0];
        if (c) heal(st, crown, c, 2);
        break;
      }
      case "grendel": {
        const fr = cards(st, foe).filter((c) => c.kind === "front").sort((a, b) => a.health - b.health)[0];
        if (fr) damage(st, crown, fr, 2, {});
        break;
      }
      case "circe": {
        if (st.fate !== i) break;
        const fr = cards(st, foe).filter((c) => c.kind === "front");
        for (const c of fr) c.flags.swineRound = st.round;
        if (fr.length) { log(st, `Circe turns ${sideName(foe)}'s front rank into swine: 0 Attack this round.`); ev(st, { t: "debuff", kind: "swine", src: crown.uid, tgts: fr.map((c) => c.uid), text: "Swine: 0 Attack" }); }
        break;
      }
      case "friar-tuck": {
        const side = st.sides[i];
        side.flags.tuckReturns = side.flags.tuckReturns || 0;
        if (side.flags.tuckReturns < 2 && !isNight(st) && !noCheating(st)) {
          const dead = side.grave.find((c) => c.kind === "front" && !at(st, i, c.slot));
          if (dead) { revive(st, dead, 1); side.flags.tuckReturns++; log(st, `Friar Tuck brings ${dead.name} back on 1 Health.`); revived(st, dead); }
        }
        break;
      }
    }
  }
  // Bonds at upkeep
  for (const i of [0, 1]) {
    const f = bondFactor(st, i);
    if (!f) continue;
    for (const h of heroes(st, i)) {
      if (h.id === "victor-frankenstein") {
        for (const c of heroes(st, i)) if (c.uid === h.uid || isRealm(st, c, "Gothic")) heal(st, h, c, 2 * f > 0 ? 2 : 0, { flat: f < 0 });
      }
      if (h.id === "grendel" && heroes(st, i).some((x) => x.id === "grendels-mother")) heal(st, h, h, f > 0 ? 1 : 0);
    }
  }
  // Men of Ithaca: Villagers fill empty front-rank slots while uses last.
  for (const i of [0, 1]) {
    const side = st.sides[i];
    if (!(side.flags.ithacaLeft > 0) || !heroes(st, i).some((h) => h.id === "odysseus") || bondFactor(st, i) <= 0) continue;
    for (const slot of [4, 5, 6]) {
      if (side.flags.ithacaLeft <= 0 || at(st, i, slot)) continue;
      const v = makeFront(st.data.front.villager, i, slot);
      if (crownIs(st, i, "polyphemus")) { v.maxHealth += 2; v.health += 2; }
      v.guardLeft = guardOf(st, v);
      side.slots[slot] = v; side.flags.ithacaLeft--;
      log(st, `A man of Ithaca steps into ${sideName(i)}'s front rank.`);
    }
  }
  diffStats(st, upkeepBefore, null);
  checkWin(st);
}

function revive(st, c, health) {
  const side = st.sides[c.side];
  c.dead = false; c.removed = false; c.health = health;
  side.grave = side.grave.filter((x) => x.uid !== c.uid);
  side.slots[c.slot] = c;
  if (crownIs(st, c.side, "gwydion")) { c.maxHealth += 2; c.health += 2; c.atkPerm += 1; }
}
// The revive event goes after the log line that explains it.
const revived = (st, c) => ev(st, { t: "revive", uid: c.uid, side: c.side, slot: c.slot, name: c.name, hp: c.health });

// ---------- win check ----------
function checkWin(st) {
  if (st.over) return true;
  const lost = [0, 1].map((i) => {
    const side = st.sides[i];
    if (side.troops) return cards(st, i).length === 0;
    if (side.noCrown) return heroes(st, i).length === 0;
    const crown = Object.values(side.slots).find((c) => c && c.uid === side.crownUid);
    return !crown || crown.dead;
  });
  if (lost[0] && lost[1]) { st.over = true; st.winner = -1; log(st, "Both crowns fall: a draw."); ev(st, { t: "over", winner: st.winner }); }
  else if (lost[0]) { st.over = true; st.winner = 1; log(st, "Red wins."); ev(st, { t: "over", winner: st.winner }); }
  else if (lost[1]) { st.over = true; st.winner = 0; log(st, "Blue wins."); ev(st, { t: "over", winner: st.winner }); }
  else if (st.round >= (st.maxRounds || MAX_ROUNDS)) { st.over = true; st.winner = -1; log(st, "Round limit reached: a draw."); ev(st, { t: "over", winner: st.winner }); }
  return st.over;
}
