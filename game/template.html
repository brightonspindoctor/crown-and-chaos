<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crown & Chaos: Prototype</title>
<meta name="theme-color" content="#17110c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crown &amp; Chaos">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=UnifrakturMaguntia&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Crown & Chaos playable prototype. Colours and type come from the Crown & Chaos design system (Gallery theme).
   Battle on a phone: enemy pyramid on top, yours below. On desktop: yours on the left, the enemy's on the right. */
:root {
  --surface: #17110c; --raised: #221912; --ink: #efe4cc; --muted: #b9a68c; --line: #3a2c20;
  --gold-text: #d9b763; --gold-leaf: #c9a24a; --gold-shade: #8a6424;
  --ultramarine: #1f3a6e; --umber: #4a3222; --oxblood: #6e2a22; --vermilion: #b5381f; --verdigris: #2f5f51;
  --paper: #efe4cc; --card-ink: #2a1d14; --card-muted: #5e4a39;
  --display: Cinzel, "Trajan Pro", Georgia, serif;
  --serif: "EB Garamond", Garamond, Georgia, serif;
  --head: 40px; --dock: 160px;
  --ch: clamp(62px, calc((100dvh - var(--head) - var(--dock) - 62px) / 6), 132px);
  --cw: min(calc((100vw - 28px) / 3.25), calc(var(--ch) * 1.12));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--surface); color: var(--ink); font: 16px/1.3 var(--serif); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold-text); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
.dt { display: none; }
[hidden] { display: none !important; }
#app { height: 100dvh; position: relative; }
#battle { height: 100%; display: flex; flex-direction: column; }

/* ---------- battle header ---------- */
#head { height: var(--head); flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
#head .round { text-align: left; font: 600 12px/1.15 var(--display); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; white-space: nowrap; display: flex; flex-direction: column; }
#head .round i { font: italic 400 11.5px/1.1 var(--serif); letter-spacing: 0; text-transform: none; color: var(--muted); }
#head .round i.now { color: #a9bfe6; }
#head .place { text-align: center; min-width: 0; }
#head .place b { display: block; font: 600 13px/1.15 var(--display); letter-spacing: .1em; color: var(--gold-text); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#head .place i { display: block; font-size: 11px; line-height: 1.1; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#head .round.focus { animation: glow 1.1s ease-in-out infinite alternate; border-radius: 4px; padding: 2px 4px; }
#head .menu { font: 600 11px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 10px 0 10px 10px; white-space: nowrap; }
#head .menu:hover { color: var(--ink); }

/* ---------- animation layer (play/fx.css), with this page's names for the colours it uses ---------- */
:root { --gold: var(--gold-leaf); --body: var(--serif); --felt: var(--surface); --panel: var(--raised); --red: var(--vermilion); }
/*FXCSS*/
.mid.fx-phase { justify-content: center; height: 10px; font: italic 13px/1 var(--serif); color: var(--ink); white-space: nowrap; text-shadow: 0 1px 3px #000; }
.mid.fx-phase::before { display: none; }
#table.fx-night::before { background: linear-gradient(rgba(8,12,30,.84), rgba(6,8,20,.92)); }
.card.slot.fx-revived { border: 1px solid var(--gold-leaf); background: #1c130c; color: var(--ink); align-items: center; justify-content: center; font: 600 .8em/1.2 var(--display); text-align: center; }

/* ---------- the table ---------- */
#table { flex: 1; min-height: 0; position: relative; background: #0c0805 center / cover no-repeat; }
#table::before { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(23,17,12,.72), rgba(23,17,12,.82)); transition: background 1.2s; }
#table.night::before { background: linear-gradient(rgba(8,12,30,.84), rgba(6,8,20,.92)); }
#board { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.side { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.side.me { flex-direction: column-reverse; }
.rank { display: flex; gap: 6px; justify-content: center; }
.mid { height: 10px; width: 100%; display: flex; align-items: center; }
.mid::before { content: ""; flex: 1; border-top: 1px dashed rgba(201,162,74,.45); margin: 0 10px; }
/* The Fate token sits on the side of whoever holds it, and crosses the board when it changes hands. */
#fate { position: absolute; z-index: 6; left: 8px; top: 8px; width: 70px; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: top .9s cubic-bezier(.5,0,.3,1), left .9s cubic-bezier(.5,0,.3,1); pointer-events: none; }
#fate.mine { top: calc(100% - 68px); }
#fate b { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 700 9px/1 var(--display); letter-spacing: .04em; color: #2a1d14;
  background: radial-gradient(circle at 35% 30%, #f1dc9a, var(--gold-leaf) 55%, var(--gold-shade)); box-shadow: 0 1px 5px rgba(0,0,0,.7); }
#fate i { font-size: 12px; line-height: 1; color: var(--ink); text-shadow: 0 1px 3px #000; white-space: nowrap; }
#fate.focus b { animation: glow 1.1s ease-in-out infinite alternate; }

/* ---------- small cards (board, line-up, collection) ---------- */
.card { position: relative; width: var(--cw); height: var(--ch); flex: none; display: flex; flex-direction: column; gap: calc(var(--cw) * .03);
  padding: calc(var(--cw) * .045); border-radius: calc(var(--cw) * .08); font-size: calc(var(--cw) * .118); text-align: left;
  background: #2a1c12; border: max(2px, calc(var(--cw) * .028)) solid #5d4330; box-shadow: 0 2px 8px rgba(20,13,8,.55); transition: transform .18s, opacity .25s, filter .25s; }
.card.hero { background: #1c130c; border-color: var(--gold-leaf); box-shadow: inset 0 0 0 1px var(--gold-shade), 0 2px 8px rgba(20,13,8,.55); }
.card.item { background: #24120e; border-color: #8a3a2e; }
.card.charging { animation: chargeGlow 1.1s ease-in-out infinite alternate; }
@keyframes chargeGlow { from { box-shadow: 0 0 0 2px #ff5a3c, 0 0 10px rgba(255,122,26,.55); } to { box-shadow: 0 0 0 3px #ffb347, 0 0 26px rgba(255,122,26,.95); } }
@media (prefers-reduced-motion: reduce) { .card.charging { animation: none; box-shadow: 0 0 0 3px #ff5a3c, 0 0 18px rgba(255,122,26,.8); } }
.card.hidden { align-items: center; justify-content: center; border: 1px solid #8a6424; background: repeating-linear-gradient(45deg, rgba(217,183,99,.08) 0 1px, transparent 1px 10px), radial-gradient(circle at 50% 45%, #9a4a22, #2e1408 80%); }
.card.hidden span { font: 700 2em/1 var(--display); color: #d9b763; }
.card.slot { background: none; border: 1px dashed rgba(185,166,140,.2); box-shadow: none; cursor: default; }
.card.slot.pick { cursor: pointer; border-color: rgba(217,183,99,.55); background: rgba(23,17,12,.5); align-items: center; justify-content: center; gap: 2px; color: var(--muted); font: 600 .8em/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; text-align: center; }
.card.slot.pick b { font-size: 1.9em; line-height: 1; color: var(--gold-text); font-weight: 500; }
.card.slot.off { opacity: .5; cursor: default; }
.nm { font: 600 .82em/1.25 var(--display); letter-spacing: .03em; text-align: center; white-space: nowrap; overflow: hidden; border-radius: 2px; background: var(--umber); padding: 0 .15em; flex: none; text-transform: uppercase; }
.hero .nm { background: var(--ultramarine); } .item .nm { background: var(--oxblood); }
.art { flex: 1; min-height: 0; overflow: hidden; border-radius: 2px; position: relative; background: #0c0805; }
.art img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
.stats { flex: none; display: flex; align-items: center; gap: .35em; font: 700 1.05em/1 var(--display); height: 1.35em; }
.stats svg { width: .95em; height: .95em; flex: none; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.stats em { font: italic 400 .8em/1 var(--serif); color: var(--muted); white-space: nowrap; }
.atk { display: flex; align-items: center; gap: .2em; }
.grd { width: 1.15em; height: 1.15em; transform: rotate(45deg); background: #35507f; border: 1px solid #9fb3d6; display: grid; place-items: center; margin-left: .25em; }
.grd b { transform: rotate(-45deg); font-size: .78em; }
.hp { margin-left: auto; min-width: 1.75em; text-align: center; padding: .16em .2em .5em; margin-bottom: -.32em; background: #8f2a16; clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%); }
.hp.hurt { color: #ffd9c9; }
.seal, .crownmark, .count { position: absolute; top: -.5em; width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center; z-index: 2; box-shadow: 0 1px 3px rgba(0,0,0,.6); }
.seal { left: -.5em; background: var(--vermilion); border: 1px solid #e9b9a6; font: 700 .9em/1 var(--display); }
.crownmark { right: -.5em; background: #1c130c; border: 1px solid var(--gold-leaf); }
.crownmark svg { width: 1.05em; height: 1.05em; fill: var(--gold-leaf); }
.count { right: -.5em; width: auto; min-width: 1.6em; padding: 0 .3em; border-radius: 1em; background: var(--surface); border: 1px solid var(--muted); font: 700 .85em/1 var(--display); }
.coin { position: absolute; right: .25em; bottom: .25em; min-width: 1.7em; height: 1.7em; padding: 0 .2em; border-radius: 50%; display: grid; place-items: center; font: 700 .85em/1 var(--display); color: #2a1d14;
  background: radial-gradient(circle at 35% 30%, #f1dc9a, var(--gold-leaf) 60%, var(--gold-shade)); box-shadow: 0 1px 3px rgba(0,0,0,.6); }
.order, .badge { position: absolute; left: 0; right: 0; bottom: 0; font: 600 .78em/1.5 var(--display); letter-spacing: .03em; text-align: center; white-space: nowrap; overflow: hidden; background: rgba(47,95,81,.94); }
.badge { background: rgba(110,42,34,.94); }
.card.focus, .card.can { animation: glow 1.1s ease-in-out infinite alternate; z-index: 3; }
.card.dim { opacity: .5; }
.card.acting { transform: scale(1.07); z-index: 4; box-shadow: 0 0 0 2px #f1dc9a, 0 10px 24px rgba(20,13,8,.7); }
.card.hit { animation: shake .4s; }
.card.fallen { opacity: .28; filter: grayscale(1); }
.card.stopped { filter: saturate(.4) brightness(.8); }
.float { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); font: 700 1.9em/1 var(--display); z-index: 5; pointer-events: none; text-shadow: 0 0 6px #000, 0 2px 2px #000; animation: rise 1.2s ease-out forwards; white-space: nowrap; }
.float.dmg { color: #ff8f73; } .float.heal { color: #8fe0c2; } .float.blk { color: #c9d6f0; font-size: 1.05em; }
@keyframes glow { from { box-shadow: 0 0 0 2px var(--gold-text), 0 0 6px 2px rgba(217,183,99,.35); } to { box-shadow: 0 0 0 3px #f6e3a6, 0 0 18px 7px rgba(217,183,99,.7); } }
@keyframes shake { 20% { transform: translateX(-5px); } 45% { transform: translateX(5px); } 70% { transform: translateX(-3px); } }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.7); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -110%); } }

/* ---------- battle dock ---------- */
#dock { height: var(--dock); flex: none; display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 10px; background: var(--raised); border-top: 1px solid var(--gold-shade); }
.coach { flex: 1; min-height: 0; overflow-y: auto; font-size: 15.5px; line-height: 1.26; }
.coach p { text-wrap: pretty; }
.who { font: 600 10px/1.4 var(--display); letter-spacing: .14em; color: var(--gold-text); text-transform: uppercase; display: block; }
.coach.nudge { animation: shake .4s; }
.chips { display: flex; gap: 6px; margin-top: 5px; overflow-x: auto; scrollbar-width: none; }
.chip { flex: none; white-space: nowrap; font-size: 13px; line-height: 1.2; border: 1px solid var(--line); border-radius: 99px; padding: 2px 4px 2px 9px; display: inline-flex; align-items: center; gap: 4px; background: var(--surface); min-height: 26px; }
.chip button { width: 22px; height: 22px; border-radius: 50%; color: var(--muted); font-size: 15px; line-height: 1; }
button.chip { padding: 2px 10px; border-color: var(--gold-shade); color: var(--gold-text); }
.chip.crowned { border-color: var(--gold-leaf); color: var(--gold-text); padding-left: 7px; background: #1c1a24; }
.chip.crowned svg { width: 14px; height: 14px; fill: var(--gold-leaf); flex: none; }
.chip .ml { width: auto; height: auto; border-radius: 0; color: inherit; font-size: inherit; padding: 2px; }
.ctl { flex: none; display: flex; align-items: center; gap: 10px; height: 40px; }
.ap { display: flex; align-items: center; gap: 4px; }
.ap span { font: 600 10px/1 var(--display); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-right: 3px; }
.pip { width: 15px; height: 15px; border-radius: 50%; border: 1px dashed var(--gold-shade); display: inline-block; flex: none; }
.pip.on { border: 1px solid var(--gold-shade); background: radial-gradient(circle at 35% 30%, #f1dc9a, var(--gold-leaf) 60%, var(--gold-shade)); }
.belt { display: flex; gap: 6px; min-width: 0; }
.belt .item { height: 38px; display: flex; align-items: center; gap: 6px; padding: 2px; border: 1px solid #8a3a2e; border-radius: 6px; background: #1c130c; font-size: 14px; white-space: nowrap; }
.belt .item img { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; display: block; }
.belt .item.solo { padding-right: 9px; }
.belt .item.focus { animation: glow 1.1s ease-in-out infinite alternate; }
.belt .item:disabled { opacity: .45; cursor: default; }
.grow { flex: 1; }
.btn { height: 40px; padding: 0 16px; border-radius: 6px; font: 700 12.5px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; color: #2a1d14;
  background: linear-gradient(#e9cf85, var(--gold-leaf)); border: 1px solid var(--gold-shade); box-shadow: 0 2px 6px rgba(0,0,0,.45); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.quiet { background: none; color: var(--gold-text); border-color: var(--gold-shade); box-shadow: none; }
.btn.focus { animation: glow 1.1s ease-in-out infinite alternate; }
.btn.big { height: 50px; font-size: 14px; }

/* ---------- sheets and panels ---------- */
#sheet:empty, #over:empty { display: none; }
#sheet { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(12,8,5,.6); }
.sheet { width: min(560px, 100%); max-height: 88dvh; overflow-y: auto; background: var(--raised); border: 1px solid var(--gold-shade); border-bottom: 0; border-radius: 14px 14px 0 0; padding: 14px 14px 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -10px 30px rgba(0,0,0,.6); }
.sheet .hint { font-style: italic; color: var(--gold-text); }
.sheet .top { display: flex; gap: 12px; align-items: flex-start; }
.sheet .pic { width: 118px; aspect-ratio: 5 / 4; object-fit: cover; object-position: 50% 30%; border-radius: 6px; border: 2px solid var(--gold-leaf); flex: none; }
.sheet h2 { font: 600 20px/1.2 var(--display); letter-spacing: .04em; }
.sheet .kind { font-style: italic; color: var(--muted); margin: 0 0 4px; }
.sheet .nums { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 15px; }
.sheet .nums b { font-family: var(--display); }
.credit { font-size: 12.5px; font-style: italic; color: var(--muted); margin-top: 4px; }
.x { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); color: var(--muted); font-size: 20px; line-height: 1; flex: none; }
.rule { font-size: 15.5px; line-height: 1.3; }
.rule b { font: 600 11px/1.2 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--gold-text); display: block; margin-bottom: 2px; }
.rule.off { color: var(--muted); }
.acts { display: flex; flex-direction: column; gap: 7px; }
.act.info { cursor: default; } .act.info.off { opacity: .55; }
.act { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; text-align: left; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--gold-shade); background: var(--surface); }
.act strong { font: 600 15px/1.2 var(--display); letter-spacing: .04em; }
.act .cost { display: flex; gap: 3px; align-items: center; }
.act .cost .pip { width: 12px; height: 12px; }
.act small { grid-column: 1 / -1; font-size: 14.5px; color: var(--muted); line-height: 1.25; }
.act:disabled { opacity: .42; cursor: default; }
.act.focus { animation: glow 1.1s ease-in-out infinite alternate; }
#over { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; padding: 20px; background: rgba(12,8,5,.8); overflow-y: auto; }
.panel { width: min(440px, 100%); background: var(--raised); border: 2px solid var(--gold-leaf); box-shadow: inset 0 0 0 1px var(--gold-shade), 0 20px 50px rgba(0,0,0,.7); border-radius: 14px; padding: 26px 22px 22px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.panel > svg { width: 44px; height: 44px; fill: var(--gold-leaf); }
.eyebrow { font: 600 11px/1.2 var(--display); letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
.panel h1 { font: 600 34px/1.1 var(--display); letter-spacing: .03em; color: var(--gold-text); text-wrap: balance; }
.panel p { font-size: 17px; line-height: 1.35; text-wrap: pretty; }
.btns { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 6px; }
.btns .btn { width: 100%; height: 46px; }
.panel ul { margin: 0; padding: 0; list-style: none; text-align: left; font-size: 15.5px; line-height: 1.3; display: flex; flex-direction: column; gap: 4px; }
.panel li::before { content: "◆ "; color: var(--gold-leaf); font-size: 10px; vertical-align: 2px; }
.ledger { width: 100%; border-top: 1px solid var(--line); font-size: 16px; }
.ledger div { display: flex; justify-content: space-between; gap: 12px; padding: 5px 2px; border-bottom: 1px solid var(--line); text-align: left; }
.ledger b { font-family: var(--display); color: var(--gold-text); white-space: nowrap; }
.ledger .tot { font-family: var(--display); letter-spacing: .06em; text-transform: uppercase; font-size: 14px; }

/* ---------- pages outside the battle ---------- */
#page { height: 100%; display: flex; flex-direction: column; }
#view { flex: 1; min-height: 0; overflow-y: auto; }
.wrap { max-width: 880px; margin: 0 auto; padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 16px; }
#nav { flex: none; display: flex; border-top: 1px solid var(--gold-shade); background: var(--raised); }
#nav button { flex: 1; height: 54px; font: 600 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
#nav button.on { color: var(--gold-text); box-shadow: inset 0 2px 0 var(--gold-leaf); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar h1 { font: 600 24px/1.15 var(--display); letter-spacing: .05em; }
.gold { display: inline-flex; align-items: center; gap: 7px; font: 700 18px/1 var(--display); white-space: nowrap; }
.crowns { display: inline-flex; align-items: center; gap: 6px; font: 700 18px/1 var(--display); white-space: nowrap; color: var(--gold-text); }
.crowns svg { width: 20px; height: 20px; fill: var(--gold-leaf); }
.gold::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f1dc9a, var(--gold-leaf) 60%, var(--gold-shade)); box-shadow: inset 0 0 0 1px var(--gold-shade); }
.lede { font-size: 17px; line-height: 1.35; color: var(--muted); text-wrap: pretty; }
.hero-screen { min-height: 100%; display: grid; place-items: center; padding: 24px 18px; background: linear-gradient(rgba(23,17,12,.7), rgba(23,17,12,.92)), url(img/cover.jpg) center 30% / cover no-repeat; }
.cover-screen { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 0 0 18px; background: #120d09; }
.cover { display: block; width: 100%; max-width: 560px; max-height: calc(100dvh - 54px - 270px); object-fit: contain; object-position: 50% 0; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
.cover-side { width: 100%; max-width: 440px; padding: 0 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.cover-side .lede { color: var(--ink); }
.cover-title { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font: 400 44px/1 "UnifrakturMaguntia", var(--display); color: #e6c46c; text-shadow: 0 2px 0 #2a0d0b, 0 0 18px rgba(217,150,70,.35); }
.cover-title .ct-crown svg { width: 40px; fill: var(--gold-leaf); display: block; }
@media (max-width: 899px) { .cover-title { font-size: 34px; flex-direction: row; gap: 8px; } .cover-title .ct-crown svg { width: 26px; } .cover-side { gap: 8px; } }
.cover-side .meta { display: flex; gap: 18px; align-items: center; justify-content: center; color: var(--muted); font-style: italic; }
.cover-side .btns { margin-top: 0; }
.cover-side .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 14px; }
.title { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; max-width: 440px; width: 100%; }
.title > svg { width: 60px; height: 60px; fill: var(--gold-leaf); }
.title h1 { font: 600 40px/1.05 var(--display); letter-spacing: .06em; color: var(--gold-text); text-transform: uppercase; }
.title h1 span { font-size: .62em; display: block; letter-spacing: .3em; color: var(--ink); margin: 4px 0; }
.title .lede { color: var(--ink); }
.title .meta { display: flex; gap: 18px; align-items: center; justify-content: center; margin-top: 4px; color: var(--muted); font-style: italic; }
.link { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; padding: 8px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; }
.tabs button { padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); font: 600 11px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tabs button.on { border-color: var(--gold-leaf); color: var(--gold-text); }
.grid { --cw: 108px; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 16px 12px; padding-top: 6px; }
.grid .card { width: 100%; height: auto; aspect-ratio: 1 / 1.08; cursor: pointer; }
.empty { color: var(--muted); font-style: italic; padding: 20px 0; }
.box { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.box h2 { font: 600 13px/1.2 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--gold-text); }
.box.focus { animation: glow 1.1s ease-in-out infinite alternate; }

/* ---------- the Library ---------- */
.filter { align-self: flex-start; display: flex; gap: 8px; align-items: center; font: 600 10px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.filter select { font: 15px var(--serif); color: var(--ink); background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.libsec { display: flex; flex-direction: column; gap: 10px; }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.sechead h2 { font: 600 14px/1.2 var(--display); letter-spacing: .08em; color: var(--gold-text); }
.prog { font-style: italic; color: var(--muted); white-space: nowrap; font-size: 14.5px; }
.credit a { color: var(--gold-text); }
/* lore cards: parchment, the hero's painting above the title */
.loregrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.lore { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 6px 6px 10px; border-radius: 8px; background: var(--paper); color: var(--card-ink); border: 2px solid var(--gold-shade); box-shadow: 0 2px 8px rgba(20,13,8,.5); }
.lore-art { display: block; aspect-ratio: 16 / 9; border-radius: 4px; overflow: hidden; background: #0c0805; }
.lore-art img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; filter: sepia(.25); }
.lore-n { font: 600 10px/1.2 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--card-muted); padding: 2px 2px 0; }
.lore b { font: 600 15px/1.2 var(--display); letter-spacing: .02em; padding: 0 2px; }
.locked { background: none !important; border: 1px dashed rgba(185,166,140,.35) !important; box-shadow: none !important; color: var(--muted) !important; cursor: default; }
.locked .lore-art, .arttile.locked .pic { display: grid; place-items: center; background: rgba(23,17,12,.6); }
.locked .lore-art i, .locked .pic i { font: 600 26px/1 var(--display); color: rgba(185,166,140,.4); font-style: normal; }
.locked .lore-n { color: var(--muted); }
.locked b { font-weight: 500; }
.lore-sheet .lore-pic { aspect-ratio: 16 / 8; border-radius: 6px; overflow: hidden; border: 2px solid var(--gold-leaf); }
.lore-sheet .lore-pic img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
.lore-text { font-size: 18px; line-height: 1.45; text-wrap: pretty; }
.lore-text::first-letter { font: 600 2.6em/.9 var(--display); float: left; margin: 4px 8px 0 0; color: var(--gold-text); }
.lore-voice { font: italic 17px/1.3 var(--serif); color: var(--gold-text); }
.lore-voice span { display: block; font-size: 14.5px; color: var(--muted); margin-top: 2px; }
.lore-sheet .row .btn { font-size: 13px; }
/* variants */
.artrow { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.arttile { position: relative; display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 5px 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); }
.arttile .pic { display: block; aspect-ratio: 1 / 1; border-radius: 4px; overflow: hidden; background: #0c0805; }
.arttile .pic img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
.arttile b { font: 600 13px/1.2 var(--display); letter-spacing: .03em; padding: 2px 2px 0; }
.arttile > i { font-size: 13px; line-height: 1.15; color: var(--muted); padding: 0 2px; }
.arttile.on { border: 2px solid var(--gold-leaf); box-shadow: 0 0 0 1px var(--gold-shade), 0 4px 14px rgba(20,13,8,.6); }
.arttile em { position: absolute; top: 9px; left: 9px; font: 700 9.5px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; font-style: normal; color: #2a1d14; background: var(--gold-leaf); border-radius: 99px; padding: 4px 7px; }
/* quests */
.questtale { font: italic 18px/1.4 var(--serif); color: var(--gold-text); text-wrap: pretty; }
.queststeps { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 16px; line-height: 1.35; }
.btn small { display: block; font: 600 11px/1.3 var(--sans, inherit); letter-spacing: .08em; opacity: .75; margin-top: 2px; }
.questco { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 3px; font-size: 15.5px; }
/* levels, your court, Hall of Fame */
.lvseal { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 112px; height: 112px; border-radius: 50%; background: var(--gold-leaf); box-shadow: inset 0 0 0 4px var(--gold-leaf), inset 0 0 0 6px var(--gold-shade), 0 10px 24px rgba(20,13,8,.45); color: #2a1d14; font: 700 50px/1 var(--display); }
.lvseal i { font: 700 10px/1.2 var(--display); letter-spacing: .18em; text-transform: uppercase; font-style: normal; }
.lvseal.sm { width: 34px; height: 34px; font-size: 14px; box-shadow: inset 0 0 0 2px var(--gold-shade); }
.lvseal.sm i { display: none; }
.rep { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.rep-top { display: flex; justify-content: space-between; font: 600 12px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.rep-top span:first-child { color: var(--gold-text); }
.rep-bar { height: 10px; border-radius: 5px; background: var(--surface); border: 1px solid var(--gold-shade); overflow: hidden; }
.rep-bar i { display: block; height: 100%; background: var(--gold-leaf); }
.lvpanel { gap: 14px; margin: auto 0; }
#over:has(.lvpanel) { place-items: start center; }
.giftcards { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.avatar { position: relative; display: inline-block; width: 36px; height: 48px; flex: none; }
.avatar .avface { position: absolute; left: 2px; bottom: 0; width: 32px; height: 32px; border-radius: 50%; background: var(--ultramarine); box-shadow: 0 0 0 2px var(--gold-leaf); display: grid; place-items: center; font: 700 13px/1 var(--display); color: var(--gold-leaf); }
.avatar .avcrown { position: absolute; left: 3px; top: 0; width: 30px; height: 21px; z-index: 1; }
.avatar .avcrown .crownicon { width: 100%; height: 100%; }
.avatar.big { width: 120px; height: 150px; }
.avatar.big .avface { left: 10px; width: 100px; height: 100px; font-size: 40px; box-shadow: 0 0 0 3px var(--gold-leaf); }
.avatar.big .avcrown { left: 18px; width: 84px; height: 59px; }
.newcrown .avcrown { animation: crown-in .7s ease-out both; }
@keyframes crown-in { 0% { transform: translateY(-40px); opacity: 0 } 70% { transform: translateY(4px); opacity: 1 } 100% { transform: none } }
@media (prefers-reduced-motion: reduce) { .newcrown .avcrown { animation: none; } }
.me-chip { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 2px 14px 2px 6px; border-radius: 26px; border: 1px solid var(--line); background: var(--raised); color: var(--ink); text-align: left; cursor: pointer; }
.me-chip b { display: block; font: 600 14px/1.1 var(--display); }
.me-chip i { display: block; font-size: 13px; color: var(--muted); }
.court-me { flex-direction: row; align-items: center; gap: 16px; }
.court-lv { display: flex; align-items: center; gap: 8px; margin: 6px 0 2px; }
.courtstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.courtstats > div { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.courtstats i { font: 600 10px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-style: normal; }
.courtstats b { font: 700 20px/1.1 var(--display); color: var(--gold-text); }
.hof { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.hof li { display: grid; grid-template-columns: 24px 36px 1fr 34px 48px; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); }
.hof li.me { background: var(--ultramarine); border-color: var(--gold-leaf); }
.hof li b { text-align: right; font: 700 15px/1 var(--display); }
/* settings */
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 52px; }
.setrow b { display: block; font: 600 15px/1.2 var(--display); letter-spacing: .03em; }
.setrow i { display: block; font-size: 14px; color: var(--muted); }
.switch { width: 52px; height: 30px; flex: none; border-radius: 15px; background: var(--surface); border: 1px solid var(--gold-shade); position: relative; }
.switch span { position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .15s ease, background .15s ease; }
.switch.on { background: var(--ultramarine); border-color: var(--gold-leaf); }
.switch.on span { transform: translateX(22px); background: var(--gold-leaf); }
.setslider { display: flex; flex-direction: column; gap: 6px; padding: 0 0 8px; font-size: 14px; color: var(--muted); }
.setslider input { width: 100%; accent-color: var(--gold-leaf); height: 28px; }
.setslider.off { opacity: .5; }
.box.admin { border-color: var(--vermilion); }

/* gothic level screens and Your court */
.blackletter { font-family: "UnifrakturMaguntia", var(--display) !important; font-weight: 400 !important; letter-spacing: .01em !important; text-transform: none !important; }
.panel.gothic { position: relative; overflow: hidden; width: min(420px, 100%); border-radius: 6px 6px 10px 10px; padding: 46px 24px 24px; border: 2px solid var(--gold-leaf);
  background: radial-gradient(ellipse at 50% -10%, rgba(217,150,70,.28), transparent 55%), radial-gradient(ellipse at 50% 120%, #2a0d0b, transparent 60%), linear-gradient(#1a0f0b, #0d0806);
  box-shadow: inset 0 0 0 5px #0d0806, inset 0 0 0 6px var(--gold-shade), 0 0 0 1px #000, 0 30px 70px rgba(0,0,0,.85); }
.panel.gothic > * { position: relative; }
.panel.gothic h1.blackletter { font-size: 40px; line-height: 1.05; color: #e6c46c; text-shadow: 0 2px 0 #2a0d0b, 0 0 18px rgba(217,150,70,.35); }
.panel.gothic .eyebrow { color: #d9b763; letter-spacing: .28em; }
.panel.gothic p { color: #e2d3b4; }
.gothic .arch, .courthead .arch { position: absolute; left: 10px; right: 10px; top: 8px; width: calc(100% - 20px); height: 56px; }
.gothic .cb-c, .gbox .cb-c { position: absolute; width: 18px; height: 18px; border: 0 solid var(--gold-leaf); }
.cb-c.tl { top: 8px; left: 8px; border-top-width: 2px; border-left-width: 2px; }
.cb-c.tr { top: 8px; right: 8px; border-top-width: 2px; border-right-width: 2px; }
.cb-c.bl { bottom: 8px; left: 8px; border-bottom-width: 2px; border-left-width: 2px; }
.cb-c.br { bottom: 8px; right: 8px; border-bottom-width: 2px; border-right-width: 2px; }
.divider { width: 70%; height: 14px; display: block; margin: 0 auto; }
.embers { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.embers i { position: absolute; bottom: -6px; width: 3px; height: 3px; border-radius: 50%; background: #f0b45a; box-shadow: 0 0 6px 2px rgba(240,140,60,.6); opacity: 0; animation: ember 3.6s linear infinite; }
@keyframes ember { 0% { transform: translate(0, 0); opacity: 0 } 15% { opacity: .9 } 100% { transform: translate(14px, -420px); opacity: 0 } }
.sealstage { position: relative; display: grid; place-items: center; width: 190px; height: 190px; margin: 0 auto; }
.sealstage::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: repeating-conic-gradient(rgba(217,183,99,.22) 0 7deg, transparent 7deg 15deg); -webkit-mask: radial-gradient(circle, #000 30%, transparent 70%); mask: radial-gradient(circle, #000 30%, transparent 70%); animation: spin 24s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }
.waxseal { position: relative; width: 140px; height: 140px; display: grid; place-items: center; filter: drop-shadow(0 8px 14px rgba(0,0,0,.7)); animation: stamp .6s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes stamp { from { transform: scale(1.8) rotate(-12deg); opacity: 0 } }
.waxseal svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.waxseal b { position: relative; font: 700 40px/1 var(--display); color: #e6c46c; text-shadow: 0 2px 0 #4a120e; letter-spacing: .02em; }
.waxseal i { position: absolute; bottom: 30px; font: 600 9px/1 var(--display); letter-spacing: .2em; text-transform: uppercase; color: #e2b98a; font-style: normal; }
.btn.gilt { background: linear-gradient(#e0c06a, var(--gold-leaf) 50%, #a47d32); color: #2a1d14; border: 1px solid #6b4d1e; box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 4px 12px rgba(0,0,0,.5); }
.niche { position: relative; display: grid; place-items: end center; width: 150px; height: 180px; margin: 0 auto; border-radius: 75px 75px 6px 6px; background: radial-gradient(ellipse at 50% 0%, rgba(240,200,120,.35), transparent 65%), #120a08; border: 2px solid var(--gold-shade); box-shadow: inset 0 0 0 4px #120a08, inset 0 0 0 5px rgba(201,162,74,.5); padding-bottom: 12px; }
.panel.gothic .rep-top span:first-child { color: #e6c46c; }
.panel.gothic .rep-bar { background: #0b0605; border-color: #8a6424; height: 12px; }
.rep-bar i { transition: width .8s cubic-bezier(.45,.05,.3,1); }
.waxseal.restamp { animation: stamp .45s cubic-bezier(.2,1.4,.4,1) both; }
.panel.gothic .rep-bar i { background: linear-gradient(90deg, #8a6424, #e6c46c, #c9a24a); box-shadow: 0 0 10px rgba(230,196,108,.5); }
.giftcards .flipper .cardback, .giftcards .fc { width: min(280px, 72vw); }
.court .courthead { position: relative; text-align: center; padding: 34px 0 6px; }
.court .courthead h1 { font-size: 46px; color: #e6c46c; text-shadow: 0 2px 0 #2a0d0b; margin: 0; }
.gbox { position: relative; background: linear-gradient(#1c120d, #120b08); border: 1px solid var(--gold-shade); box-shadow: inset 0 0 0 4px #120b08, inset 0 0 0 5px rgba(201,162,74,.35); }
.court-me { flex-direction: row; align-items: center; justify-content: center; gap: 18px; padding: 20px; }
.court-me .niche { width: 130px; height: 160px; margin: 0; }
.court-id { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.court-id .waxseal { width: 110px; height: 110px; } .court-id .waxseal b { font-size: 32px; } .court-id .waxseal i { bottom: 22px; }
.hofbox h2 { font-size: 30px; color: #e6c46c; text-align: center; }
.namefield { display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; font: 600 11px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: #d9b763; }
.namefield input { font: 400 22px/1.2 var(--serif); color: #efe4cc; background: #0b0605; border: 1px solid #8a6424; border-radius: 6px; padding: 10px 12px; min-height: 48px; letter-spacing: .02em; text-transform: none; }
.namefield input:focus { outline: 2px solid #e6c46c; outline-offset: 1px; }
.namemsg { min-height: 20px; font-size: 15px !important; color: #b9a68c !important; }
.namemsg.good { color: #9fd3a8 !important; } .namemsg.bad { color: #e8907a !important; }
.ladder li { grid-template-columns: 30px 40px 1fr 34px; min-height: 52px; }
.ladder .hrank { font: 700 15px/1 var(--display); color: #e6c46c; text-align: center; }
.ladder .hname { font: 600 15px/1.2 var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ladder .hname i { font: italic 400 13px var(--serif); color: var(--muted); }
.ladder li:nth-child(-n+3) .hrank { color: #f0d27a; text-shadow: 0 0 8px rgba(240,200,110,.5); }
/* card backs */
.cardback { width: min(310px, 84vw); aspect-ratio: 5 / 7; box-sizing: border-box; border-radius: 14px; padding: 8px; background: repeating-linear-gradient(45deg, #c9a24a 0 4px, #b38c3c 4px 6px); border: 1px solid #8a6424; box-shadow: 0 10px 24px rgba(0,0,0,.6); }
.cb-in { position: relative; height: 100%; box-sizing: border-box; border-radius: 8px; border: 2px solid #8a6424; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 26px 14px 22px;
  background: repeating-linear-gradient(45deg, rgba(217,183,99,.07) 0 1px, transparent 1px 14px), repeating-linear-gradient(-45deg, rgba(217,183,99,.07) 0 1px, transparent 1px 14px), radial-gradient(circle at 50% 45%, var(--b1), var(--b2) 78%);
  box-shadow: inset 0 0 0 7px var(--b2), inset 0 0 0 8px rgba(201,162,74,.6); }
.cb-in .cb-c { position: absolute; width: 20px; height: 20px; border: 0 solid #c9a24a; }
.cb-in .cb-c.tl { top: 12px; left: 12px; } .cb-in .cb-c.tr { top: 12px; right: 12px; } .cb-in .cb-c.bl { bottom: 12px; left: 12px; } .cb-in .cb-c.br { bottom: 12px; right: 12px; }
.cb-name { font: 600 11px/1 var(--display); letter-spacing: .22em; white-space: nowrap; text-transform: uppercase; color: #d9b763; }
.cb-emb { width: 64%; height: auto; filter: drop-shadow(0 3px 6px rgba(0,0,0,.6)); }
.cb-realm { font: 600 12px/1 var(--display); letter-spacing: .18em; text-transform: uppercase; color: #2a1d14; background: linear-gradient(#e0c06a, #c9a24a); border: 1px solid #8a6424; border-radius: 3px; padding: 5px 14px; }
.flipper { position: relative; display: grid; place-items: center; }
.flipper > .cardback { position: absolute; top: 0; left: 50%; z-index: 2; transform: translateX(-50%); animation: cb-out .38s ease-in .5s forwards; }
@keyframes cb-out { to { transform: translateX(-50%) perspective(900px) rotateY(90deg) scale(.92); opacity: 0; visibility: hidden; } }
.reveal .flipper > .fc, .flipper > .fc { animation: flip-in .5s cubic-bezier(.3,.9,.4,1) .88s both; }
@keyframes flip-in { from { transform: perspective(900px) rotateY(90deg) scale(.9); opacity: 0; } }
.backgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.backgrid figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.backgrid .cardback { width: 100%; }
.backgrid .cb-in { padding: 18px 8px 14px; box-shadow: inset 0 0 0 5px var(--b2), inset 0 0 0 6px rgba(201,162,74,.6); }
.backgrid .cb-in .cb-c { width: 12px; height: 12px; }
.backgrid .cb-in .cb-c.tl, .backgrid .cb-in .cb-c.tr { top: 8px; } .backgrid .cb-in .cb-c.bl, .backgrid .cb-in .cb-c.br { bottom: 8px; }
.backgrid .cb-in .cb-c.tl, .backgrid .cb-in .cb-c.bl { left: 8px; } .backgrid .cb-in .cb-c.tr, .backgrid .cb-in .cb-c.br { right: 8px; }
.backgrid .cb-name { font-size: 7.5px; letter-spacing: .14em; white-space: nowrap; }
.backgrid .cb-realm { font-size: 9.5px; letter-spacing: .12em; padding: 4px 9px; }
.backgrid figcaption { font: 600 13px/1.2 var(--display); letter-spacing: .06em; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .flipper > .cardback { display: none; } .flipper > .fc { animation: none; } .embers, .sealstage::before { display: none; } .waxseal { animation: none; } }
/* crowns */
.crownicon { display: block; }
img.crownicon { object-fit: contain; }

// ---------- players, names and the Hall of Fame ----------
// Each player claims a unique name, kept in the game's Supabase database (project crown-and-chaos) together with
// their level and the crown they wear. There is no sign-in: the phone keeps a long random secret and the database
// stores only its hash, so only this phone can update this name. The public ladder shows names, levels and crowns.
const NET = { url: "https://ozgqbncvttpdjojkmofj.supabase.co", key: "sb_publishable_xWhSyqHJGEllD26JnKIiMw_E1VyNNjf" };
async function rpc(fn, body) {
  const r = await fetch(`${NET.url}/rest/v1/rpc/${fn}`, { method: "POST", headers: { apikey: NET.key, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const text = await r.text(); let data = null; try { data = text ? JSON.parse(text) : null; } catch (e) {}
  if (!r.ok) { const err = new Error((data && data.message) || `HTTP ${r.status}`); err.code = data && data.message; throw err; }
  return data;
}
const NAME_WORDS = { ok: "Available", length: "Use 3 to 16 characters", characters: "Letters, numbers, spaces, - and _ only, starting and ending with a letter or number", reserved: "That name is reserved", blocked: "Please choose another name", taken: "Already taken", too_many: "Too many names made from this connection today. Try again tomorrow." };

const myName = () => (G.player && G.player.name) || "You";
function newSecret() { const b = new Uint8Array(32); crypto.getRandomValues(b); return Array.from(b, (x) => x.toString(16).padStart(2, "0")).join(""); }
function askName() {
  if (G.player || U.nameLater || U.over || !G.packOpened) return;
  U.over = { type: "name" };
}
function nameHtml() {
  return gothic(`<p class="eyebrow">The Hall of Fame</p><h1 class="blackletter">What are you called?</h1>
    <p>Choose the name other players will see on the level ladder. It must be yours alone.</p>${DIVIDER}
    <label class="namefield"><span>Your name</span><input id="namein" data-name maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false" value="${esc(U.nameDraft || "")}" aria-describedby="namemsg"></label>
    <p class="namemsg" id="namemsg" role="status">${esc(U.nameMsg || "3 to 16 letters or numbers")}</p>
    <div class="btns"><button class="btn gilt" data-act="name-claim" id="nameclaim">Claim this name</button><button class="btn quiet" data-act="name-later">Later</button></div>`, "lv-name");
}
let nameTimer = null;
function onNameInput(v) {
  U.nameDraft = v; clearTimeout(nameTimer);
  const msg = document.getElementById("namemsg"); if (!msg) return;
  msg.className = "namemsg"; msg.textContent = v.trim().length ? "Checking…" : "3 to 16 letters or numbers";
  if (!v.trim().length) return;
  nameTimer = setTimeout(async () => {
    try { const r = await rpc("name_available", { p_name: v }); if (U.nameDraft !== v) return; msg.textContent = NAME_WORDS[r] || r; msg.className = `namemsg ${r === "ok" ? "good" : "bad"}`; }
    catch (e) { msg.textContent = "Can't reach the Hall of Fame right now"; msg.className = "namemsg bad"; }
  }, 350);
}
async function claimName() {
  const v = (U.nameDraft || "").trim(), msg = document.getElementById("namemsg"), btn = document.getElementById("nameclaim");
  if (!v) { if (msg) msg.textContent = "Type a name first"; return; }
  if (btn) btn.disabled = true;
  const secret = G.playerSecret || newSecret();
  try {
    const id = await rpc("claim_name", { p_name: v, p_secret: secret, p_level: myLevel(), p_crown: G.wearing });
    G.player = { id, name: v, level: myLevel(), crown: G.wearing }; G.playerSecret = secret; save();
    U.over = null; U.ladder = null; SND.play("ping"); render();
  } catch (e) {
    const code = String(e.code || e.message || "").replace(/^name_/, "");
    if (msg) { msg.textContent = NAME_WORDS[code] || "Can't reach the Hall of Fame right now. Try again in a moment."; msg.className = "namemsg bad"; }
    if (btn) btn.disabled = false;
  }
}
// Keep the ladder up to date with the player's level and crown. Quietly retries on the next change if offline.
let syncing = false;
async function syncPlayer() {
  const p = G.player; if (!p || syncing) return;
  const L = myLevel(), crown = G.wearing;
  if (p.level === L && p.crown === crown) return;
  syncing = true;
  try { await rpc("update_player", { p_id: p.id, p_secret: G.playerSecret, p_level: L, p_crown: crown }); p.level = L; p.crown = crown; save(); U.ladder = null; }
  catch (e) {} finally { syncing = false; }
}
// Every finished fight is sent to the fights table for playtesting and balancing: the result, both line-ups,
// rounds, the player's level, and whether the computer was going easy. Fights that can't be sent wait on the phone
// (up to 50) and go with the next one.
const BUILD = /*BUILD*/"dev";
const lineupIds = (lu) => ({ crown: lu.crown || null, heroes: (lu.heroes || []).filter(Boolean), front: (lu.front || []).filter(Boolean), items: (lu.items || []).filter(Boolean) });
function logFight(st, w) {
  if (!S.lineups) return;
  const me = lineupIds(S.lineups[0]), foe = lineupIds(S.lineups[1]);
  const renownOfIds = (x) => [x.crown, ...x.heroes].reduce((t, id) => t + (DATA.heroes[id]?.renown || 0), 0) + x.front.reduce((t, id) => t + (DATA.front[id]?.renown || 0), 0) + x.items.reduce((t, id) => t + (DATA.items[id]?.renown || 0), 0);
  G.fightQueue = (G.fightQueue || []).concat([{
    p_level: myLevel(), p_result: w === 0 ? "win" : w === 1 ? "loss" : "draw", p_rounds: st.round, p_easy: !!S.easy, p_kind: S.kind === "tutorial" ? "tutorial" : S.kind === "quest" ? "quest" : "computer",
    p_my_crown: me.crown, p_my_heroes: me.heroes, p_my_front: me.front, p_my_items: me.items, p_my_renown: renownOfIds(me),
    p_foe_crown: foe.crown, p_foe_heroes: foe.heroes, p_foe_front: foe.front, p_foe_items: foe.items, p_foe_renown: renownOfIds(foe),
    p_crown_fell: w === 0 ? "theirs" : w === 1 ? "mine" : "both", p_version: BUILD,
  }]).slice(-50);
  save(); sendFights();
}
let sendingFights = false;
async function sendFights() {
  if (sendingFights || !(G.fightQueue || []).length) return;
  sendingFights = true;
  try {
    while (G.fightQueue.length) {
      const f = G.fightQueue[0];
      await rpc("log_fight", { p_id: G.player ? G.player.id : null, p_secret: G.player ? G.playerSecret : null, ...f });
      G.fightQueue.shift(); save();
    }
  } catch (e) {} finally { sendingFights = false; }
}
async function loadLadder() {
  if (U.ladderLoading) return; U.ladderLoading = true;
  try { await syncPlayer(); U.ladder = await rpc("get_ladder", { p_limit: 100, p_id: G.player ? G.player.id : null }); U.ladderError = false; }
  catch (e) { U.ladderError = true; }
  U.ladderLoading = false; if (U.screen === "hall" || U.screen === "court") render();
}
function ladderRows(rows) {

    <span class="avatar"><span class="avcrown">${crownSvg(r.crown)}</span><span class="avface">${initial(r.username)}</span></span>

// ---------- line-up ----------
const SLOTS = ["crown", "h0", "h1", "f0", "f1", "f2", "i0", "i1", "i2"];
const slotKind = (s) => (s === "crown" || s[0] === "h" ? "hero" : s[0] === "f" ? "front" : "item");
function getSlot(lu, s) { return s === "crown" ? lu.crown : s[0] === "h" ? lu.heroes[+s[1]] : s[0] === "f" ? lu.front[+s[1]] : lu.items[+s[1]]; }
function setSlot(lu, s, id) { if (s === "crown") lu.crown = id; else if (s[0] === "h") lu.heroes[+s[1]] = id; else if (s[0] === "f") lu.front[+s[1]] = id; else lu.items[+s[1]] = id; }
const fielded = (lu) => SLOTS.map((s) => getSlot(lu, s)).filter(Boolean);
const usedIn = (lu, id, except) => SLOTS.filter((s) => s !== except && getSlot(lu, s) === id).length;
const hasKoschei = (lu) => [lu.crown, ...lu.heroes].includes("koschei");
const renownOf = (lu) => SLOTS.reduce((sum, s) => { const id = getSlot(lu, s); return sum + (id && !(s === "f2" && hasKoschei(lu)) ? defOf(id).renown || 0 : 0); }, 0);
function prune() { // drop anything from the line-up you no longer own
  for (const s of SLOTS) { const id = getSlot(G.lineup, s); if (id && usedIn(G.lineup, id, s) + 1 > owned(id) && SLOTS.indexOf(s) >= SLOTS.findIndex((x) => getSlot(G.lineup, x) === id) + owned(id)) setSlot(G.lineup, s, ""); }
  for (const s of SLOTS) { const id = getSlot(G.lineup, s); if (id && usedIn(G.lineup, id) > owned(id)) setSlot(G.lineup, s, ""); }
}
function issues(lu) {
  const out = [], hs = [lu.crown, ...lu.heroes].filter(Boolean), r = renownOf(lu);
  if (!lu.crown) out.push("Choose a hero to wear the Crown.");
  if (r > RENOWN_CAP) out.push(`You are ${r - RENOWN_CAP} Renown over the limit of ${RENOWN_CAP}.`);
  if (hs.includes(PAIR[0]) !== hs.includes(PAIR[1])) out.push("Grendel and Grendel's Mother must be fielded together.");
  return out;
}
function autoFill() {
  const lu = emptyLineup(); let left = RENOWN_CAP;
  const hs = Object.keys(G.heroes).filter((id) => !PAIR.includes(id)).sort((a, b) => (DATA.heroes[b].tale === "St George and the Dragon") - (DATA.heroes[a].tale === "St George and the Dragon") || DATA.heroes[b].renown - DATA.heroes[a].renown);
  const chosen = [];
  for (const id of hs) { if (chosen.length < 3 && DATA.heroes[id].renown <= left - 6 && id !== "baba-yaga") { chosen.push(id); left -= DATA.heroes[id].renown; } }
  chosen.sort((a, b) => DATA.heroes[b].stats.health - DATA.heroes[a].stats.health);
  lu.crown = chosen[0] || ""; lu.heroes = [chosen[1] || "", chosen[2] || ""];
  const counts = { ...G.front };
  for (let k = 0; k < 3; k++) {
    const opts = Object.keys(counts).filter((id) => counts[id] > 0 && DATA.front[id].renown <= left - (2 - k)).sort((a, b) => DATA.front[b].renown - DATA.front[a].renown || Math.random() - 0.5);
    const id = opts[0] || "villager"; lu.front[k] = id; left -= DATA.front[id].renown; if (counts[id]) counts[id]--;
  }
  const ic = { ...G.items }; let k = 0;
  for (const id of Object.keys(ic).sort((a, b) => DATA.items[a].renown - DATA.items[b].renown)) { while (ic[id] > 0 && k < BELT && DATA.items[id].renown <= left) { lu.items[k++] = id; left -= DATA.items[id].renown; ic[id]--; } }
  G.lineup = lu;
}
// A helping hand after a losing run: two defeats in a row up to Level 25, three up to Level 50, four after that.
// The computer then fields a badly built company at the full 50 Renown, until the player wins: a Crown that is
// wasted in the Crown slot (Lancelot above all), weak heroes from realms that share no Bond, passive front-rank
// cards, and careless play. The player is never told. In simulation a struggling player wins about 72% of these,
// against about 43% normally. The lists come from simulation (sim) and may want refreshing after rebalancing.
const EASY = {
  crowns: ["lancelot", "the-minotaur", "the-creature", "the-bride", "sigurd"],
  heroes: ["robin-hood", "king-minos", "victor-frankenstein", "little-john", "st-george", "the-tin-soldier", "red-riding-hood", "zmey-gorynych", "polyphemus", "blodeuwedd", "bran-the-blessed", "loki", "the-wolf", "fafnir"],
  front: ["leshy", "monk", "villager"], noise: 1.2,
};
const lossesForHelp = (L) => (L <= 25 ? 2 : L <= 50 ? 3 : 4);
const easyNext = () => (G.lossStreak || 0) >= lossesForHelp(myLevel());
function awkwardFoe(rng) {
  const crown = DATA.heroes[rng.pick(EASY.crowns.filter((id) => DATA.heroes[id]))];
  const hs = [crown.id], realms = new Set([crown.realm]); let budget = RENOWN_CAP - crown.renown;
  for (const id of rng.shuffle(EASY.heroes.filter((x) => DATA.heroes[x]))) {
    const h = DATA.heroes[id]; if (hs.length >= 3) break;
    if (hs.includes(id) || realms.has(h.realm) || h.renown > budget - 3) continue;
    hs.push(id); realms.add(h.realm); budget -= h.renown;
  }
  const fl = EASY.front.map((id) => DATA.front[id]).filter(Boolean);
  const front = [0, 1, 2].map((k) => { const ok = fl.filter((f) => f.renown <= budget - (2 - k)); const f = ok.length ? rng.pick(ok) : DATA.front.villager; budget -= f.renown; return f.id; });
  const items = [0, 1].map(() => { const ok = Object.values(DATA.items).filter((x) => x.renown <= budget); if (!ok.length) return ""; const x = rng.pick(ok); budget -= x.renown; return x.id; }).filter(Boolean);
  return { crown: hs[0], heroes: hs.slice(1), front, items };
}
function randomFoe(easy = false) {
  const rng = E.makeRng(Date.now() + Math.floor(Math.random() * 1e6));
  if (easy) return awkwardFoe(rng);
  const hs = []; let budget = RENOWN_CAP;
  for (const h of rng.shuffle(Object.values(DATA.heroes))) {
    if (hs.length >= 3) break;
    if (h.renown > budget - 3 || PAIR.includes(h.id) || h.id === "baba-yaga") continue;
    hs.push(h.id); budget -= h.renown;
  }
  const fl = Object.values(DATA.front).filter((f) => f.id !== "the-needle");
  const front = [0, 1, 2].map((k) => { const ok = fl.filter((f) => f.renown <= budget - (2 - k)); const f = ok.length ? rng.pick(ok) : DATA.front.villager; budget -= f.renown; return f.id; });
  const items = [0, 1].map(() => { const ok = Object.values(DATA.items).filter((x) => x.renown <= budget); if (!ok.length) return ""; const x = rng.pick(ok); budget -= x.renown; return x.id; }).filter(Boolean);
  return { crown: hs[0], heroes: hs.slice(1), front, items };
}

function cardShell(o) {
  return `<button class="${o.cls.join(" ")}" ${o.attrs} aria-label="${esc(o.label)}">
    ${o.kind === "hero" ? `<span class="seal" title="Speed">${o.spd}</span>` : o.kind === "front" ? `<span class="seal" title="Speed ${o.spd}. Acts on its own">${o.spd}</span>` : ""}
    ${o.crown ? `<span class="crownmark" title="Wears the Crown">${CROWN_SVG}</span>` : o.count ? `<span class="count">${o.count}</span>` : ""}
    <span class="nm">${esc(short(o.name))}</span>
    <span class="art">${img(o.id, !o.theirs)}${o.overlay || ""}</span>
    <span class="stats">${o.kind === "item" ? `<em>${esc(o.rarity)} item</em>` : `<span class="atk">${o.ranged ? BOW_SVG : SWORD_SVG}${o.atk}</span>
      ${o.guard > 0 ? `<span class="grd" title="Guard"><b>${o.guard}</b></span>` : ""}
      <span class="hp${o.hurt ? " hurt" : ""}" title="Health">${o.hp}</span>`}</span>
    ${o.floats || ""}</button>`;
}
// A card as it is printed, for the line-up and the collection.
function staticCard(id, o = {}) {
  const d = defOf(id), kind = kindOf(id), s = kind === "hero" ? d.stats : d;
  return cardShell({ cls: ["card", kind, ...(o.cls || [])], attrs: o.attrs || "", kind, id, name: d.name, spd: s.speed, crown: o.crown, count: o.count,
    atk: s.attack, ranged: s.ranged, guard: s.guard, hp: s.health, rarity: d.rarity,
    label: `${d.name}${o.crown ? ", wearing the Crown" : ""}${d.renown != null ? `, ${d.renown} Renown` : ""}${o.count ? `, ${o.count}` : ""}` });
}
function battleCard(c, v, opts = {}) {
  const side = c.side, mine = side === 0, g = step();
  const cls = ["card", c.kind === "hero" ? "hero" : "front"];
  const order = S.plan && S.plan.orders.find((o) => o.uid === c.uid);
  let floats = "";
  if (opts.fallen) cls.push("fallen");
  if (S.phase === "play") {
    if (S.acting === c.uid) cls.push("acting");
    const p = S.prev && inSnap(S.prev, c.uid);
    const now = opts.fallen ? { health: 0, guard: 0 } : c;
    if (p && !S.quiet) {
      const d = now.health - p.health;
      if (d < 0) { cls.push("hit"); floats = `<span class="float dmg">−${-d}</span>`; }
      else if (d > 0) floats = `<span class="float heal">+${d}</span>`;
      else if (now.guard < p.guard) floats = `<span class="float blk">Blocked</span>`;
    }
  } else if (S.phase === "plan") {
    if (S.pick) {
      let ok = S.pick.targets.includes(c.uid);
      if (ok && g && g.target) ok = live(g.target[0], g.target[1])?.uid === c.uid;
      cls.push(ok ? "can" : "dim");
    } else if (g) {
      if (Array.isArray(g.focus) && g.focus[0] === side && g.focus[1] === c.slot) cls.push("focus");
      if (g.focus === "front" && mine && c.kind === "front") cls.push("focus");
      if (g.tap != null && mine && g.tap === c.slot) cls.push("focus");
    }
    if (order) cls.push("planned");
  }
  if (c.stopped) cls.push("stopped");
  // A charged attack waiting to go off: the card glows until it strikes.
  if (c.kind === "hero" && byUid(c.uid)?.flags.charge && !opts.fallen) cls.push("charging");
  const crown = v.sides[side].crown === c.uid;
  const mark = S.plan && (S.plan.hunt === c.uid ? "Marked" : S.plan.rumpel === c.uid ? "Named" : "");
  const overlay = order ? `<span class="order">${esc(order.name)}</span>` : c.stopped ? `<span class="badge">Stopped</span>` : mark ? `<span class="badge">${mark}</span>`
    : S.phase === "play" && S.acting === c.uid && c.kind !== "hero" ? `<span class="order">On its own</span>`
    : S.phase === "plan" && c.kind === "hero" && byUid(c.uid) && E.isCharging(S.st, byUid(c.uid)) ? `<span class="badge">Charging</span>`
    : c.poison ? `<span class="badge">Poison ${c.poison}</span>` : "";
  return cardShell({ cls, attrs: `data-act="card" data-uid="${c.uid}" data-side="${side}" data-slot="${c.slot}"`, kind: c.kind === "hero" ? "hero" : "front", id: c.id, name: c.name, spd: c.spd, crown, theirs: !mine,
    atk: c.atk, ranged: c.ranged, guard: c.guard, hp: opts.fallen ? 0 : c.health, hurt: c.health < c.maxHealth, overlay, floats,
    label: `${mine ? "Your" : "Enemy"} ${c.name}${crown ? ", wearing the Crown" : ""}: ${c.health} of ${c.maxHealth} Health, Attack ${c.atk}, Guard ${c.guard}, Speed ${c.spd}${c.kind === "hero" ? "" : ", acts on its own"}` });
}
// The wooden horse: an enemy Odysseus Crown hides his side's other cards in round 1.
function hiddenCard(c) {
  const ok = S.phase === "plan" && S.pick && S.pick.targets.includes(c.uid);
  return `<div class="card hidden${ok ? " can" : S.pick ? " dim" : ""}" data-act="card" data-uid="${c.uid}" data-side="${c.side}" data-slot="${c.slot}" aria-label="${c.blind ? "A hidden enemy" : "A hidden enemy card (the wooden horse)"}"><span>?</span></div>`;
}
// Hidden while round 1 is being planned; the cards show themselves as the round plays out.
const hiddenNow = (v, c) => c.side === 1 && (c.blind || (S.phase === "plan" && E.isHidden(S.st, byUid(c.uid))));
function slotHtml(v, side, slot) {
  const c = v.sides[side].slots[slot];
  if (c && hiddenNow(v, c)) return hiddenCard(c);
  if (c) return battleCard(c, v);
  const gone = S.phase === "play" && S.prev && S.prev.sides[side].slots[slot];
  if (gone && !inSnap(v, gone.uid)) return battleCard(gone, S.prev, { fallen: true });
  return `<div class="card slot" aria-hidden="true" data-side="${side}" data-slot="${slot}"></div>`;
}

// A hero's extra rules (for example Blodeuwedd's Owl at dusk). "Name: text" shows the name as the label.
function ruleParts(r) {
  const m = /^([A-Z][^:.]{1,28}):\s+(.*)$/.exec(r);
  return m ? { name: m[1], text: m[2][0].toUpperCase() + m[2].slice(1) } : { name: "Rule", text: r };
}
// The full card, as it is printed: used when a pack is opened and in the collection.
function fullCard(id, o = {}) {
  const d = defOf(id), kind = kindOf(id), a = artInfo(id, true, o.key), v = o.key && variantOf(o.key);
  const pips = (n) => '<i class="pip on"></i>'.repeat(n);
  let body = "", foot = "";
  if (kind === "hero") {
    body = `<span class="ty">${esc(d.aspect)}${d.stats.ranged ? " · Ranged" : ""}</span>
      <span class="cr"><b>Crown passive</b><br>${esc(d.crownPassive.text)}</span>
      <span><b>Bond</b><br>${esc(d.bond.text)}</span>
      ${(d.rules || []).map((r) => { const x = ruleParts(r); return `<span class="ru"><b>${esc(x.name)}</b><br>${esc(x.text)}</span>`; }).join("")}
      ${d.actions.map((x) => `<span class="a"><b>${esc(x.name)}</b> ${pips(x.ap)}${x.usesPerFight ? ` <i>${x.usesPerFight === 1 ? "once" : x.usesPerFight + " times"} a fight</i>` : ""}<br>${esc(x.text)}</span>`).join("")}`;
    foot = `<span>Attack ${d.stats.attack}</span><span>Guard ${d.stats.guard}</span><span>Health ${d.stats.health}</span>`;
  } else if (kind === "front") {
    body = `<span class="ty">Front rank · acts on its own every round, at Speed ${d.speed}</span><span>${esc(d.auto)}</span><span class="ty">Used up if it dies in a fight.</span>`;
    foot = `<span>Attack ${d.attack}</span><span>Guard ${d.guard}</span><span>Health ${d.health}</span>`;
  } else {
    body = `<span class="ty">${esc(d.rarity)} item · single use</span><span>${esc(d.effect)}</span><span class="ty">Costs 1 action point and acts before any card.</span>`;
    foot = `<span>${esc(d.realm || "")}</span>`;
  }
  return `<div class="fc ${kind}">
    <div class="fc-top">${kind === "hero" ? `<span class="s" title="Speed">${d.stats.speed}</span>` : kind === "front" ? `<span class="s" title="Speed">${d.speed}</span>` : ""}<b>${esc(d.name)}</b>${d.renown != null ? `<span class="r" title="Renown">${d.renown}</span>` : ""}</div>
    <div class="fc-art">${img(id, true, o.key)}</div>
    ${v ? `<div class="fc-plaque">Variant artwork · ${esc(short(d.name))} ${v.n}</div>` : kind === "hero" ? `<div class="fc-plaque">${esc(d.tale)} · ${esc(d.realm)}</div>` : d.tale ? `<div class="fc-plaque">${esc(d.tale)}</div>` : ""}
    <div class="fc-body">${body}</div>
    <div class="fc-foot">${foot}<i>${a ? `${esc(a.artist)}<br>${esc(a.date)}` : ""}</i></div></div>`;
}

// Drawing: the battle
// =====================================================================================
function renderBattle() {
  const v = S.view, g = step(), b = S.board, noNight = !!S.st.noNight, night = !noNight && v.round >= E.NIGHTFALL_ROUND;
  el("head").innerHTML = `<button class="round${g && g.focus === "night" ? " focus" : ""}" data-act="night" aria-label="Round ${v.round}. ${noNight ? `A quest: no nightfall, and the fight ends as a draw after round ${S.st.maxRounds}` : night ? "It is night" : `Night falls in round ${E.NIGHTFALL_ROUND}`}. Read about Nightfall">Round ${v.round}<i class="${night ? "now" : ""}">${noNight ? `No nightfall · ends after round ${S.st.maxRounds}` : night ? "Night: no healing ⓘ" : `Night falls in round ${E.NIGHTFALL_ROUND} ⓘ`}</i></button>
    <span class="place"><b>${esc(b.name)}</b><i>${esc(b.artist)}, ${esc(b.title)}, ${esc(b.date)}</i></span>
    <span class="wear" title="Your crown: ${esc(crownById[G.wearing]?.name || "Gold Crown")}">${crownSvg(G.wearing, `You wear the ${crownById[G.wearing]?.name || "Gold Crown"}`)}</span><button class="menu" data-act="menu">Menu</button>`;
  const table = el("table");
  table.style.backgroundImage = `url(img/${b.id}.jpg)`;
  table.classList.toggle("night", night); table.classList.toggle("fx-night", night);
  const sideHtml = (i) => `<section class="side ${i ? "foe" : "me"}" aria-label="${i ? "Enemy cards" : "Your cards"}">
    ${[[1], [2, 3], [4, 5, 6]].map((r) => `<div class="rank">${r.map((s) => slotHtml(v, i, s)).join("")}</div>`).join("")}</section>`;
  el("board").innerHTML = `${sideHtml(1)}<div class="mid"></div>${sideHtml(0)}`;
  const fate = el("fate");
  fate.className = (v.fate === 0 ? "mine" : "theirs") + (g && g.focus === "fate" ? " focus" : "");
  fate.lastElementChild.textContent = v.fate === 0 ? "Yours" : "Theirs";
  fate.setAttribute("aria-label", `Fate token: ${v.fate === 0 ? "on your side" : "on the enemy's side"} this round`);

  const ap = S.phase === "plan" ? apLeft() : v.sides[0].ap, total = Math.max(S.st.sides[0].ap, ap);
  let who = "", text = "", chips = "", button = "";
  if (S.phase === "play") {
    const f = S.frames[S.fi];
    who = `Round ${f?.prev.round ?? v.round}${f && f.auto ? " · Front rank, acting on its own" : ""}`; text = esc(S.caption);
    button = `${soundButton()}<button class="btn quiet" data-act="speed" aria-pressed="${!!G.fast}" title="Playback speed" aria-label="Playback speed ${G.fast ? "fast" : "normal"}">${G.fast ? "×2" : "×1"}</button><button class="btn quiet" data-act="skip">Skip</button>`;
  } else if (g) {
    who = "Tutorial"; text = g.say;
    if (g.next) button = `<button class="btn focus" data-act="next">Continue</button>`;
    else button = `<button class="btn${g.lock ? " focus" : ""}" data-act="lock"${g.lock ? "" : " disabled"}>Lock in</button>`;
  } else if (S.phase === "plan") {
    who = S.foeName ? `Your plan · against ${esc(S.foeName)}` : "Your plan";
    const dusk = noNight ? "" : v.round === E.NIGHTFALL_ROUND - 1 ? " Night falls next round: healing stops and every card starts taking damage." : night ? ` It is night: nothing heals, and every card takes ${v.round - E.NIGHTFALL_ROUND + 2} damage when the next round starts.` : "";
    const mkNow = markInfo();
    text = S.pick && S.pick.kind === "mark" ? esc(mkNow ? mkNow.pick : "")
      : S.pick ? `Choose a target for ${esc(S.pick.name2 || S.pick.name)}.`
      : (ap > 0 ? (S.plan.orders.length || S.plan.items.length ? "Give another order, or lock in." : "Tap one of your heroes to give it an order. Tap any card to read it.") : "No action points left. Lock in your plan.") + dusk;
    const mk = mkNow, arr = [];
    if (mk && mk.cards.length && !S.pick) {
      const chosen = S.plan[mk.key];
      arr.push(`<span class="chip crowned">${CROWN_SVG}<button data-act="mark" class="ml">${esc(mk.label)}: ${chosen ? esc(short(byUid(chosen).name)) : "nobody"}</button>${chosen ? `<button data-act="unmark" aria-label="Clear ${esc(mk.name)}">×</button>` : ""}</span>`);
      if (!chosen && !S.plan.orders.length && !S.plan.items.length) text = `Give your heroes orders. ${esc(mk.who)}'s Crown also gives a free choice: tap ${esc(mk.label)} below.`;
    }
    S.plan.items.forEach((it, k) => arr.push(`<span class="chip">${esc(it.name)}${it.tname ? ` → ${esc(short(it.tname))}` : ""}<button data-act="del-item" data-k="${k}" aria-label="Remove ${esc(it.name)}">×</button></span>`));
    S.plan.orders.forEach((o, k) => arr.push(`<span class="chip">${esc(short(byUid(o.uid).name))}: ${esc(o.name)}${o.tname ? ` → ${esc(short(o.tname))}` : ""}<button data-act="del-order" data-k="${k}" aria-label="Remove ${esc(o.name)}">×</button></span>`));
    chips = arr.join("");
    button = S.pick ? `<button class="btn quiet" data-act="cancel">Cancel</button>` : `<button class="btn" data-act="lock">Lock in</button>`;
  }
  const used = S.plan ? S.plan.items.map((x) => x.id) : [];
  const belt = v.sides[0].items.filter((id) => { const k = used.indexOf(id); if (k >= 0) { used.splice(k, 1); return false; } return true; });
  const pips = Array.from({ length: total }, (_, k) => `<i class="pip${k < ap ? " on" : ""}"></i>`).join("");
  el("dock").innerHTML = `<div class="coach${S.nudge ? " nudge" : ""}" aria-live="polite"><span class="who">${who}</span><p>${text}</p>${chips ? `<div class="chips">${chips}</div>` : ""}</div>
    <div class="ctl"><div class="ap" role="img" aria-label="${ap} of ${total} action points left"><span>${ph("AP", "Action points")}</span>${pips}</div>
      <div class="belt">${(S.phase === "play" ? [] : belt).map((id) => `<button class="item${belt.length === 1 ? " solo" : ""}${g && g.item === id ? " focus" : ""}" data-act="item" data-id="${id}"${S.phase !== "plan" ? " disabled" : ""} aria-label="${esc(DATA.items[id].name)}">${img(id)}<span>${esc(DATA.items[id].name)}</span></button>`).join("")}</div>
      <span class="grow"></span>${button}</div>`;
  S.nudge = false;
}

// "Once a fight", unless the action's own text already says so; and how many uses are left once some are spent.
function usesNote(a, c) {
  if (!a.usesPerFight) return "";
  const used = c.uses[a.name] || 0, said = /per fight|a fight/i.test(a.text);
  if (used >= a.usesPerFight) return "";
  if (used) return ` ${a.usesPerFight - used} use${a.usesPerFight - used === 1 ? "" : "s"} left.`;
  return said ? "" : ` ${a.usesPerFight === 1 ? "Once" : a.usesPerFight + " times"} a fight.`;
}
function cardSheet(sh) {
  const c = byUid(sh.uid), st = S.st, g = step();
  if (c && c.side === 1 && E.isBlind(st, c)) return `<h2>A hidden enemy</h2><p class="rule">You can't see who this is, and you can't target it. It shows itself the first time it acts against one of your cards${st.sides[1].revealRound ? `, and every hidden enemy shows itself at the start of round ${st.sides[1].revealRound}` : ""}.</p>`;
  if (c && c.side === 1 && E.isHidden(st, c)) return `<h2>A hidden card</h2><p class="rule">The enemy's Odysseus wears the Crown. The wooden horse hides his side's other cards until round 2.</p>`;
  const hero = c.kind === "hero", def = hero ? DATA.heroes[c.id] : DATA.front[c.id] || {};
  const mine = c.side === 0, crown = E.crownCard(st, c.side)?.uid === c.uid;
  const ordered = S.plan.orders.find((o) => o.uid === c.uid);
  let acts = "";
  if (hero && mine && S.phase === "plan" && !c.dead) {
    if (ordered) acts = `<p class="rule off">Already ordered this round: ${esc(ordered.name)}. Remove it from your plan to choose again.</p>`;
    else {
      const ap = apLeft(), opts = E.options(st, c);
      acts = `<div class="acts">${c.actions.map((a, k) => {
        const o = opts.find((x) => x.index === k);
        const spent = a.usesPerFight && (c.uses[a.name] || 0) >= a.usesPerFight;
        const stopBlocked = !o && (a.name === "Girdle Leash" || E.STOPPERS.includes(a.name)) && E.heroes(st, 1).some((h) => !E.canBeStopped(st, h));
        const cost = E.apCost(st, c, a);
        const why = E.isCharging(st, c) ? `Charging: ${esc(c.flags.charge.name)} strikes this round` : spent ? "Used up for this fight" : stopBlocked ? "A card stopped last round can't be stopped again" : !o ? "No target in reach" : cost > ap ? "Not enough action points" : "";
        const want = g && g.action === a.name, off = why || (g && !want);
        return `<button class="act${want ? " focus" : ""}" data-act="action" data-k="${k}"${off ? " disabled" : ""}>
          <strong>${esc(a.name)}</strong><span class="cost" aria-label="${cost} action point${cost === 1 ? "" : "s"}">${'<i class="pip on"></i>'.repeat(cost)}</span>
          <small>${cost > a.ap ? "Royal decree: costs 1 more this round. " : ""}${esc(a.text)}${usesNote(a, c)}${why ? ` (${why}.)` : ""}</small></button>`;
      }).join("")}</div>`;
    }
  }
  // Every other hero (the enemy's, or yours outside planning): what it can do, read-only, so you can plan around it.
  else if (hero && !c.dead) {
    const opts = E.options(st, c), sideAp = st.sides[c.side].ap;
    acts = `<p class="rowlabel" style="margin:2px 0 0">${mine ? "Its actions" : `What it can do · the enemy has ${sideAp} action point${sideAp === 1 ? "" : "s"} this round`}</p>
      <div class="acts">${c.actions.map((a, k) => {
        const spent = a.usesPerFight && (c.uses[a.name] || 0) >= a.usesPerFight;
        const reach = opts.some((x) => x.index === k), cost = E.apCost(st, c, a);
        const note = E.isCharging(st, c) ? `Charging: ${esc(c.flags.charge.name)} strikes this round` : spent ? "Used up for this fight" : !reach ? "Nothing in reach right now" : "";
        return `<div class="act info${note ? " off" : ""}">
          <strong>${esc(a.name)}</strong><span class="cost" aria-label="${cost} action point${cost === 1 ? "" : "s"}">${'<i class="pip on"></i>'.repeat(cost)}</span>
          <small>${esc(a.text)}${usesNote(a, c)}${note ? ` (${note}.)` : ""}</small></div>`;
      }).join("")}</div>`;
  }
  const mk0 = mine && crown && S.phase === "plan" && !g ? markInfo() : null;
  const mineMark = mk0 && mk0.uid === c.uid ? mk0 : null;
  const rules = hero
    ? `${mineMark ? "" : `<p class="rule${crown ? "" : " off"}"><b>Crown passive · ${crown ? "active" : "only while wearing the Crown"}</b>${esc(def.crownPassive?.text)}</p>`}
       <p class="rule"><b>Bond · works in any slot</b>${esc(def.bond?.text || "None")}</p>
       ${(def.rules || []).map((r) => { const x = ruleParts(r); return `<p class="rule"><b>${esc(x.name)}</b>${esc(x.text)}</p>`; }).join("")}`
    : `<p class="rule"><b>Front rank · acts on its own every round, at Speed ${E.speedOf(st, c)}</b>${esc(c.auto || "")}</p>`;
  return `<div class="sheet" role="dialog" aria-label="${esc(c.name)}">
    ${g && g.action ? `<p class="hint">${g.say}</p>` : ""}
    <div class="top">${ART[c.id] ? `<img class="pic" src="${artSrc(c.id, mine)}" alt="">` : ""}
      <div><h2>${esc(c.name)}</h2>
        <p class="kind">${mine ? "Yours" : "Enemy"} · ${hero ? `${esc(def.aspect)} of ${esc(def.realm)}${c.ranged ? " · ranged" : ""}` : "front rank"}</p>
        <p class="nums"><span>Health <b>${c.health}/${c.maxHealth}</b></span><span>Attack <b>${E.attackOf(st, c)}</b></span><span>Guard <b>${E.guardOf(st, c)}</b></span>${hero ? `<span>Speed <b>${E.speedOf(st, c)}</b></span>` : ""}</p>
        <p class="credit">${creditOf(c.id, mine)}</p></div>
      ${g ? "" : `<button class="x" data-act="close" aria-label="Close">×</button>`}</div>
    ${mineMark ? markBox(mineMark) : ""}${acts}${rules}</div>`;
}
function itemSheet(sh) {
  const d = DATA.items[sh.id], g = step(), inFight = U.screen === "battle";
  const why = inFight && S.phase === "plan" ? itemBlock(sh.id) : "";
  return `<div class="sheet" role="dialog" aria-label="${esc(d.name)}">
    ${g && g.useItem ? `<p class="hint">${g.say}</p>` : ""}
    <div class="top"><img class="pic" src="img/${sh.id}.jpg" alt="">
      <div><h2>${esc(d.name)}</h2><p class="kind">${esc(d.rarity)} item · single use</p><p class="credit">${creditOf(sh.id)}</p></div>
      ${g ? "" : `<button class="x" data-act="close" aria-label="Close">×</button>`}</div>
    <p class="rule"><b>What it does</b>${esc(d.effect)}</p>
    <p class="rule off">${inFight && E.itemCost(S.st, 0) ? `Costs ${E.itemCost(S.st, 0)} action point here, because of the enemy Crown.` : "Free to use: no action points."} Items act before any card, and you can use one a round. Once used, it is gone.</p>
    ${inFight && S.phase === "plan" ? `<button class="btn big${g && g.useItem ? " focus" : ""}" data-act="use-item"${why ? " disabled" : ""}>Use ${esc(d.name)}</button>${why ? `<p class="rule off">${why}.</p>` : ""}` : ""}</div>`;
}
