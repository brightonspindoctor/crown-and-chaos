  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.tab) { U.tab = t.dataset.tab; U.kept = null; return render(); }
  const act = t.dataset.act, d = t.dataset;
  switch (act) {
    case "card": tapCard(+d.uid); break;
    case "action": chooseAction(+d.k); break;
    case "item": tapItem(d.id); break;
    case "use-item": useItem(); break;
    case "target": completePick(+d.uid); render(); break;
    case "mark": { const m = markInfo(); U.sheet = null; beginPick({ kind: "mark", key: m.key, name: m.name }, m.cards); render(); break; }
    case "unmark": { const m = markInfo(); if (m) S.plan[m.key] = null; render(); break; }
    case "lock": lock(); break;
    case "next": { const g = step(); if (g && g.next) { advance(); render(); } break; }
    case "skip": endPlayback(); break;
    case "speed": G.fast = !G.fast; save(); if (!S.animating) { clearTimeout(S.timer); S.timer = setTimeout(nextFrame, 250); } render(); break;
    case "sound": SND.setMuted(!SND.muted); if (!SND.muted) SND.play("ping"); render(); break;
    case "motion": G.motion = G.motion === false; save(); render(); break;
    case "night": if (!step() && !S.pick) { U.sheet = { type: "night" }; render(); } break;
    case "night-ok": G.nightSeen = true; save(); U.over = null; render(); break;
    case "close": U.sheet = null; render(); break;
    case "close-detail": U.sheet = U.sheet.back || null; render(); break;
    case "cancel": S.pick = null; render(); break;
    case "del-order": S.plan.orders.splice(+d.k, 1); render(); break;
    case "del-item": S.plan.items.splice(+d.k, 1); render(); break;
    case "menu": if (S.phase === "play") endPlayback(); if (S.phase !== "over") { U.over = { type: "menu" }; render(); } break;
    case "resume": U.over = null; render(); break;
    case "concede": U.over = null; concede(); break;
    case "close-over": U.over = null; checkLevel(); render(); break;
    case "quest-new": newQuest(); break;
    case "quest-go": U.over = null; questFight(); break;
    case "quest-cancel": delete G.quest; U.over = null; save(); render(); break;
    case "quest-resume": U.over = { type: G.quest && G.quest.began ? "quest-between" : "quest-intro" }; render(); break;
    case "quest-abandon": delete G.quest; U.over = null; U.screen = "home"; save(); render(); break;
    case "leave": go("home"); break;
    case "tutorial": startTutorial(); break;
    case "after-tutorial": G.tutorialDone = true; save(); go(G.packOpened ? "home" : "ready"); break;
    case "open-first": G.packOpened = true; G.tutorialDone = true; G.gold += START_GOLD; U.over = null;
      openPack(firstPack(), { title: "Your first Fable pack", first: true }); render(); break;
    case "pack-next": U.pack.i += 1; U.pack.up = false; render(); break;
    case "pack-rip": if (!TEAR.noClick) ripPack(); break;
    case "pack-flip": if (U.pack && !U.pack.up) { U.pack.up = true; SND.play("flipcard"); render(); } break;
    case "pack-all": U.pack.i = (U.pack.show || U.pack.cards).length; render(); break;
    case "detail": U.sheet = { type: "detail", id: d.id, back: U.sheet && U.sheet.type === "picker" ? U.sheet : null }; render(); break;
    case "slot": U.sheet = { type: "picker", slot: d.slot }; render(); break;
    case "choose": chooseForSlot(d.id); break;
    case "tip": G.tip += 1; save(); render(); break;
    case "autofill": autoFill(); save(); render(); break;
    case "clear": G.lineup = emptyLineup(); save(); render(); break;
    case "fight": U.over = null; startFight(); break;
    case "fight-anyway": U.over = null; startFight(true); break;
    case "buy": buy(d.id); break;
    case "set-sound": SND.setMuted(!SND.muted); if (!SND.muted) SND.play("ping"); render(); break;
    case "set-music": SND.setMusic(!SND.music); render(); break;
    case "set-fast": G.fast = !G.fast; save(); render(); break;
    case "admin-all": PREFS.write("adminAll", !adminAll()); render(); break;
    case "lv-wear": if (G.ownCrowns.includes(d.id)) { G.wearing = d.id; save(); SND.play("ping"); syncPlayer(); } // falls through to the next step
    case "lv-next": { const o = U.over; if (o && o.type === "levelup" && o.i < o.steps.length - 1) o.i += 1; else { U.over = null; if (G.goldenPacks > 0) openGolden(); } render(); break; }
    case "open-golden": U.over = null; openGolden(); render(); break;
    case "court-crowns": U.tab = "crown"; go("collection"); break;
    case "buy-crown": { const c = crownById[d.id]; if (c && c.price && G.gold >= c.price && !G.ownCrowns.includes(c.id)) { spend(c.price); G.ownCrowns.push(c.id); save(); checkLevel(); render(); } break; }
    case "lore": U.sheet = { type: "lore", id: d.id }; render(); break;
    case "wear-crown": if (G.ownCrowns.includes(d.id)) { G.wearing = d.id; save(); syncPlayer(); } U.sheet = null; render(); break;
    case "name-open": U.nameLater = false; U.over = { type: "name" }; render(); setTimeout(() => document.getElementById("namein")?.focus(), 50); break;
    case "name-later": U.nameLater = true; U.over = null; render(); break;
    case "name-claim": claimName(); break;
    case "ladder-retry": U.ladderError = false; U.ladder = null; render(); break;
    case "wear-art": if (!d.key || G.variants.includes(d.key)) { if (d.key) G.art[d.card] = d.key; else delete G.art[d.card]; save(); } render(); break;
    case "lib-tab": U.tab = d.tab2; U.sheet = null; U.kept = null; render(); break;
    case "buy-pack": if (G.gold >= PRICES.pack) { spend(PRICES.pack); openPack(fablePack(), { title: "Fable pack" }); render(); } break;
    case "reset": if (U.confirmReset) { G = fresh(); save(); U.confirmReset = false; go("home"); } else { U.confirmReset = true; render(); } break;
  }
});
document.addEventListener("input", (e) => {
  if (e.target.dataset && e.target.dataset.name != null) { onNameInput(e.target.value); return; }
  const k = e.target.dataset && e.target.dataset.vol; if (!k) return;
  const v = +e.target.value / 100;
  if (k === "sfx") { SND.setVolume(v); SND.play("tick"); } else SND.setMusicVolume(v);
});
document.addEventListener("change", (e) => { if (e.target.dataset.filter != null) { U.realm = e.target.value; render(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "namein") { e.preventDefault(); claimName(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && U.sheet && !step()) { U.sheet = U.sheet.back || null; render(); } });
if (G.tutorialDone && !G.packOpened) U.screen = "ready";
try { const q = new URLSearchParams(location.search); if (q.has("admin")) PREFS.write("admin", q.get("admin") !== "0"); } catch (e) {}
document.addEventListener("pointerdown", () => SND.startMusic(), { once: true });
abandonedFight();
if (!U.over) checkLevel();
askName();
syncPlayer();
sendFights();
render();
</script>

// Installable web app: register the service worker when the game is served from its own site (not inside a preview).
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
