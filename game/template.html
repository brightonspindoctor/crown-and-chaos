<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crown & Fable: Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Crown & Fable playable prototype. Colours and type come from the Crown & Fable design system (Gallery theme).
   Battle on a phone: enemy pyramid on top, yours below. On desktop: yours on the left, the enemy's on the right. */
:root {
  --surface: #17110c; --raised: #221912; --ink: #efe4cc; --muted: #b9a68c; --line: #3a2c20;
  --gold-text: #d9b763; --gold-leaf: #c9a24a; --gold-shade: #8a6424;
  --ultramarine: #1f3a6e; --umber: #4a3222; --oxblood: #6e2a22; --vermilion: #b5381f; --verdigris: #2f5f51;
  --paper: #efe4cc; --card-ink: #2a1d14; --card-muted: #5e4a39;
  --display: Cinzel, "Trajan Pro", Georgia, serif;
  --serif: "EB Garamond", Garamond, Georgia, serif;
  --head: 40px; --dock: 160px;
  --ch: clamp(62px, calc((100dvh - var(--head) - var(--dock) - 62px) / 6), 132px);
  --cw: min(calc((100vw - 28px) / 3.25), calc(var(--ch) * 1.12));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--surface); color: var(--ink); font: 16px/1.3 var(--serif); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold-text); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
.dt { display: none; }
[hidden] { display: none !important; }
#app { height: 100dvh; position: relative; }
#battle { height: 100%; display: flex; flex-direction: column; }

/* ---------- battle header ---------- */
#head { height: var(--head); flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
#head .round { text-align: left; font: 600 12px/1.15 var(--display); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; white-space: nowrap; display: flex; flex-direction: column; }
#head .round i { font: italic 400 11.5px/1.1 var(--serif); letter-spacing: 0; text-transform: none; color: var(--muted); }
#head .round i.now { color: #a9bfe6; }
#head .place { text-align: center; min-width: 0; }
#head .place b { display: block; font: 600 13px/1.15 var(--display); letter-spacing: .1em; color: var(--gold-text); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#head .place i { display: block; font-size: 11px; line-height: 1.1; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#head .round.focus { animation: glow 1.1s ease-in-out infinite alternate; border-radius: 4px; padding: 2px 4px; }
#head .menu { font: 600 11px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 10px 0 10px 10px; white-space: nowrap; }
#head .menu:hover { color: var(--ink); }

/* ---------- animation layer (play/fx.css), with this page's names for the colours it uses ---------- */
:root { --gold: var(--gold-leaf); --body: var(--serif); --felt: var(--surface); --panel: var(--raised); --red: var(--vermilion); }
/*FXCSS*/
.mid.fx-phase { justify-content: center; height: 10px; font: italic 13px/1 var(--serif); color: var(--ink); white-space: nowrap; text-shadow: 0 1px 3px #000; }
.mid.fx-phase::before { display: none; }
#table.fx-night::before { background: linear-gradient(rgba(8,12,30,.84), rgba(6,8,20,.92)); }
.card.slot.fx-revived { border: 1px solid var(--gold-leaf); background: #1c130c; color: var(--ink); align-items: center; justify-content: center; font: 600 .8em/1.2 var(--display); text-align: center; }

/* ---------- the table ---------- */
#table { flex: 1; min-height: 0; position: relative; background: #0c0805 center / cover no-repeat; }
#table::before { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(23,17,12,.72), rgba(23,17,12,.82)); transition: background 1.2s; }
#table.night::before { background: linear-gradient(rgba(8,12,30,.84), rgba(6,8,20,.92)); }
#board { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.side { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.side.me { flex-direction: column-reverse; }
.rank { display: flex; gap: 6px; justify-content: center; }
.mid { height: 10px; width: 100%; display: flex; align-items: center; }
.mid::before { content: ""; flex: 1; border-top: 1px dashed rgba(201,162,74,.45); margin: 0 10px; }
/* The Fate token sits on the side of whoever holds it, and crosses the board when it changes hands. */
#fate { position: absolute; z-index: 6; left: 8px; top: 8px; width: 70px; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: top .9s cubic-bezier(.5,0,.3,1), left .9s cubic-bezier(.5,0,.3,1); pointer-events: none; }
#fate.mine { top: calc(100% - 68px); }
#fate b { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 700 9px/1 var(--display); letter-spacing: .04em; color: #2a1d14;
  background: radial-gradient(circle at 35% 30%, #f1dc9a, var(--gold-leaf) 55%, var(--gold-shade)); box-shadow: 0 1px 5px rgba(0,0,0,.7); }
#fate i { font-size: 12px; line-height: 1; color: var(--ink); text-shadow: 0 1px 3px #000; white-space: nowrap; }
#fate.focus b { animation: glow 1.1s ease-in-out infinite alternate; }

/* ---------- small cards (board, line-up, collection) ---------- */
.card { position: relative; width: var(--cw); height: var(--ch); flex: none; display: flex; flex-direction: column; gap: calc(var(--cw) * .03);
  padding: calc(var(--cw) * .045); border-radius: calc(var(--cw) * .08); font-size: calc(var(--cw) * .118); text-align: left;
  background: #2a1c12; border: max(2px, calc(var(--cw) * .028)) solid #5d4330; box-shadow: 0 2px 8px rgba(20,13,8,.55); transition: transform .18s, opacity .25s, filter .25s; }
.card.hero { background: #1c130c; border-color: var(--gold-leaf); box-shadow: inset 0 0 0 1px var(--gold-shade), 0 2px 8px rgba(20,13,8,.55); }
.card.item { background: #24120e; border-color: #8a3a2e; }
.card.slot { background: none; border: 1px dashed rgba(185,166,140,.2); box-shadow: none; cursor: default; }
.card.slot.pick { cursor: pointer; border-color: rgba(217,183,99,.55); background: rgba(23,17,12,.5); align-items: center; justify-content: center; gap: 2px; color: var(--muted); font: 600 .8em/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; text-align: center; }
.card.slot.pick b { font-size: 1.9em; line-height: 1; color: var(--gold-text); font-weight: 500; }
.card.slot.off { opacity: .5; cursor: default; }
.nm { font: 600 .82em/1.25 var(--display); letter-spacing: .03em; text-align: center; white-space: nowrap; overflow: hidden; border-radius: 2px; background: var(--umber); padding: 0 .15em; flex: none; text-transform: uppercase; }
.hero .nm { background: var(--ultramarine); } .item .nm { background: var(--oxblood); }
.art { flex: 1; min-height: 0; overflow: hidden; border-radius: 2px; position: relative; background: #0c0805; }
.art img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
.stats { flex: none; display: flex; align-items: center; gap: .35em; font: 700 1.05em/1 var(--display); height: 1.35em; }
.stats svg { width: .95em; height: .95em; flex: none; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.stats em { font: italic 400 .8em/1 var(--serif); color: var(--muted); white-space: nowrap; }
.atk { display: flex; align-items: center; gap: .2em; }
.grd { width: 1.15em; height: 1.15em; transform: rotate(45deg); background: #35507f; border: 1px solid #9fb3d6; display: grid; place-items: center; margin-left: .25em; }
.grd b { transform: rotate(-45deg); font-size: .78em; }
.hp { margin-left: auto; min-width: 1.75em; text-align: center; padding: .16em .2em .5em; margin-bottom: -.32em; background: #8f2a16; clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%); }
.hp.hurt { color: #ffd9c9; }
.seal, .crownmark, .count { position: absolute; top: -.5em; width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center; z-index: 2; box-shadow: 0 1px 3px rgba(0,0,0,.6); }
.seal { left: -.5em; background: var(--vermilion); border: 1px solid #e9b9a6; font: 700 .9em/1 var(--display); }
.crownmark { right: -.5em; background: #1c130c; border: 1px solid var(--gold-leaf); }
.crownmark svg { width: 1.05em; height: 1.05em; fill: var(--gold-leaf); }
.count { right: -.5em; width: auto; min-width: 1.6em; padding: 0 .3em; border-radius: 1em; background: var(--surface); border: 1px solid var(--muted); font: 700 .85em/1 var(--display); }
.coin { position: absolute; right: .25em; bottom: .25em; min-width: 1.7em; height: 1.7em; padding: 0 .2em; border-radius: 50%; display: grid; place-items: center; font: 700 .85em/1 var(--display); color: #2a1d14;
  background: radial-gradient(circle at 35% 30%, #f1dc9a, var(--gold-leaf) 60%, var(--gold-shade)); box-shadow: 0 1px 3px rgba(0,0,0,.6); }
.order, .badge { position: absolute; left: 0; right: 0; bottom: 0; font: 600 .78em/1.5 var(--display); letter-spacing: .03em; text-align: center; white-space: nowrap; overflow: hidden; background: rgba(47,95,81,.94); }
.badge { background: rgba(110,42,34,.94); }
.card.focus, .card.can { animation: glow 1.1s ease-in-out infinite alternate; z-index: 3; }
.card.dim { opacity: .5; }
.card.acting { transform: scale(1.07); z-index: 4; box-shadow: 0 0 0 2px #f1dc9a, 0 10px 24px rgba(20,13,8,.7); }
.card.hit { animation: shake .4s; }
.card.fallen { opacity: .28; filter: grayscale(1); }
.card.stopped { filter: saturate(.4) brightness(.8); }
.float { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); font: 700 1.9em/1 var(--display); z-index: 5; pointer-events: none; text-shadow: 0 0 6px #000, 0 2px 2px #000; animation: rise 1.2s ease-out forwards; white-space: nowrap; }
.float.dmg { color: #ff8f73; } .float.heal { color: #8fe0c2; } .float.blk { color: #c9d6f0; font-size: 1.05em; }
@keyframes glow { from { box-shadow: 0 0 0 2px var(--gold-text), 0 0 6px 2px rgba(217,183,99,.35); } to { box-shadow: 0 0 0 3px #f6e3a6, 0 0 18px 7px rgba(217,183,99,.7); } }
@keyframes shake { 20% { transform: translateX(-5px); } 45% { transform: translateX(5px); } 70% { transform: translateX(-3px); } }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.7); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -110%); } }

/* ---------- battle dock ---------- */
#dock { height: var(--dock); flex: none; display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 10px; background: var(--raised); border-top: 1px solid var(--gold-shade); }
.coach { flex: 1; min-height: 0; overflow-y: auto; font-size: 15.5px; line-height: 1.26; }
.coach p { text-wrap: pretty; }
.who { font: 600 10px/1.4 var(--display); letter-spacing: .14em; color: var(--gold-text); text-transform: uppercase; display: block; }
.coach.nudge { animation: shake .4s; }
.chips { display: flex; gap: 6px; margin-top: 5px; overflow-x: auto; scrollbar-width: none; }
.chip { flex: none; white-space: nowrap; font-size: 13px; line-height: 1.2; border: 1px solid var(--line); border-radius: 99px; padding: 2px 4px 2px 9px; display: inline-flex; align-items: center; gap: 4px; background: var(--surface); min-height: 26px; }
.chip button { width: 22px; height: 22px; border-radius: 50%; color: var(--muted); font-size: 15px; line-height: 1; }
button.chip { padding: 2px 10px; border-color: var(--gold-shade); color: var(--gold-text); }
.ctl { flex: none; display: flex; align-items: center; gap: 10px; height: 40px; }
.ap { display: flex; align-items: center; gap: 4px; }
.ap span { font: 600 10px/1 var(--display); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-right: 3px; }
.pip { width: 15px; height: 15px; border-radius: 50%; border: 1px dashed var(--gold-shade); display: inline-block; flex: none; }
.pip.on { border: 1px solid var(--gold-shade); background: radial-gradient(circle at 35% 30%, #f1dc9a, var(--gold-leaf) 60%, var(--gold-shade)); }
.belt { display: flex; gap: 6px; min-width: 0; }
.belt .item { height: 38px; display: flex; align-items: center; gap: 6px; padding: 2px; border: 1px solid #8a3a2e; border-radius: 6px; background: #1c130c; font-size: 14px; white-space: nowrap; }
.belt .item img { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; display: block; }
.belt .item.solo { padding-right: 9px; }
.belt .item.focus { animation: glow 1.1s ease-in-out infinite alternate; }
.belt .item:disabled { opacity: .45; cursor: default; }
.grow { flex: 1; }
.btn { height: 40px; padding: 0 16px; border-radius: 6px; font: 700 12.5px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; color: #2a1d14;
  background: linear-gradient(#e9cf85, var(--gold-leaf)); border: 1px solid var(--gold-shade); box-shadow: 0 2px 6px rgba(0,0,0,.45); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.quiet { background: none; color: var(--gold-text); border-color: var(--gold-shade); box-shadow: none; }
.btn.focus { animation: glow 1.1s ease-in-out infinite alternate; }
.btn.big { height: 50px; font-size: 14px; }

/* ---------- sheets and panels ---------- */
#sheet:empty, #over:empty { display: none; }
#sheet { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(12,8,5,.6); }
.sheet { width: min(560px, 100%); max-height: 88dvh; overflow-y: auto; background: var(--raised); border: 1px solid var(--gold-shade); border-bottom: 0; border-radius: 14px 14px 0 0; padding: 14px 14px 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -10px 30px rgba(0,0,0,.6); }
.sheet .hint { font-style: italic; color: var(--gold-text); }
.sheet .top { display: flex; gap: 12px; align-items: flex-start; }
.sheet .pic { width: 118px; aspect-ratio: 5 / 4; object-fit: cover; object-position: 50% 30%; border-radius: 6px; border: 2px solid var(--gold-leaf); flex: none; }
.sheet h2 { font: 600 20px/1.2 var(--display); letter-spacing: .04em; }
.sheet .kind { font-style: italic; color: var(--muted); margin: 0 0 4px; }
.sheet .nums { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 15px; }
.sheet .nums b { font-family: var(--display); }
.credit { font-size: 12.5px; font-style: italic; color: var(--muted); margin-top: 4px; }
.x { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); color: var(--muted); font-size: 20px; line-height: 1; flex: none; }
.rule { font-size: 15.5px; line-height: 1.3; }
.rule b { font: 600 11px/1.2 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--gold-text); display: block; margin-bottom: 2px; }
.rule.off { color: var(--muted); }
.acts { display: flex; flex-direction: column; gap: 7px; }
.act { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; text-align: left; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--gold-shade); background: var(--surface); }
.act strong { font: 600 15px/1.2 var(--display); letter-spacing: .04em; }
.act .cost { display: flex; gap: 3px; align-items: center; }
.act .cost .pip { width: 12px; height: 12px; }
.act small { grid-column: 1 / -1; font-size: 14.5px; color: var(--muted); line-height: 1.25; }
.act:disabled { opacity: .42; cursor: default; }
.act.focus { animation: glow 1.1s ease-in-out infinite alternate; }
#over { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; padding: 20px; background: rgba(12,8,5,.8); overflow-y: auto; }
.panel { width: min(440px, 100%); background: var(--raised); border: 2px solid var(--gold-leaf); box-shadow: inset 0 0 0 1px var(--gold-shade), 0 20px 50px rgba(0,0,0,.7); border-radius: 14px; padding: 26px 22px 22px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.panel > svg { width: 44px; height: 44px; fill: var(--gold-leaf); }
.eyebrow { font: 600 11px/1.2 var(--display); letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
.panel h1 { font: 600 34px/1.1 var(--display); letter-spacing: .03em; color: var(--gold-text); text-wrap: balance; }
.panel p { font-size: 17px; line-height: 1.35; text-wrap: pretty; }
.btns { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 6px; }
.btns .btn { width: 100%; height: 46px; }
.panel ul { margin: 0; padding: 0; list-style: none; text-align: left; font-size: 15.5px; line-height: 1.3; display: flex; flex-direction: column; gap: 4px; }
.panel li::before { content: "◆ "; color: var(--gold-leaf); font-size: 10px; vertical-align: 2px; }
.ledger { width: 100%; border-top: 1px solid var(--line); font-size: 16px; }
.ledger div { display: flex; justify-content: space-between; gap: 12px; padding: 5px 2px; border-bottom: 1px solid var(--line); text-align: left; }
.ledger b { font-family: var(--display); color: var(--gold-text); white-space: nowrap; }
.ledger .tot { font-family: var(--display); letter-spacing: .06em; text-transform: uppercase; font-size: 14px; }

/* ---------- pages outside the battle ---------- */
#page { height: 100%; display: flex; flex-direction: column; }
#view { flex: 1; min-height: 0; overflow-y: auto; }
.wrap { max-width: 880px; margin: 0 auto; padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 16px; }
#nav { flex: none; display: flex; border-top: 1px solid var(--gold-shade); background: var(--raised); }
#nav button { flex: 1; height: 54px; font: 600 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
#nav button.on { color: var(--gold-text); box-shadow: inset 0 2px 0 var(--gold-leaf); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar h1 { font: 600 24px/1.15 var(--display); letter-spacing: .05em; }
.gold { display: inline-flex; align-items: center; gap: 7px; font: 700 18px/1 var(--display); white-space: nowrap; }
.crowns { display: inline-flex; align-items: center; gap: 6px; font: 700 18px/1 var(--display); white-space: nowrap; color: var(--gold-text); }
.crowns svg { width: 20px; height: 20px; fill: var(--gold-leaf); }
.gold::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f1dc9a, var(--gold-leaf) 60%, var(--gold-shade)); box-shadow: inset 0 0 0 1px var(--gold-shade); }
.lede { font-size: 17px; line-height: 1.35; color: var(--muted); text-wrap: pretty; }
.hero-screen { min-height: 100%; display: grid; place-items: center; padding: 24px 18px; background: linear-gradient(rgba(23,17,12,.72), rgba(23,17,12,.93)), url(img/board-st-george.jpg) center / cover no-repeat; }
.title { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; max-width: 440px; width: 100%; }
.title > svg { width: 60px; height: 60px; fill: var(--gold-leaf); }
.title h1 { font: 600 40px/1.05 var(--display); letter-spacing: .06em; color: var(--gold-text); text-transform: uppercase; }
.title h1 span { font-size: .62em; display: block; letter-spacing: .3em; color: var(--ink); margin: 4px 0; }
.title .lede { color: var(--ink); }
.title .meta { display: flex; gap: 18px; align-items: center; justify-content: center; margin-top: 4px; color: var(--muted); font-style: italic; }
.link { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; padding: 8px; }
.tabs { display: flex; gap: 6px; }
.tabs button { padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); font: 600 11px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tabs button.on { border-color: var(--gold-leaf); color: var(--gold-text); }
.grid { --cw: 108px; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 16px 12px; padding-top: 6px; }
.grid .card { width: 100%; height: auto; aspect-ratio: 1 / 1.08; cursor: pointer; }
.empty { color: var(--muted); font-style: italic; padding: 20px 0; }
.box { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.box h2 { font: 600 13px/1.2 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--gold-text); }
.box.focus { animation: glow 1.1s ease-in-out infinite alternate; }

/* line-up */
.meter { min-width: 150px; text-align: right; font: 600 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-radius: 6px; padding: 4px; }
.meter b { font-size: 20px; color: var(--ink); }
.meter.over b { color: #ff8f73; }
.meter .spare { display: block; margin-top: 6px; font: italic 400 13px/1 var(--serif); letter-spacing: 0; text-transform: none; color: var(--gold-text); }
.meter .track { height: 6px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
.meter .track i { display: block; height: 100%; background: var(--gold-leaf); }
.meter.over .track i { background: var(--vermilion); }
.meter.focus { animation: glow 1.1s ease-in-out infinite alternate; }
.tip { background: var(--ultramarine); border: 1px solid var(--gold-shade); border-radius: 10px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; }

// =====================================================================================
// The tutorial: a scripted fight

// =====================================================================================
// Saved progress (this browser only)
// =====================================================================================
const SAVE_KEY = "crown-and-fable-save-1";
const CORE_FRONT = ["knight", "crossbowman", "longbowman", "leshy", "monk", "berserker"];
const STARTER_ITEMS = ["gingerbread", "golden-apple", "dragons-blood"];
const PRICES = { pack: 50, front: 20, Common: 40, Rare: 100, Legendary: 250 };
const PAY = { win: 30, loss: 15, bonus: 5 };
const RENOWN_CAP = 50, BELT = 3, START_GOLD = 50;
const emptyLineup = () => ({ crown: "", heroes: ["", ""], front: ["", "", ""], items: ["", "", ""] });
const fresh = () => ({ v: 1, nightSeen: false, tutorialDone: false, packOpened: false, gold: 0, heroes: {}, front: {}, items: {}, lineup: emptyLineup(), crowns: 0, wins: 0, losses: 0, draws: 0, dry: 0, tip: 0 });
function load() { try { const g = JSON.parse(localStorage.getItem(SAVE_KEY)); if (g && g.v === 1) { if (g.crowns == null) g.crowns = (g.wins || 0) + (g.tutorialDone ? 1 : 0); return Object.assign(fresh(), g); } } catch (e) {} return fresh(); }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} }
let G = load();

const kindOf = (id) => (DATA.heroes[id] ? "hero" : DATA.front[id] ? "front" : DATA.items[id] ? "item" : null);
const defOf = (id) => DATA.heroes[id] || DATA.front[id] || DATA.items[id];
const bag = (id) => ({ hero: G.heroes, front: G.front, item: G.items }[kindOf(id)]);
const owned = (id) => (id === "villager" ? Infinity : bag(id)[id] || 0);
function give(id, n = 1) { if (id === "villager") return; const b = bag(id); b[id] = (b[id] || 0) + n; }
function take(id, n = 1) { if (id === "villager") return; const b = bag(id); b[id] = Math.max(0, (b[id] || 0) - n); if (!b[id]) delete b[id]; }
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const PAIR = ["grendel", "grendels-mother"];

// The first pack, revealed in this order: the front rank grouped by type (one of each of the six, with two random
// types topped up to six copies), three common items, then the whole St George set and one hero from another
// realm (never Baba Yaga or the Grendel pair).
function firstPack() {
  const [a, b] = shuffle(CORE_FRONT);
  const front = CORE_FRONT.flatMap((id) => Array(id === a || id === b ? 6 : 1).fill(id))
    .sort((x, y) => (x === a || x === b) - (y === a || y === b));

  return [...front, ...STARTER_ITEMS, "the-princess", "the-dragon", "st-george", pick(others).id];
}
// A Fable pack: 4 front-rank cards and 2 items; about 1 pack in 5 swaps an item for a hero.
function fablePack() {
  const pool = [...CORE_FRONT, ...CORE_FRONT, "grandmother", "geat-thane", "mere-beast"];
  const cards = [0, 1, 2, 3].map(() => pick(pool));
  const item = () => { const r = Math.random(), rar = r < 0.05 ? "Legendary" : r < 0.3 ? "Rare" : "Common"; return pick(Object.values(DATA.items).filter((x) => x.rarity === rar)).id; };

    const can = Object.values(DATA.heroes).filter((h) => owned(h.id) < 3);

// ---------- line-up ----------
const SLOTS = ["crown", "h0", "h1", "f0", "f1", "f2", "i0", "i1", "i2"];

const fielded = (lu) => SLOTS.map((s) => getSlot(lu, s)).filter(Boolean);
const usedIn = (lu, id, except) => SLOTS.filter((s) => s !== except && getSlot(lu, s) === id).length;
const hasKoschei = (lu) => [lu.crown, ...lu.heroes].includes("koschei");
const renownOf = (lu) => SLOTS.reduce((sum, s) => { const id = getSlot(lu, s); return sum + (id && !(s === "f2" && hasKoschei(lu)) ? defOf(id).renown || 0 : 0); }, 0);

  for (const s of SLOTS) { const id = getSlot(G.lineup, s); if (id && usedIn(G.lineup, id) > owned(id)) setSlot(G.lineup, s, ""); }
}

  const out = [], hs = [lu.crown, ...lu.heroes].filter(Boolean), r = renownOf(lu);

  return out;
}
function autoFill() {
  const lu = emptyLineup(); let left = RENOWN_CAP;
  const hs = Object.keys(G.heroes).filter((id) => !PAIR.includes(id)).sort((a, b) => (DATA.heroes[b].tale === "St George and the Dragon") - (DATA.heroes[a].tale === "St George and the Dragon") || DATA.heroes[b].renown - DATA.heroes[a].renown);
  const chosen = [];
  for (const id of hs) { if (chosen.length < 3 && DATA.heroes[id].renown <= left - 6 && id !== "baba-yaga") { chosen.push(id); left -= DATA.heroes[id].renown; } }
  chosen.sort((a, b) => DATA.heroes[b].stats.health - DATA.heroes[a].stats.health);
  lu.crown = chosen[0] || ""; lu.heroes = [chosen[1] || "", chosen[2] || ""];

function battleCard(c, v, opts = {}) {
  const side = c.side, mine = side === 0, g = step();
  const cls = ["card", c.kind === "hero" ? "hero" : "front"];
  const order = S.plan && S.plan.orders.find((o) => o.uid === c.uid);

    if (S.pick) {

      cls.push(ok ? "can" : "dim");

      if (g.focus === "front" && mine && c.kind === "front") cls.push("focus");

    label: `${mine ? "Your" : "Enemy"} ${c.name}${crown ? ", wearing the Crown" : ""}: ${c.health} of ${c.maxHealth} Health, Attack ${c.atk}, Guard ${c.guard}, Speed ${c.spd}${c.kind === "hero" ? "" : ", acts on its own"}` });

    const id = p.cards[p.i], kind = kindOf(id), d = defOf(id), star = kind === "hero" || d.rarity === "Legendary";
    const seen = p.cards.slice(0, p.i).filter((x) => x === id).length;
    const of = p.cards.filter((x) => x === id).length;
    const label = kind === "hero" ? "A hero" : kind === "front" ? `Front rank · ${d.name}${of > 1 ? ` ${seen + 1} of ${of}` : ""}` : `${d.rarity} item`;
    return `<div class="opening"><p class="eyebrow">Card ${p.i + 1} of ${n} · ${esc(label)}</p>
      <button class="reveal${star ? " star" : ""}" data-act="pack-next" aria-label="${esc(d.name)}. Next card">${fullCard(id)}</button>
      <div class="stack" aria-hidden="true">${p.cards.map((_, k) => `<i class="${k <= p.i ? "done" : ""}"></i>`).join("")}</div>
      <div class="row" style="width:min(310px,84vw)"><button class="btn" data-act="pack-next">${p.i === n - 1 ? "See them all" : "Next card"}</button>${p.i < n - 2 ? `<button class="btn quiet" data-act="pack-all">Reveal all</button>` : ""}</div></div>`;
  }
  const counts = {}; p.cards.forEach((id) => (counts[id] = (counts[id] || 0) + 1));
  const group = (kind) => Object.keys(counts).filter((id) => kindOf(id) === kind);
  const section = (kind, label) => { const ids = group(kind); return ids.length ? `<p class="rowlabel" style="text-align:left">${label}</p>
    <div class="grid">${ids.map((id) => staticCard(id, { attrs: `data-act="detail" data-id="${id}"`, count: counts[id] > 1 ? `×${counts[id]}` : "" })).join("")}</div>` : ""; };
  return `<div class="wrap"><div class="bar"><h1>${esc(p.title)}</h1><span class="eyebrow">${n} cards</span></div>
    ${section("hero", "Heroes")}${section("item", "Items · for your tool belt")}${section("front", "Front rank · acts on its own")}
    <p class="lede">Tap any card to read it.</p>
    <div class="row"><button class="btn big" data-go="${p.first ? "formation" : "shop"}">${p.first ? "Build your line-up" : "Back to the shop"}</button>${p.first ? "" : `<button class="btn big quiet" data-go="formation">Line-up</button>`}</div></div>`;
}
function collectionHtml() {
  const tabs = [["hero", "Heroes"], ["front", "Front rank"], ["item", "Items"]];
  const src = { hero: G.heroes, front: { villager: Infinity, ...G.front }, item: G.items }[U.tab];
  const ids = Object.keys(src).sort((a, b) => (defOf(a).realm || "").localeCompare(defOf(b).realm || "") || defOf(a).name.localeCompare(defOf(b).name));
  const total = Object.values(G.heroes).reduce((a, b) => a + b, 0) + Object.values(G.front).reduce((a, b) => a + b, 0) + Object.values(G.items).reduce((a, b) => a + b, 0);
  return `<div class="wrap"><div class="bar"><h1>Your cards</h1><span style="display:flex;gap:14px;align-items:center">${`<span class="crowns" aria-label="${G.crowns} Crown${G.crowns === 1 ? "" : "s"} won" title="Crowns won">${CROWN_SVG}${G.crowns}</span>`}<span class="eyebrow">${total} cards</span></span></div>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${U.tab === k}" class="${U.tab === k ? "on" : ""}" data-tab="${k}">${l}</button>`).join("")}</div>
    ${ids.length ? `<div class="grid">${ids.map((id) => staticCard(id, { attrs: `data-act="detail" data-id="${id}"`, count: id === "villager" ? "∞" : src[id] > 1 ? `×${src[id]}` : "" })).join("")}</div>` : `<p class="empty">None yet. Items come in Fable packs and from the shop.</p>`}
    <p class="lede">${U.tab === "hero" ? "Heroes are yours to keep and come only from packs." : U.tab === "front" ? "A front-rank card that dies in a fight is gone for good. Villagers are free and never run out." : "Items are single use: one that is used in a fight leaves your collection."}</p></div>`;
}
const TIPS = [
  { say: "Every card has a Renown cost, shown when you choose it for a slot. Your whole line-up may cost at most 50 Renown, so you can't simply field all your strongest cards. Win with Renown to spare and you earn 1 gold for each unspent point.", focus: "meter" },
  { say: "The hero in the bottom slot wears the Crown. Only that hero's Crown passive is switched on, and if they fall you lose. Any hero can wear it, so each of yours plays differently there.", focus: "crown" },
  { say: "Bonds work in any slot. Heroes from the same tale or realm strengthen each other, so St George, the Dragon and the Princess are at their best together.", focus: "bonds" },
  { say: "Front-rank cards act on their own. One that dies in a fight is gone for good; survivors come back. Villagers are free and never run out.", focus: "front" },
  { say: "Your tool belt carries up to 3 items. An item is single use: once used in a fight, it leaves your collection.", focus: "belt" },
  { say: "Fights last until a Crown falls. If one reaches round 8, night falls: healing stops and every card takes rising damage each round, so plan to win or to outlast it.", focus: "" },
  { say: "Fill your slots and press Fight. Every fight pays gold, win or lose, and gold buys Fable packs in the shop.", focus: "fight" },
];
function formationHtml() {
  const lu = G.lineup, r = renownOf(lu), tip = TIPS[G.tip], f = tip ? tip.focus : "", bad = issues(lu), kos = hasKoschei(lu);
  const slot = (s, label) => {
    const id = s === "f2" && kos ? "the-needle" : getSlot(lu, s), glow = (f === "crown" && s === "crown") || (f === "front" && s[0] === "f") || (f === "belt" && s[0] === "i");
    if (s === "f2" && kos) return staticCard("the-needle", { cls: ["off"], attrs: `data-act="detail" data-id="the-needle"` });
    if (id) return staticCard(id, { cls: glow ? ["focus"] : [], attrs: `data-act="slot" data-slot="${s}"`, crown: s === "crown" });
    return `<button class="card slot pick${glow ? " focus" : ""}" data-act="slot" data-slot="${s}" aria-label="Empty ${label} slot. Choose a card"><b>+</b>${label}</button>`;
  };
  const hs = [lu.crown, ...lu.heroes].filter(Boolean).map((id) => DATA.heroes[id]);
  const tally = (key) => Object.entries(hs.reduce((m, h) => ((m[h[key]] = (m[h[key]] || 0) + 1), m), {})).filter(([, n]) => n > 1).map(([k, n]) => `<span class="tag">${esc(k)} × ${n}</span>`).join("");
  const bonds = hs.length ? `${lu.crown ? `<p class="rule"><b>Crown passive · ${esc(DATA.heroes[lu.crown].name)}</b>${esc(DATA.heroes[lu.crown].crownPassive.text)}</p>` : ""}
    ${hs.map((h) => `<p class="rule"><b>Bond · ${esc(h.name)}</b>${esc(h.bond.text)}</p>`).join("")}
    <div class="tags">${tally("tale")}${tally("realm")}</div>` : `<p class="rule off">Choose your heroes to see their Crown passive and Bonds here.</p>`;
  return `<div class="wrap"><div class="bar"><h1>Line-up</h1>
      <div class="meter${r > RENOWN_CAP ? " over" : ""}${f === "meter" ? " focus" : ""}" role="img" aria-label="${r} of ${RENOWN_CAP} Renown used">Renown <b>${r}</b> / ${RENOWN_CAP}<div class="track"><i style="width:${Math.min(100, (r / RENOWN_CAP) * 100)}%"></i></div>${r < RENOWN_CAP ? `<span class="spare">+${RENOWN_CAP - r} gold if you win</span>` : ""}</div></div>
    ${tip ? `<div class="tip" aria-live="polite"><p>${tip.say}</p><button class="btn" data-act="tip">${G.tip === TIPS.length - 1 ? "Got it" : "Next"}</button></div>` : ""}
    <div class="form"><div class="wrap" style="padding:0;gap:10px">
      <p class="rowlabel">Front rank · acts on its own</p>
      <div class="pyr"><div class="rank">${slot("f0", "Front")}${slot("f1", "Front")}${slot("f2", "Front")}</div>
        <div class="rank">${slot("h0", "Hero")}${slot("h1", "Hero")}</div>
        <div class="rank">${slot("crown", "Crown")}</div></div>
      <p class="rowlabel">The Crown · lose this hero and you lose</p>
      <div class="beltrow">${slot("i0", "Item")}${slot("i1", "Item")}${slot("i2", "Item")}</div>
      <p class="rowlabel">Tool belt · up to ${BELT} items</p></div>
    <div class="wrap" style="padding:0;gap:12px">
      <div class="box${f === "bonds" ? " focus" : ""}"><h2>Crown and Bonds</h2>${bonds}</div>
      ${bad.length ? `<p class="issues" role="alert">${bad.join(" ")}</p>` : ""}
      <div class="row"><button class="btn quiet" data-act="autofill">Fill it for me</button><button class="btn quiet" data-act="clear">Clear</button></div>
      <button class="btn big${f === "fight" && !bad.length ? " focus" : ""}" data-act="fight"${bad.length ? " disabled" : ""}>Fight</button></div></div></div>`;
}
function pickerSheet(sh) {
  const s = sh.slot, kind = slotKind(s), lu = G.lineup, cur = getSlot(lu, s);
  const src = { hero: G.heroes, front: { villager: Infinity, ...G.front }, item: G.items }[kind];
  const room = RENOWN_CAP - renownOf(lu) + (cur ? defOf(cur).renown : 0);
  const rows = Object.keys(src).sort((a, b) => defOf(a).renown - defOf(b).renown || defOf(a).name.localeCompare(defOf(b).name)).map((id) => {
    const d = defOf(id), left = owned(id) - usedIn(lu, id, s);
    const why = left <= 0 ? "Already in your line-up" : d.renown > room ? `Needs ${d.renown - room} more Renown` : id === "baba-yaga" && s !== "crown" ? "She will only wear the Crown" : "";
    const sub = kind === "hero" ? `${d.aspect} · ${d.realm} · Attack ${d.stats.attack}, Health ${d.stats.health}, Speed ${d.stats.speed}` : kind === "front" ? `Speed ${d.speed}. ${d.auto}` : d.effect;
    return `<button class="opt" data-act="choose" data-id="${id}"${why ? " disabled" : ""}>${img(id)}<strong>${esc(d.name)}${left > 1 && left !== Infinity ? ` × ${left}` : ""}</strong>
      <small>${why ? esc(why) + ". " : ""}${esc(sub)}</small><span class="cost">${d.renown} Renown</span></button>`;
  });
  const title = s === "crown" ? "Who wears the Crown?" : kind === "hero" ? "Choose a hero" : kind === "front" ? "Choose a front-rank card" : "Choose an item";
  return `<div class="sheet" role="dialog" aria-label="${title}"><div class="top"><div><h2>${title}</h2><p class="kind">${room} Renown to spend on this slot</p></div><button class="x" data-act="close" aria-label="Close">×</button></div>
    ${cur ? `<div class="row"><button class="btn quiet" data-act="detail" data-id="${cur}">Read ${esc(short(defOf(cur).name))}</button><button class="btn quiet" data-act="choose" data-id="">Empty this slot</button></div>` : ""}
    <div class="options">${rows.join("") || `<p class="empty">You have none of these yet.</p>`}</div></div>`;
}
function shopHtml() {
  const can = (n) => (G.gold >= n ? "" : " disabled");
  const fr = CORE_FRONT.map((id) => `<button class="opt" data-act="buy" data-id="${id}"${can(PRICES.front)}>${img(id)}<strong>${esc(DATA.front[id].name)}</strong><small>You have ${owned(id)}. ${esc(DATA.front[id].auto)}</small><span class="cost">${PRICES.front} gold</span></button>`).join("");
  const its = Object.values(DATA.items).sort((a, b) => PRICES[a.rarity] - PRICES[b.rarity] || a.name.localeCompare(b.name)).map((d) => `<button class="opt" data-act="buy" data-id="${d.id}"${can(PRICES[d.rarity])}>${img(d.id)}<strong>${esc(d.name)}</strong><small>${esc(d.rarity)}. You have ${owned(d.id)}. ${esc(d.effect)}</small><span class="cost">${PRICES[d.rarity]} gold</span></button>`).join("");

      <h2>Fable pack</h2><p>Four front-rank cards and two items. About one pack in five holds a hero in place of an item.</p>

function detailSheet(sh) {
  return `<div class="sheet" role="dialog" aria-label="${esc(defOf(sh.id).name)}" style="align-items:center"><div class="top" style="width:100%"><p class="credit" style="flex:1;margin:0">${creditOf(sh.id)}</p><button class="x" data-act="close-detail" aria-label="Close">×</button></div>${fullCard(sh.id)}</div>`;
}

// ---------- panels ----------
function overHtml() {
  const o = U.over; if (!o) return "";
  if (o.type === "menu") {
    return `<div class="panel"><p class="eyebrow">Crown &amp; Fable</p><h1>${esc(S.board.name)}</h1>
      <div class="btns"><button class="btn" data-act="resume">Back to the fight</button>
      <button class="btn quiet" data-act="sound" aria-pressed="${!SND.muted}">Sound: ${SND.muted ? "off" : "on"}</button>
      <button class="btn quiet" data-act="motion" aria-pressed="${G.motion !== false}">Card animations: ${G.motion === false ? "off" : "on"}</button>
      ${S.kind === "tutorial" ? `<button class="btn quiet" data-act="tutorial">Restart the tutorial</button><button class="btn quiet" data-act="leave">Leave the tutorial</button>`
        : `<button class="btn quiet" data-act="concede">Concede this fight</button>`}</div>
      ${S.kind === "tutorial" ? "" : `<p class="credit">Conceding counts as a defeat. Cards already lost stay lost.</p>`}</div>`;
  }
  if (o.type === "gaps") {
    return `<div class="panel" style="text-align:left;align-items:stretch"><p class="eyebrow" style="text-align:center">Before you fight</p><h1 style="text-align:center">Check your line-up</h1>
      <ul>${o.gaps.map((g) => `<li>${esc(g)}</li>`).join("")}</ul>
      <p style="font-size:15.5px;color:var(--muted)">Unspent Renown pays 1 gold a point if you win, so a lean line-up can be a choice.</p>
      <div class="btns"><button class="btn" data-go="formation">Back to my line-up</button><button class="btn quiet" data-act="fight-anyway">Fight anyway</button></div></div>`;
  }
  if (o.type === "night") {
    return `<div class="panel" style="text-align:left;align-items:stretch"><p class="eyebrow" style="text-align:center">Round ${E.NIGHTFALL_ROUND}</p><h1 style="text-align:center">Night falls</h1>${NIGHT_RULES}
      <div class="btns"><button class="btn" data-act="night-ok">Into the dark</button></div><p class="credit" style="text-align:center">Tap the round counter at any time to read this again.</p></div>`;
  }
  if (o.type === "tutorial-end") {
    if (o.winner !== 0) return `<div class="panel"><p class="eyebrow">Tutorial</p><h1>${o.winner === 1 ? "Defeat" : "A draw"}</h1><p>The Crown fell. Try the tutorial again.</p><div class="btns"><button class="btn" data-act="tutorial">Try again</button></div></div>`;
    return `<div class="panel">${CROWN_SVG}<p class="eyebrow">Tutorial complete</p><h1>Victory</h1>
      <p>The Dragon is down and the Princess keeps her Crown.${o.first ? " You have taken your first enemy Crown." : ""}</p>
      ${o.first ? `<div class="ledger"><div class="tot"><span>Crowns won</span><b>${G.crowns}</b></div></div>` : ""}
      <ul><li>Protect your Crown; take theirs.</li><li>3 action points a round, one action per hero.</li><li>The front rank acts on its own, every round.</li><li>Fastest acts first; the Fate token breaks ties and crosses the board each round.</li><li>Items act before any card.</li><li>Night falls in round 8: no healing, and every card takes rising damage.</li></ul>
      <div class="btns"><button class="btn" data-act="after-tutorial">Continue</button></div></div>`;
  }
  const names = (ids) => { const c = {}; ids.forEach((id) => (c[id] = (c[id] || 0) + 1)); return Object.entries(c).map(([id, n]) => `${defOf(id).name}${n > 1 ? ` × ${n}` : ""}`).join(", "); };
  return `<div class="panel">${o.winner === 0 ? CROWN_SVG : ""}<p class="eyebrow">Round ${o.round} · against ${esc(S.foeName)}</p>
    <h1>${o.winner === 0 ? "Victory" : o.winner === 1 ? "Defeat" : "A draw"}</h1>
    <div class="ledger">${o.lines.map(([l, n]) => `<div><span>${esc(l)}</span><b>+${n}</b></div>`).join("")}<div class="tot"><span>Your gold</span><b>${G.gold}</b></div>${o.winner === 0 ? `<div class="tot"><span>Crowns won</span><b>${G.crowns}</b></div>` : ""}</div>
    <p style="font-size:15.5px">${o.lostFront.length ? `Fell in the front rank, and gone for good: ${esc(names(o.lostFront))}.` : "Your front rank all came home."}${o.usedItems.length ? ` Used up: ${esc(names(o.usedItems))}.` : ""}</p>
    <div class="btns"><button class="btn" data-act="fight">Fight again</button><button class="btn quiet" data-go="formation">Line-up</button><button class="btn quiet" data-go="shop">Shop</button><button class="btn quiet" data-go="home">Home</button></div></div>`;
}
function sheetHtml() {
  const sh = U.sheet; if (!sh) return "";
  return { card: cardSheet, item: itemSheet, targets: targetSheet, picker: pickerSheet, detail: detailSheet, night: nightSheet }[sh.type](sh);
}
function render() {
  const battle = U.screen === "battle";
  el("battle").hidden = !battle; el("page").hidden = battle;
  if (battle) renderBattle(); else renderPage();
  el("sheet").innerHTML = sheetHtml();
  el("over").innerHTML = overHtml();
}

// =====================================================================================
// Input
// =====================================================================================
function go(screen) {
  if (!G.packOpened && !["home", "ready"].includes(screen)) screen = "home";
  clearTimeout(S.timer);
  Object.assign(U, { screen, sheet: null, over: null, confirmReset: false });
  if (screen === "formation") prune();
  render();
}
function chooseForSlot(id) {
  const s = U.sheet.slot, lu = G.lineup;
  if (id === "baba-yaga") { if (s !== "crown") return; }
  setSlot(lu, s, id); U.sheet = null; save(); render();
}
function buy(id) {
  const price = kindOf(id) === "front" ? PRICES.front : PRICES[DATA.items[id].rarity];
  if (G.gold < price) return;
  G.gold -= price; give(id); save(); render();
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act],[data-go],[data-tab]");
  if (!t) { if (e.target.id === "sheet" && !step()) { U.sheet = U.sheet && U.sheet.back ? U.sheet.back : null; render(); } return; }
  if (t.disabled) return;
  if (S.animating && !["skip", "speed", "sound", "menu"].includes(t.dataset.act)) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.tab) { U.tab = t.dataset.tab; return render(); }
  const act = t.dataset.act, d = t.dataset;
  switch (act) {
    case "card": tapCard(+d.uid); break;
    case "action": chooseAction(+d.k); break;
    case "item": tapItem(d.id); break;
    case "use-item": useItem(); break;
    case "target": completePick(+d.uid); render(); break;
    case "mark": { const m = markInfo(); beginPick({ kind: "mark", key: m.key, name: m.name }, m.cards); render(); break; }
    case "lock": lock(); break;
    case "next": { const g = step(); if (g && g.next) { advance(); render(); } break; }
    case "skip": endPlayback(); break;
    case "speed": G.fast = !G.fast; save(); if (!S.animating) { clearTimeout(S.timer); S.timer = setTimeout(nextFrame, 250); } render(); break;
    case "sound": SND.setMuted(!SND.muted); if (!SND.muted) SND.play("ping"); render(); break;
    case "motion": G.motion = G.motion === false; save(); render(); break;
    case "night": if (!step() && !S.pick) { U.sheet = { type: "night" }; render(); } break;
    case "night-ok": G.nightSeen = true; save(); U.over = null; render(); break;
    case "close": U.sheet = null; render(); break;
    case "close-detail": U.sheet = U.sheet.back || null; render(); break;
    case "cancel": S.pick = null; render(); break;
    case "del-order": S.plan.orders.splice(+d.k, 1); render(); break;
    case "del-item": S.plan.items.splice(+d.k, 1); render(); break;
    case "menu": if (S.phase === "play") endPlayback(); if (S.phase !== "over") { U.over = { type: "menu" }; render(); } break;
    case "resume": U.over = null; render(); break;
    case "concede": U.over = null; concede(); break;
    case "leave": go("home"); break;
    case "tutorial": startTutorial(); break;
    case "after-tutorial": G.tutorialDone = true; save(); go(G.packOpened ? "home" : "ready"); break;
    case "open-first": G.packOpened = true; G.tutorialDone = true; G.gold += START_GOLD; U.over = null;
      openPack(firstPack(), { title: "Your first Fable pack", first: true }); render(); break;
    case "pack-next": U.pack.i += 1; render(); break;
    case "pack-all": U.pack.i = U.pack.cards.length; render(); break;
    case "detail": U.sheet = { type: "detail", id: d.id, back: U.sheet && U.sheet.type === "picker" ? U.sheet : null }; render(); break;
    case "slot": U.sheet = { type: "picker", slot: d.slot }; render(); break;
    case "choose": chooseForSlot(d.id); break;
    case "tip": G.tip += 1; save(); render(); break;
    case "autofill": autoFill(); save(); render(); break;
    case "clear": G.lineup = emptyLineup(); save(); render(); break;
    case "fight": U.over = null; startFight(); break;
    case "fight-anyway": U.over = null; startFight(true); break;
    case "buy": buy(d.id); break;
    case "buy-pack": if (G.gold >= PRICES.pack) { G.gold -= PRICES.pack; openPack(fablePack(), { title: "Fable pack" }); render(); } break;
    case "reset": if (U.confirmReset) { G = fresh(); save(); U.confirmReset = false; go("home"); } else { U.confirmReset = true; render(); } break;
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && U.sheet && !step()) { U.sheet = U.sheet.back || null; render(); } });
if (G.tutorialDone && !G.packOpened) U.screen = "ready";
render();
</script>
