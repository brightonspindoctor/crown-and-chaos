name: Commons lookup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["art/lookups.json"]

concurrency:
  group: repo-writers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/commons-lookup.mjs
      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A art
          git diff --cached --quiet || git commit -m "Commons lookup report"
          git pull --rebase -X theirs
          git push
