name: Fetch art

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["art/manifest.json"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - run: node scripts/fetch-art.mjs
      - run: node scripts/build-credits.mjs
      - name: Commit new images and credits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/images art/fetch-report.json CREDITS.md
          git diff --cached --quiet || git commit -m "Fetch art and rebuild credits"
          git pull --rebase
          git push
